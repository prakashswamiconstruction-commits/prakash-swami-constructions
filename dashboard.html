px 11px;font-weight:850}.btn.edit{background:#fff7df;color:#8a6100}.btn.danger{background:#fff0f0;color:#b42318}.btn.ok{background:#ecfdf3;color:#087443}.btn.blue{background:#eff6ff;color:#1d4ed8}.btn.dark{background:#111827;color:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:820px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);white-space:nowrap}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;background:#f1f5f9;font-size:10px;font-weight:850}.green{background:#ecfdf3;color:#087443}.red{background:#fff1f2;color:#be123c}.goldpill{background:#fff7df;color:#8a6100}.progress{height:9px;background:#edf0f5;border-radius:99px;overflow:hidden;min-width:100px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#d7a43b,#16a34a);border-radius:99px}.profile{display:grid;grid-template-columns:125px 1fr;gap:22px;align-items:center}.avatar{width:115px;height:115px;border-radius:50%;object-fit:cover;background:#eef2f6;border:4px solid #fff}.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kv div{background:#f8fafc;padding:11px;border-radius:11px}.kv small{display:block;color:var(--mut);font-size:10px}.notice{background:#f8fafc;border:1px dashed #d7dce5;padding:13px;border-radius:12px;color:var(--mut);font-size:12px;line-height:1.7}.empty{text-align:center;color:var(--mut);padding:30px}.modal{position:fixed;inset:0;background:#08101dcc;display:grid;place-items:center;padding:18px;z-index:100}.modal-box{background:#fff;border-radius:20px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:22px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.close{border:0;background:#f1f3f7;border-radius:9px;padding:8px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.contract{background:#fff;padding:28px;line-height:1.7;color:#222}.contract h2,.contract h3{text-align:center}.contract-table{width:100%;border-collapse:collapse}.contract-table th,.contract-table td{border:1px solid #999;padding:7px;font-size:12px}.camera{width:100%;max-height:330px;background:#0b1220;border-radius:14px;object-fit:cover}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 15px;border-radius:11px;display:none;z-index:200}@media(max-width:950px){.grid{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.side{position:fixed;left:-270px;top:72px;width:250px;z-index:40;transition:.25s}.side.open{left:0}.hamb{display:block}.main{padding:20px}}@media(max-width:600px){.topbar{padding:0 13px}.main{padding:14px}.grid,.form-grid,.kv{grid-template-columns:1fr}.heading h1{font-size:24px}.card{padding:15px}.profile{grid-template-columns:1fr;text-align:center}.avatar{margin:auto}.login-card{padding:22px}.contract{padding:16px}.table{min-width:760px}}</style></head><body>
<section id="login" class="login"><div class="login-card"><div class="brand"><div class="mark">PS</div><div><b>Prakash Swami Constructions</b><small>SECURE PROJECT MANAGEMENT</small></div></div><h2 id="loginTitle">Admin Login</h2><div class="tabs"><button class="active" data-role="admin">Admin</button><button data-role="customer">Customer</button><button data-role="worker">Worker</button></div><div id="err" class="error hidden"></div><form id="loginForm"><div class="field"><label id="idLabel">Mobile Number</label><input id="loginId" required placeholder="9785438345"></div><div class="field" id="passWrap"><label>Password</label><input id="password" type="password"></div><button class="primary full" type="submit">Login</button></form><div class="hint" id="loginHint">Admin: phone + password. Customer: email + password. Worker: registered mobile + OTP.</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn blue" id="signupBtn" type="button">Customer Sign Up</button><button class="btn" id="forgotBtn" type="button">Forgot Password</button></div></div></section>
<section id="app" class="app hidden"><header class="topbar"><div class="top-left"><button class="hamb" id="hamb">☰</button><div><b id="roleTitle">Dashboard</b><div style="font-size:11px;color:#98a2b3">Prakash Swami Constructions</div></div></div><div class="actions"><button class="icon" id="bell">🔔<span class="badge hidden" id="badge">0</span></button><button class="lang" id="langBtn">EN</button></div></header><div class="layout"><aside class="side" id="side"></aside><main class="main"><div class="heading"><div><h1 id="pageTitle">Overview</h1><p id="pageSub">सुरक्षित project management</p></div><div id="topAction"></div></div><div id="page"></div></main></div></section><div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div><div id="toast" class="toast"></div>
<script>
const URL='https://aamstyeeewncmgqdxpoh.supabase.co',KEY='sb_publishable_fOzZvfiio6HSaEgplYUgOA_lWy1tbVe',db=supabase.createClient(URL,KEY);let role='admin',lang='hi',profile=null,active='overview',searchTerm='';
const T={hi:{admin:'Admin',customer:'Customer',worker:'Worker',overview:'Overview',profile:'Profile',enquiries:'Enquiry',customers:'Customers',projects:'Projects',workers:'Workers',payments:'Payments',attendance:'Attendance',updates:'Daily Updates',contracts:'Contracts',notifications:'Notifications',expenses:'Expenses',settings:'Payment Settings',logout:'Logout'},en:{admin:'Admin',customer:'Customer',worker:'Worker',overview:'Overview',profile:'Profile',enquiries:'Enquiry',customers:'Customers',projects:'Projects',workers:'Workers',payments:'Payments',attendance:'Attendance',updates:'Daily Updates',contracts:'Contracts',notifications:'Notifications',expenses:'Expenses',settings:'Payment Settings',logout:'Logout'}};const t=k=>T[lang][k]||k;const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=x=>'₹'+Number(x||0).toLocaleString('en-IN');function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}function err(x){let e=document.getElementById('err');e.textContent=x;e.classList.remove('hidden')}function page(x){document.getElementById('page').innerHTML=x}function openModal(x){document.getElementById('modalBox').innerHTML=x;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}window.closeModal=closeModal;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');role=b.dataset.role;document.getElementById('loginTitle').textContent=t(role)+' Login';document.getElementById('idLabel').textContent=role==='customer'?'Email':'Mobile Number';document.getElementById('loginId').placeholder=role==='customer'?'customer@email.com':'9785438345';document.getElementById('passWrap').style.display=role==='worker'?'none':'block';document.getElementById('password').required=role!=='worker';document.getElementById('signupBtn').style.display=role==='customer'?'inline-block':'none';document.getElementById('forgotBtn').style.display=role==='worker'?'none':'inline-block'});
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();document.getElementById('err').classList.add('hidden');let id=document.getElementById('loginId').value.trim(),pass=document.getElementById('password').value;if(role==='worker'){let r=await db.auth.signInWithOtp({phone:id});if(r.error)return err(r.error.message);return openModal(`<div class="modal-head"><h3>OTP Verification</h3><button class="close" onclick="closeModal()">✕</button></div><div class="field"><label>OTP</label><input id="otp" inputmode="numeric"></div><button class="primary full" onclick="verifyOtp('${esc(id)}')">Verify & Login</button>`)}let r=role==='customer'?await db.auth.signInWithPassword({email:id,password:pass}):await db.auth.signInWithPassword({phone:id,password:pass});if(r.error)return err(r.error.message);enter(r.data.user)};window.verifyOtp=async phone=>{let r=await db.auth.verifyOtp({phone,token:document.getElementById('otp').value.trim(),type:'sms'});if(r.error)return toast(r.error.message);closeModal();enter(r.data.user)};
async function enter(u){let r=await db.from('profiles').select('*').eq('id',u.id).maybeSingle();if(r.error)return err(r.error.message);if(!r.data)return openModal(`<div class="modal-head"><h3>${t(role)} Profile</h3></div><div class="notice">पहली login पर profile पूरी करें।</div><div class="form-grid"><div class="field"><label>Name</label><input id="pn"></div><div class="field"><label>Phone</label><input id="pp" value="${esc(u.phone||'')}"></div><div class="field"><label>Email</label><input id="pe" value="${esc(u.email||'')}"></div><div class="field"><label>Address</label><input id="pa"></div></div><button class="primary full" onclick="makeProfile('${u.id}')">Save Profile</button>`);profile=r.data;if(profile.role!==role){await db.auth.signOut();return err('Selected role गलत है.')}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');renderSide();await refreshNotifications();go('overview')}
window.makeProfile=async id=>{let r=await db.from('profiles').insert({id,role,name:document.getElementById('pn').value,phone:document.getElementById('pp').value,email:document.getElementById('pe').value,address:document.getElementById('pa').value});if(r.error)return toast(r.error.message);closeModal();enter({id})};
document.getElementById('signupBtn').onclick=()=>openModal(`<div class="modal-head"><h3>Customer Registration</h3><button class="close" onclick="closeModal()">✕</button></div><div class="form-grid"><div class="field"><label>Name</label><input id="sn"></div><div class="field"><label>Phone</label><input id="sp"></div><div class="field"><label>Email</label><input id="se"></div><div class="field"><label>Password</label><input id="sw" type="password"></div><div class="field"><label>Address</label><input id="sa"></div></div><button class="primary full" onclick="signup()">Create Account</button>`);window.signup=async()=>{let email=se.value.trim(),password=sw.value,r=await db.auth.signUp({email,password});if(r.error)return toast(r.error.message);if(r.data.user){let x=await db.from('profiles').insert({id:r.data.user.id,role:'customer',name:sn.value,phone:sp.value,email,address:sa.value});if(x.error)return toast(x.error.message)}closeModal();toast('Customer account created')};document.getElementById('forgotBtn').onclick=()=>openModal(`<div class="modal-head"><h3>Password Reset</h3><button class="close" onclick="closeModal()">✕</button></div><div class="field"><label>Email</label><input id="re"></div><button class="primary full" onclick="resetPass()">Send Reset Link</button>`);window.resetPass=async()=>{let r=await db.auth.resetPasswordForEmail(document.getElementById('re').value.trim(),{redirectTo:location.href});if(r.error)toast(r.error.message);else{closeModal();toast('Reset link sent')}};
document.getElementById('hamb').onclick=()=>document.getElementById('side').classList.toggle('open');document.getElementById('bell').onclick=async()=>{go('notifications');await db.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',profile.id).is('read_at',null);refreshNotifications()};document.getElementById('langBtn').onclick=()=>{lang=lang==='hi'?'en':'hi';document.getElementById('langBtn').textContent=lang==='hi'?'EN':'हिं';renderSide();go(active)};
function renderSide(){let a=role==='admin'?['overview','profile','enquiries','customers','projects','workers','payments','attendance','updates','contracts','expenses','settings','notifications']:role==='customer'?['overview','profile','enquiries','projects','payments','contracts','notifications']:['overview','profile','projects','attendance','payments','updates','notifications'];document.getElementById('side').innerHTML='<div class="side-title">PS CONSTRUCTIONS</div>'+a.map(x=>`<button data-page="${x}" class="${active===x?'active':''}">${t(x)}</button>`).join('')+'<button class="logout" id="logout">↪ '+t('logout')+'</button>';document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.getElementById('side').classList.remove('open');go(b.dataset.page)});document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.reload()};document.getElementById('roleTitle').textContent=t(role)}async function go(p){active=p;renderSide();document.getElementById('pageTitle').textContent=t(p);if(role==='admin')return admin(p);if(role==='customer')return customer(p);return worker(p)}
async function admin(p){if(p==='overview')return adminOverview();if(p==='profile')return profilePage();if(p==='enquiries')return enquiries();if(p==='customers'||p==='workers')return people(p==='workers'?'worker':'customer');if(p==='projects')return projects();if(p==='payments')return payments();if(p==='attendance')return attendance();if(p==='updates')return updates();if(p==='contracts')return contracts(true);if(p==='expenses')return expenses();if(p==='settings')return settings();if(p==='notifications')return notifications()}
async function adminOverview(){let [c,pr,w,e,pay,att]=await Promise.all([db.from('profiles').select('id',{count:'exact',head:true}).eq('role','customer'),db.from('projects').select('id',{count:'exact',head:true}),db.from('profiles').select('id',{count:'exact',head:true}).eq('role','worker'),db.from('enquiries').select('id',{count:'exact',head:true}).eq('status','pending'),db.from('payments').select('amount'),db.from('attendance').select('id',{count:'exact',head:true}).eq('status','pending')]);let total=(pay.data||[]).reduce((s,x)=>s+Number(x.amount||0),0);return page(`<div class="grid"><div class="stat">👥<small>Customers</small><strong>${c.count||0}</strong></div><div class="stat">🏗️<small>Projects</small><strong>${pr.count||0}</strong></div><div class="stat">👷<small>Workers</small><strong>${w.count||0}</strong></div><div class="stat">📝<small>Pending Enquiries</small><strong>${e.count||0}</strong></div></div><div class="grid" style="margin-top:15px"><div class="stat">💳<small>Total payment records</small><strong>${money(total)}</strong></div><div class="stat">🕘<small>Attendance approvals</small><strong>${att.count||0}</strong></div></div><div class="card"><div class="toolbar"><input class="search" id="gs" placeholder="Customer / Project / Worker / Payment search"><button class="btn dark" onclick="searchAll()">🔎 Search</button></div><div id="sr" class="footer-note">Modern global search</div></div>`)}
async function profilePage(){page(`<div class="card"><div class="profile"><img class="avatar" src="${esc(profile.image_url||'')}" onerror="this.src='https://ui-avatars.com/api/?name=PS&background=d7a43b&color=111827'"><div><h2>${esc(profile.name||role)}</h2><div class="kv"><div><small>Phone</small>${esc(profile.phone)}</div><div><small>Email</small>${esc(profile.email)}</div><div><small>Address</small>${esc(profile.address)}</div><div><small>Daily Wage</small>${money(profile.daily_wage)}</div></div><p><button class="btn edit" onclick="editProfile()">✏️ Edit</button> <button class="btn blue" onclick="changePass()">🔐 Change Password</button></p></div></div></div>`)}window.editProfile=()=>openModal(`<div class="modal-head"><h3>Edit Profile</h3><button class="close" onclick="closeModal()">✕</button></div><div class="form-grid"><div class="field"><label>Name</label><input id="en" value="${esc(profile.name)}"></div><div class="field"><label>Phone</label><input id="ep" value="${esc(profile.phone)}"></div><div class="field"><label>Email</label><input id="ee" value="${esc(profile.email)}"></div><div class="field"><label>Address</label><input id="ea" value="${esc(profile.address)}"></div></div><button class="primary full" onclick="saveProfile()">Save</button>`);window.saveProfile=async()=>{let r=await db.from('profiles').update({name:en.value,phone:ep.value,email:ee.value,address:ea.value}).eq('id',profile.id);if(r.error)toast(r.error.message);else{profile={...profile,name:en.value,phone:ep.value,email:ee.value,address:ea.value};closeModal();go('profile')}};window.changePass=()=>openModal(`<div class="modal-head"><h3>Change Password</h3><button class="close" onclick="closeModal()">✕</button></div><div class="field"><label>New Password</label><input id="np" type="password"></div><button class="primary full" onclick="savePass()">Update</button>`);window.savePass=async()=>{let r=await db.auth.updateUser({password:np.value});if(r.error)toast(r.error.message);else{closeModal();toast('Password updated')}};
async function enquiries(){let r=await db.from('enquiries').select('*,profiles:customer_id(name,phone)').order('created_at',{ascending:false});return page(`<div class="card"><div class="table-wrap"><table class="table"><tr><th>Customer</th><th>Phone</th><th>Budget</th><th>Address</th><th>Work / Note</th><th>Action</th></tr>${(r.data||[]).map(x=>`<tr><td>${esc(x.profiles?.name)}</td><td>${esc(x.profiles?.phone)}</td><td>${money(x.budget)}</td><td>${esc(x.address)}</td><td>${esc(x.work)}<br>${esc(x.notes)}</td><td>${x.status==='pending'?`<button class="btn ok" onclick="approveEnq('${x.id}')">Approve</button> <button class="btn danger" onclick="rejectEnq('${x.id}')">Cancel</button>`:`<span class="pill">${esc(x.status)}</span>`}</td></tr>`).join('')}</table></div></div>`)}window.approveEnq=async id=>{let q=await db.from('enquiries').select('*').eq('id',id).single();let p=await db.from('projects').insert({customer_id:q.data.customer_id,name:'Construction Project',address:q.data.address,status:'planning'}).select().single();if(p.error)return toast(p.error.message);let c=await db.from('contracts').insert({project_id:p.data.id,status:'amount_discussion',scope:q.data.work,additional_notes:q.data.notes}).select().single();if(c.error)return toast(c.error.message);await db.from('enquiries').update({status:'approved'}).eq('id',id);await notify(q.data.customer_id,'Enquiry Approved','आपकी enquiry approve हो गई है। Contract उपलब्ध है।');toast('Enquiry approved');go('enquiries')};window.rejectEnq=async id=>{let reason=prompt('Reject reason?');if(reason===null)return;await db.from('enquiries').update({status:'cancelled',notes:reason}).eq('id',id);go('enquiries')};

7</td><td>Final Inspection & Handover</td><td>5%</td></tr></table><h3>5. सामान्य शर्तें</h3><p>पानी और बिजली मालिक द्वारा उपलब्ध कराई जाएगी। Labour-rate agreement में cement, sand, aggregate, steel आदि समय पर उपलब्ध कराए जाएंगे। Site safety contractor की जिम्मेदारी होगी। कार्य पूरा होने के 6 माह तक plaster crack जैसी तकनीकी खराबी पर उचित सुधार किया जाएगा। Refund Policy और Additional Notes project record में लागू होंगे।</p><h3>6. डिजिटल स्वीकृति</h3><p>Customer approval: ${c.customer_approved_at?new Date(c.customer_approved_at).toLocaleString('en-IN'):'Pending'}<br>Admin approval: ${c.admin_approved_at?new Date(c.admin_approved_at).toLocaleString('en-IN'):'Pending'}<br>Locked: ${c.locked_at?new Date(c.locked_at).toLocaleString('en-IN'):'No'}</p></div>${c.status!=='locked'?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${role==='customer'?`<button class="btn ok" onclick="approveC('${id}','customer')">✅ Customer Approve</button>`:''}${role==='admin'?`<button class="btn ok" onclick="approveC('${id}','admin')">✅ Admin Approve</button>`:''}${role==='customer'||role==='admin'?`<button class="btn edit" onclick="amount('${id}')">₹ Propose Amount</button>`:''}</div>`:''}`)};window.printC=()=>{let w=open('','_blank');w.document.write('<html><body>'+cp.outerHTML+'</body></html>');w.document.close();w.print()};window.approveC=async(id,who)=>{let c=(await db.from('contracts').select('*').eq('id',id).single()).data;if(!c.final_amount)return toast('Final Amount पहले तय करें');let d=who==='customer'?{customer_approved_at:new Date().toISOString(),customer_approved_by:profile.id}:{admin_approved_at:new Date().toISOString(),admin_approved_by:profile.id};let r=await db.from('contracts').update(d).eq('id',id);if(r.error)return toast(r.error.message);let v=(await db.from('contracts').select('*').eq('id',id).single()).data;if(v.customer_approved_at&&v.admin_approved_at){await db.from('contracts').update({status:'locked',locked_at:new Date().toISOString()}).eq('id',id);await db.from('projects').update({status:'active'}).eq('id',v.project_id);toast('Contract locked • Project Active')}else toast('Approval saved');closeModal();go('contracts')};

async function settings(){let r=await db.from('business_settings').select('*').eq('id',true).single(),s=r.data||{};return page(`<div class="card"><h3>Customer Payment Details</h3><div class="form-grid"><div class="field"><label>UPI ID</label><input id="upi" value="${esc(s.upi_id)}"></div><div class="field"><label>Bank Name</label><input id="bn" value="${esc(s.bank_name)}"></div><div class="field"><label>Account Name</label><input id="bac" value="${esc(s.account_name)}"></div><div class="field"><label>Account Number</label><input id="ban" value="${esc(s.account_number)}"></div><div class="field"><label>IFSC</label><input id="ifsc" value="${esc(s.ifsc)}"></div></div><button class="primary" onclick="saveSettings()">Save Payment Details</button></div>`)}window.saveSettings=async()=>{let r=await db.from('business_settings').update({upi_id:upi.value,bank_name:bn.value,account_name:bac.value,account_number:ban.value,ifsc:ifsc.value}).eq('id',true);if(r.error)toast(r.error.message);else toast('Payment details saved')};
async function customer(p){if(p==='overview')return custOverview();if(p==='profile')return profilePage();if(p==='enquiries')return custEnquiry();if(p==='projects')return custProjects();if(p==='payments')return custPayments();if(p==='contracts')return contracts(false);if(p==='notifications')return notifications()};async function custOverview(){let [e,p,pay]=await Promise.all([db.from('enquiries').select('id',{count:'exact',head:true}).eq('customer_id',profile.id),db.from('projects').select('progress').eq('customer_id',profile.id),db.from('payments').select('amount').eq('customer_id',profile.id)]);let paid=(pay.data||[]).reduce((s,x)=>s+Number(x.amount||0),0);return page(`<div class="grid"><div class="stat">📝<small>Enquiries</small><strong>${e.count||0}</strong></div><div class="stat">🏠<small>Projects</small><strong>${(p.data||[]).length}</strong></div><div class="stat">💳<small>Paid</small><strong>${money(paid)}</strong></div><div class="stat">📈<small>Progress</small><strong>${Math.round((p.data||[]).reduce((s,x)=>s+x.progress,0)/Math.max(1,(p.data||[]).length))}%</strong></div></div><div class="card"><button class="btn dark" onclick="go('enquiries')">＋ New Enquiry</button> <button class="btn blue" onclick="go('projects')">Projects</button> <button class="btn edit" onclick="go('contracts')">Contracts</button></div>`)}async function custEnquiry(){let r=await db.from('enquiries').select('*').eq('customer_id',profile.id).order('created_at',{ascending:false});return page(`<div class="card"><h3>नई Enquiry</h3><div class="form-grid"><div class="field"><label>काम</label><input id="cw"></div><div class="field"><label>Budget</label><input id="cb" type="number"></div><div class="field"><label>Address</label><input id="ca"></div><div class="field"><label>Note</label><input id="cn"></div></div><button class="primary" onclick="sendE()">Send Enquiry</button></div><div class="card"><h3>History</h3><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Work</th><th>Budget</th><th>Status</th></tr>${(r.data||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleDateString('en-IN')}</td><td>${esc(x.work)}</td><td>${money(x.budget)}</td><td>${esc(x.status)}</td></tr>`).join('')}</table></div></div>`)}window.sendE=async()=>{let r=await db.from('enquiries').insert({customer_id:profile.id,work:cw.value,budget:Number(cb.value||0),address:ca.value,notes:cn.value});if(r.error)toast(r.error.message);else{toast('Enquiry sent');go('enquiries')}};async function custProjects(){let r=await db.from('projects').select('*').eq('customer_id',profile.id);return page(`<div class="grid">${(r.data||[]).map(x=>`<div class="card"><h3>${esc(x.name)}</h3><p>${esc(x.address)}</p><div class="progress"><i style="width:${x.progress}%"></i></div><b>${x.progress}%</b><p>${esc(x.status)}</p><button class="btn blue" onclick="openProject('${x.id}')">Open</button></div>`).join('')||'<div class="empty">No projects</div>'}</div>`)}async function custPayments(){let [s,r]=await Promise.all([db.from('business_settings').select('*').eq('id',true).single(),db.from('payments').select('*').eq('customer_id',profile.id).order('paid_at',{ascending:false})]);return page(`<div class="card"><h3>Admin UPI / Bank</h3><div class="kv"><div><small>UPI</small>${esc(s.data?.upi_id)}</div><div><small>Bank</small>${esc(s.data?.bank_name)}</div><div><small>Account</small>${esc(s.data?.account_number)}</div><div><small>IFSC</small>${esc(s.data?.ifsc)}</div></div><button class="btn dark" style="margin-top:12px" onclick="custPay()">＋ Submit Payment</button></div><div class="card"><h3>Payment History</h3><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Amount</th><th>Method</th><th>Reference</th></tr>${(r.data||[]).map(x=>`<tr><td>${new Date(x.paid_at).toLocaleString('en-IN')}</td><td>${money(x.amount)}</td><td>${esc(x.method)}</td><td>${esc(x.reference)}</td></tr>`).join('')}</table></div></div>`)}window.custPay=()=>openModal(`<div class="modal-head"><h3>Submit Payment</h3><button class="close" onclick="closeModal()">✕</button></div><div class="field"><label>Project ID</label><input id="cpid"></div><div class="field"><label>Amount</label><input id="camt" type="number"></div><div class="field"><label>UPI/Bank</label><input id="cm" value="UPI"></div><div class="field"><label>UTR / Reference</label><input id="cr"></div><button class="primary full" onclick="saveCP()">Submit</button>`);window.saveCP=async()=>{let r=await db.from('payments').insert({project_id:cpid.value||null,customer_id:profile.id,direction:'customer_to_business',amount:Number(camt.value),method:cm.value,reference:cr.value});if(r.error)toast(r.error.message);else{closeModal();toast('Payment history updated automatically');go('payments')}};
async function worker(p){if(p==='overview')return workOverview();if(p==='profile')return profilePage();if(p==='projects')return workProjects();if(p==='attendance')return workAttendance();if(p==='payments')return workPayments();if(p==='updates')return workUpdates();if(p==='notifications')return notifications()};async function workOverview(){let [a,p]=await Promise.all([db.from('attendance').select('id',{count:'exact',head:true}).eq('worker_id',profile.id).eq('status','approved'),db.from('payments').select('amount').eq('worker_id',profile.id).eq('direction','business_to_worker')]);let paid=(p.data||[]).reduce((s,x)=>s+Number(x.amount||0),0);return page(`<div class="grid"><div class="stat">👷<small>Present Days</small><strong>${a.count||0}</strong></div><div class="stat">💰<small>Paid</small><strong>${money(paid)}</strong></div><div class="stat">📱<small>Daily Wage</small><strong>${money(profile.daily_wage)}</strong></div></div>`)}async function workProjects(){let m=await db.from('project_workers').select('project_id').eq('worker_id',profile.id);let ids=(m.data||[]).map(x=>x.project_id);if(!ids.length)return page('<div class="empty">No assigned projects</div>');let r=await db.from('projects').select('*').in('id',ids);return page(`<div class="grid">${(r.data||[]).map(x=>`<div class="card"><h3>${esc(x.name)}</h3><p>${esc(x.address)}</p><div class="progress"><i style="width:${x.progress}%"></i></div>${x.progress}%</div>`).join('')}</div>`)}let stream=null;async function workAttendance(){let r=await db.from('attendance').select('*').eq('worker_id',profile.id).order('work_date',{ascending:false});page(`<div class="card"><h3>Face Scan Attendance</h3><video id="cam" class="camera" autoplay playsinline></video><canvas id="cv" class="hidden"></canvas><button class="primary full" onclick="scan()">📷 Face Scan & Submit</button><div class="footer-note">Camera scan admin approval के लिए जाएगा.</div></div><div class="card"><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Time</th><th>Status</th></tr>${(r.data||[]).map(x=>`<tr><td>${x.work_date}</td><td>${new Date(x.scanned_at).toLocaleTimeString('en-IN')}</td><td><span class="pill">${x.status}</span></td></tr>`).join('')}</table></div></div>`)}window.scan=async()=>{let v=cam;if(!stream){try{stream=await navigator.mediaDevices.getUserMedia({video:true});v.srcObject=stream;return toast('Camera started. फिर button दबाएं')}catch(e){return toast('Camera permission required')}}cv.width=v.videoWidth||640;cv.height=v.videoHeight||480;cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);let r=await db.from('attendance').insert({worker_id:profile.id,work_date:new Date().toISOString().slice(0,10),face_image_url:cv.toDataURL('image/jpeg',.4),status:'pending'});stream.getTracks().forEach(x=>x.stop());stream=null;if(r.error)toast(r.error.message);else{toast('Attendance sent for admin approval');go('attendance')}};async function workPayments(){let r=await db.from('payments').select('*').eq('worker_id',profile.id).eq('direction','business_to_worker').order('paid_at',{ascending:false});return page(`<div class="card"><h3>Payment History</h3><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Amount</th><th>Method</th><th>Reference</th></tr>${(r.data||[]).map(x=>`<tr><td>${new Date(x.paid_at).toLocaleString('en-IN')}</td><td>${money(x.amount)}</td><td>${esc(x.method)}</td><td>${esc(x.reference)}</td></tr>`).join('')}</table></div></div>`)}async function workUpdates(){return page(`<div class="card"><h3>Daily Update</h3><div class="form-grid"><div class="field"><label>Project ID</label><input id="dupid"></div><div class="field"><label>Progress %</label><input id="dupp" type="number"></div></div><div class="field"><label>आज कितना काम हुआ?</label><textarea id="duw"></textarea></div><button class="primary" onclick="saveDU()">Save Update</button></div>`)}window.saveDU=async()=>{let r=await db.from('daily_updates').insert({project_id:dupid.value,author_id:profile.id,work_done:duw.value,progress:Number(dupp.value||0)});if(r.error)toast(r.error.message);else toast('Daily update saved')};
async function notifications(){let r=await db.from('notifications').select('*').eq('user_id',profile.id).order('created_at',{ascending:false});return page(`<div class="card">${(r.data||[]).map(x=>`<div style="padding:14px 0;border-bottom:1px solid var(--line)"><b>${esc(x.title)}</b><p style="margin:4px 0;color:var(--mut)">${esc(x.body)}</p><small>${new Date(x.created_at).toLocaleString('en-IN')}</small></div>`).join('')||'<div class="empty">No notifications</div>'}</div>`)}async function refreshNotifications(){let r=await db.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',profile.id).is('read_at',null),b=document.getElementById('badge');if(r.count){b.textContent=r.count;b.classList.remove('hidden')}else b.classList.add('hidden')}async function notify(user,title,body){if(user)await db.from('notifications').insert({user_id:user,title,body})}async function searchAll(){let q=document.getElementById('gs').value.trim();let p=await db.from('profiles').select('name,phone,email,role').or(`name.ilike.%${q}%,phone.ilike.%${q}%,email.ilike.%${q}%`).limit(10);let x=await db.from('projects').select('name,address,progress').or(`name.ilike.%${q}%,address.ilike.%${q}%`).limit(10);document.getElementById('sr').innerHTML=[...(p.data||[]).map(a=>`<div class="card"><b>${esc(a.name)}</b> • ${esc(a.role)} • ${esc(a.phone)}</div>`),...(x.data||[]).map(a=>`<div class="card"><b>${esc(a.name)}</b> • ${esc(a.address)} • ${a.progress}%</div>`)].join('')||'No results'}
(async()=>{let s=await db.auth.getSession();if(s.data.session)enter(s.data.session.user)})();
</script></body></html>
