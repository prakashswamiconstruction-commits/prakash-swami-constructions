<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prakash Swami Constructions — Dashboard</title>
  <!-- Supabase JS Library with Fallback -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    if (typeof window !== 'undefined' && !window.supabase) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');
    }
  </script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0b1220;
      --accent: #e65100;
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    
    /* Login Page */
    .login-wrapper { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #0b1220 0%, #1e293b 100%); padding: 16px; }
    .login-card { width: min(450px, 100%); background: var(--card); border-radius: 20px; padding: 32px 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    .brand-header { text-align: center; margin-bottom: 20px; }
    .brand-header h2 { color: var(--primary); font-size: 22px; font-weight: 800; }
    .brand-header p { color: var(--muted); font-size: 13px; margin-top: 4px; }
    
    .role-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #e2e8f0; padding: 4px; border-radius: 12px; margin-bottom: 20px; }
    .role-tabs button { padding: 10px 4px; border: 0; background: transparent; font-weight: 700; font-size: 13px; border-radius: 8px; cursor: pointer; color: var(--muted); transition: 0.2s; }
    .role-tabs button.active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--primary); }
    
    .btn-primary { width: 100%; padding: 13px; background: var(--primary); color: #fff; border: 0; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    .btn-primary:hover { opacity: 0.95; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { padding: 8px 14px; background: var(--border); color: var(--text); border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
    
    /* Action Buttons */
    .btn-action-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 6px; border: 0; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
    .btn-success { background: #dcfce7; color: #15803d; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .btn-warning { background: #fef3c7; color: #b45309; }
    .btn-edit { background: #e0e7ff; color: #4338ca; }
    .btn-gold { background: #fef08a; color: #854d0e; font-weight: 700; border: 1px solid #fde047; }
    .btn-check { background: #0b1220; color: #fff; font-weight: 700; }
    
    .alert-box { padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; line-height: 1.5; }
    .alert-error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .alert-info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .hidden { display: none !important; }

    /* Dashboard Layout */
    .app-container { display: flex; flex-direction: column; min-height: 100vh; }
    .app-header { height: 64px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; z-index: 40; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-title { font-size: 16px; font-weight: 800; color: var(--primary); }
    .role-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .role-badge.admin { background: #fee2e2; color: var(--danger); }
    .role-badge.customer { background: #e0e7ff; color: #4338ca; }
    .role-badge.worker { background: #fef3c7; color: var(--warning); }
    
    .header-right { display: flex; align-items: center; gap: 12px; }
    .notif-btn { position: relative; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: #fff; display: grid; place-items: center; cursor: pointer; color: var(--text); }
    .notif-badge { position: absolute; top: -4px; right: -4px; background: var(--danger); color: #fff; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; }

    .app-body { display: grid; grid-template-columns: 240px 1fr; flex: 1; }
    .app-sidebar { background: var(--primary); color: #fff; padding: 16px 10px; display: flex; flex-direction: column; gap: 4px; min-height: calc(100vh - 64px); }
    .sidebar-btn { width: 100%; padding: 11px 14px; border: 0; background: transparent; color: #94a3b8; border-radius: 10px; text-align: left; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
    .sidebar-btn:hover, .sidebar-btn.active { background: rgba(255,255,255,0.1); color: #fff; }
    .sidebar-btn i { width: 18px; font-size: 15px; }

    .app-main { padding: 24px; max-width: 1300px; width: 100%; margin: 0 auto; }
    .page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .page-head h1 { font-size: 22px; font-weight: 800; color: var(--primary); }

    /* Universal Search Bar */
    .search-box { width: 100%; max-width: 400px; position: relative; }
    .search-box input { width: 100%; padding: 10px 14px 10px 36px; border: 1px solid var(--border); border-radius: 10px; background: #fff; font-size: 13px; outline: none; }
    .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card { background: #fff; padding: 18px; border-radius: 14px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .stat-card h4 { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .stat-card .val { font-size: 24px; font-weight: 800; color: var(--primary); margin-top: 4px; }
    .stat-card .icon-box { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; }

    /* Cards & Tables */
    .card { background: #fff; border-radius: 16px; border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; }
    .table-container { width: 100%; overflow-x: auto; background: #fff; border-radius: 14px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background: #f8fafc; padding: 12px 16px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--border); }
    td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    
    /* Progress Bar */
    .progress-bar-bg { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .progress-bar-fill { height: 100%; background: var(--success); border-radius: 4px; }

    /* Note display box */
    .note-box { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: #f8fafc; padding: 6px 10px; border-radius: 8px; border: 1px dashed #cbd5e1; max-width: 220px; font-size: 12px; line-height: 1.4; }
    .note-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Legal Contract Agreement Document Box (Matching PDF) */
    .contract-doc { background: #fff; border: 2px solid #334155; border-radius: 16px; padding: 28px; margin-top: 14px; position: relative; box-shadow: 0 6px 18px rgba(0,0,0,0.06); font-size: 13px; line-height: 1.6; color: #1e293b; }
    .contract-header { border-bottom: 2px double #0b1220; padding-bottom: 14px; margin-bottom: 16px; text-align: center; }
    .contract-header h2 { font-size: 20px; font-weight: 800; color: var(--primary); text-transform: uppercase; }
    .contract-header h3 { font-size: 15px; font-weight: 700; color: #b45309; margin-top: 4px; }
    .contract-header p { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .contract-section { margin-bottom: 18px; }
    .contract-section h4 { color: var(--primary); border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; margin-bottom: 8px; font-size: 14px; font-weight: 800; }
    .milestone-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    .milestone-table th { background: #f1f5f9; padding: 8px 10px; border: 1px solid #cbd5e1; }
    .milestone-table td { padding: 8px 10px; border: 1px solid #cbd5e1; }
    .amount-badge-box { background: #f0fdf4; border: 2px dashed var(--success); padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
    .sign-box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; border-top: 2px solid #cbd5e1; padding-top: 16px; }
    .sign-card { background: #f8fafc; padding: 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 12px; }

    /* Sub-Tabs */
    .sub-tabs { display: flex; gap: 8px; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .sub-tab-btn { padding: 8px 16px; border-radius: 8px; border: 0; background: #e2e8f0; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--muted); }
    .sub-tab-btn.active { background: var(--primary); color: #fff; }

    /* Thumbnails */
    .avatar-thumb { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #e2e8f0; cursor: pointer; transition: 0.2s; }
    .avatar-thumb:hover { transform: scale(1.1); border-color: var(--accent); }
    .face-compare-container { display: flex; align-items: center; gap: 12px; }
    .face-compare-box { text-align: center; font-size: 11px; color: var(--muted); }
    .face-compare-box img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; display: block; margin-bottom: 4px; border: 1px solid #ccc; cursor: pointer; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: grid; place-items: center; z-index: 100; padding: 16px; }
    .modal-card { width: min(750px, 100%); background: #fff; border-radius: 18px; padding: 24px; max-height: 90vh; overflow-y: auto; }

    @media(max-width: 840px) {
      .app-body { grid-template-columns: 1fr; }
      .app-sidebar { display: flex; flex-direction: row; overflow-x: auto; min-height: auto; padding: 10px; position: sticky; bottom: 0; z-index: 30; }
      .sidebar-btn { flex-direction: column; align-items: center; text-align: center; font-size: 11px; padding: 8px 12px; gap: 4px; }
      .sidebar-btn i { font-size: 16px; }
      .sign-box-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- 1. LOGIN SCREEN -->
<div id="loginSection" class="login-wrapper">
  <div class="login-card">
    <div class="brand-header">
      <i class="fa-solid fa-helmet-safety" style="font-size:32px; color:var(--accent); margin-bottom:8px;"></i>
      <h2>Prakash Swami Constructions</h2>
      <p>Construction Management Portal</p>
    </div>

    <div class="role-tabs">
      <button type="button" id="tabAdmin" class="active" onclick="selectRole('admin')"><i class="fa-solid fa-crown"></i> Admin</button>
      <button type="button" id="tabCustomer" onclick="selectRole('customer')"><i class="fa-solid fa-user"></i> Customer</button>
      <button type="button" id="tabWorker" onclick="selectRole('worker')"><i class="fa-solid fa-hammer"></i> Worker</button>
    </div>

    <div id="loginAlert" class="alert-box alert-error hidden"></div>

    <div id="authForm">
      <div class="form-group">
        <label id="inputLabel">Admin Email</label>
        <input id="loginId" type="text" value="satpalswami22742@gmail.com" placeholder="satpalswami22742@gmail.com" onkeydown="if(event.key==='Enter') handleLoginClick()">
      </div>

      <div class="form-group" id="pwGroup">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') handleLoginClick()">
      </div>

      <button id="loginSubmitBtn" type="button" class="btn-primary" onclick="handleLoginClick()">
        <i class="fa-solid fa-right-to-bracket"></i> Login
      </button>
    </div>

    <div id="signupGroup" class="hidden" style="margin-top: 14px; text-align: center;">
      <p style="font-size: 13px; color: var(--muted);">नया खाता बनाना चाहते हैं? 
        <a href="javascript:void(0)" onclick="openCustomerSignupModal()" style="color:var(--accent); font-weight:700; text-decoration:underline;">Customer Sign Up</a>
      </p>
    </div>

    <div style="margin-top: 20px; font-size: 12px; color: var(--muted); line-height: 1.6; border-top: 1px solid var(--border); padding-top: 14px;">
      <p><b>Worker Login:</b> सिर्फ अपना रजिस्टर्ड मोबाइल नंबर डालें (No Password/OTP)।</p>
    </div>
  </div>
</div>

<!-- 2. MAIN DASHBOARD APP -->
<div id="appSection" class="app-container hidden">
  <header class="app-header">
    <div class="header-left">
      <i class="fa-solid fa-building" style="color:var(--accent); font-size:20px;"></i>
      <span class="header-title">Prakash Swami Constructions</span>
      <span id="roleBadge" class="role-badge admin">Admin</span>
    </div>
    <div class="header-right">
      <!-- Notification Bell with Red Badge -->
      <button class="notif-btn" onclick="openNotificationsModal()" title="Notifications">
        <i class="fa-regular fa-bell"></i>
        <span id="notifBadge" class="notif-badge hidden">0</span>
      </button>
      <button class="btn-secondary" onclick="handleLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
    </div>
  </header>

  <div class="app-body">
    <aside class="app-sidebar" id="sidebarNav"></aside>
    <main class="app-main" id="mainContent"></main>
  </div>
</div>

<!-- Reusable Modal Container -->
<div id="modalContainer" class="modal-overlay hidden"></div>

<script>
// --- SUPABASE CONFIGURATION ---
const SUPABASE_URL = 'https://aamstyeeewncmgqdxpoh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fOzZvfiio6HSaEgplYUgOA_lWy1tbVe';
let db = (typeof window !== 'undefined' && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

function getDB() {
  if (!db && typeof window !== 'undefined' && window.supabase) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
  return db;
}

const ADMIN_EMAIL = 'satpalswami22742@gmail.com';
let currentRole = 'admin';
let currentUser = null;
let activeEnqTab = 'customer_enq';

const $ = id => document.getElementById(id);

// Safe String Utilities to Prevent Any Null / Undefined Crashes
function safeStr(val, fallback = '') {
  if (val === null || val === undefined) return fallback;
  return String(val);
}

function escapeAttr(val) {
  if (val === null || val === undefined) return '';
  return String(val)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;')
    .replace(/\n/g, ' ');
}

// --- INITIALIZATION ---
window.addEventListener('DOMContentLoaded', async () => {
  const hash = (window.location.hash || '').replace('#', '');
  if (['admin', 'customer', 'worker'].includes(hash)) {
    selectRole(hash);
  }

  const savedWorker = sessionStorage.getItem('ps_worker_session');
  if (savedWorker) {
    try {
      currentUser = JSON.parse(savedWorker);
      currentRole = 'worker';
      launchDashboard();
      return;
    } catch(e) { sessionStorage.removeItem('ps_worker_session'); }
  }

  const client = getDB();
  if (client) {
    try {
      const { data: { session } } = await client.auth.getSession();
      if (session && session.user) {
        await loadUserProfile(session.user);
      }
    } catch (e) {
      console.log('Session fetch error:', e);
    }
  }
});

function selectRole(role) {
  try {
    currentRole = role;
    const alertEl = $('loginAlert');
    if (alertEl) alertEl.classList.add('hidden');
    
    document.querySelectorAll('.role-tabs button').forEach(b => b.classList.remove('active'));
    const tabBtn = $('tab' + role.charAt(0).toUpperCase() + role.slice(1));
    if (tabBtn) tabBtn.classList.add('active');

    const isWorker = (role === 'worker');
    const isAdmin = (role === 'admin');

    const lbl = $('inputLabel');
    const lId = $('loginId');
    const pwG = $('pwGroup');
    const sG = $('signupGroup');

    if (lbl) lbl.textContent = isWorker ? 'Registered Mobile Number' : (isAdmin ? 'Admin Email' : 'Customer Email');
    if (lId) {
      lId.value = isAdmin ? ADMIN_EMAIL : '';
      lId.placeholder = isWorker ? '9876543210' : (isAdmin ? ADMIN_EMAIL : 'customer@example.com');
      lId.setAttribute('inputmode', isWorker ? 'tel' : 'email');
    }

    if (pwG) pwG.classList.toggle('hidden', isWorker);
    if (sG) sG.classList.toggle('hidden', role !== 'customer');
  } catch (err) {
    console.error('selectRole error:', err);
  }
}

async function handleLoginClick() {
  const alertEl = $('loginAlert');
  if (alertEl) alertEl.classList.add('hidden');

  const idVal = $('loginId') ? $('loginId').value.trim() : '';
  const passVal = $('loginPassword') ? $('loginPassword').value : '';

  const client = getDB();
  if (!client) {
    return showLoginError('Supabase Database से कनेक्शन नहीं बन सका। कृपया पेज रीफ़्रेश करें।');
  }
  if (!idVal) {
    return showLoginError('कृपया आवश्यक जानकारी दर्ज करें।');
  }

  const btn = $('loginSubmitBtn');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';
  }

  try {
    if (currentRole === 'worker') {
      const { data: worker, error } = await client.from('profiles')
        .select('*')
        .eq('phone', idVal)
        .eq('role', 'worker')
        .eq('is_active', true)
        .maybeSingle();

      if (error) throw error;
      if (!worker) {
        return showLoginError('यह मोबाइल नंबर किसी सक्रिय वर्कर के रूप में रजिस्टर्ड नहीं है।');
      }

      currentUser = worker;
      sessionStorage.setItem('ps_worker_session', JSON.stringify(worker));
      launchDashboard();
      return;
    }

    if (!passVal) {
      return showLoginError('कृपया पासवर्ड दर्ज करें।');
    }

    const { data, error } = await client.auth.signInWithPassword({
      email: idVal,
      password: passVal
    });

    if (error) {
      if (error.message && error.message.includes('Invalid login credentials')) {
        return showLoginError('गलत Email या Password दर्ज किया गया है।');
      }
      throw error;
    }

    if (data && data.user) {
      await loadUserProfile(data.user);
    } else {
      showLoginError('लॉगिन नहीं हो सका। कृपया पुनः प्रयास करें।');
    }
  } catch (err) {
    showLoginError(err.message || 'Login में समस्या हुई।');
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
    }
  }
}

const handleAuthSubmit = handleLoginClick;

function showLoginError(msg) {
  const el = $('loginAlert');
  if (el) {
    el.textContent = msg;
    el.classList.remove('hidden');
  }
}

async function loadUserProfile(authUser) {
  const client = getDB();
  let { data: profile } = await client.from('profiles').select('*').eq('id', authUser.id).maybeSingle();
  
  if (!profile) {
    const roleToSet = (authUser.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase() ? 'admin' : 'customer';
    const newProfile = {
      id: authUser.id,
      email: authUser.email || '',
      name: authUser.user_metadata?.name || (roleToSet === 'admin' ? 'Prakash Swami' : 'Customer'),
      role: roleToSet,
      phone: authUser.user_metadata?.phone || '',
      is_active: true
    };
    await client.from('profiles').insert(newProfile);
    profile = newProfile;
  }

  currentUser = profile;
  currentRole = profile.role;
  launchDashboard();
}

function launchDashboard() {
  const logSec = $('loginSection');
  const appSec = $('appSection');
  if (logSec) logSec.classList.add('hidden');
  if (appSec) appSec.classList.remove('hidden');
  
  const badge = $('roleBadge');
  if (badge) {
    badge.textContent = currentRole.toUpperCase();
    badge.className = `role-badge ${currentRole}`;
  }

  renderSidebar();
  loadNotificationsBadge();
}

function renderSidebar() {
  const nav = $('sidebarNav');
  if (!nav) return;
  let menus = [];

  if (currentRole === 'admin') {
    menus = [
      { id: 'overview', icon: 'fa-chart-pie', label: 'Overview' },
      { id: 'enquiries', icon: 'fa-inbox', label: 'Enquiries & Approvals' },
      { id: 'projects', icon: 'fa-trowel-bricks', label: 'Projects' },

    </button>
  `).join('');

  openView(menus[0].id);
}

// --- VIEW ROUTER ---
async function openView(viewId, btnElement) {
  if (btnElement) {
    document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');
  }

  const main = $('mainContent');
  if (!main) return;
  main.innerHTML = '<div style="text-align:center; padding:40px;"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></div>';

  try {
    if (currentRole === 'admin') {
      if (viewId === 'overview') await renderAdminOverview(main);
      else if (viewId === 'enquiries') await renderAdminEnquiriesAndAttendance(main);
      else if (viewId === 'contracts' || viewId === 'projects') await renderAdminProjects(main);
      else if (viewId === 'daily_updates') await renderAdminDailyUpdates(main);
      else if (viewId === 'customers') await renderAdminCustomers(main);
      else if (viewId === 'workers') await renderAdminWorkers(main);
      else if (viewId === 'payments') await renderAdminPayments(main);
      else if (viewId === 'expenses') await renderAdminExpenses(main);
      else if (viewId === 'settings') await renderAdminSettings(main);
    } else if (currentRole === 'customer') {
      if (viewId === 'my_projects' || viewId === 'my_contracts') await renderCustomerProjects(main);
      else if (viewId === 'my_enquiries') await renderCustomerEnquiryForm(main);
      else if (viewId === 'my_payments') await renderCustomerPayments(main);
      else if (viewId === 'my_profile') await renderCustomerProfile(main);
    } else {
      if (viewId === 'worker_attendance') await renderWorkerAttendance(main);
      else if (viewId === 'worker_earnings') await renderWorkerEarnings(main);
      else if (viewId === 'worker_updates') await renderWorkerUpdates(main);
    }
  } catch (err) {
    console.error('openView error:', err);
    main.innerHTML = `<div class="card alert-box alert-error">Error loading section: ${err.message || 'Unknown error'}</div>`;
  }
}

async function loadNotificationsBadge() {
  const client = getDB();
  if (!client || !currentUser) return;
  let count = 0;

  try {
    if (currentRole === 'admin') {
      const [enqRes, attRes] = await Promise.all([
        client.from('enquiries').select('id', { count: 'exact' }).eq('status', 'pending'),
        client.from('attendance').select('id', { count: 'exact' }).eq('status', 'pending')
      ]);
      count = (enqRes.count || 0) + (attRes.count || 0);
    } else if (currentRole === 'customer') {
      const { count: cCount } = await client.from('daily_updates').select('id', { count: 'exact' });
      count = cCount || 0;
    }
  } catch (e) { console.log('notif count error:', e); }

  const badge = $('notifBadge');
  if (badge) {
    if (count > 0) {
      badge.textContent = count;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }
}

async function handleUniversalSearch(query) {
  query = (query || '').trim().toLowerCase();
  const resCard = $('searchResultsCard');
  const resList = $('searchResultsList');
  if (!resCard || !resList) return;
  if (!query) { resCard.style.display = 'none'; return; }

  resCard.style.display = 'block';
  resList.innerHTML = 'Searching...';

  const client = getDB();
  const [cRes, pRes, wRes] = await Promise.all([
    client.from('profiles').select('id, name, phone, email, role').ilike('name', `%${query}%`),
    client.from('projects').select('id, name, address, status').ilike('name', `%${query}%`),
    client.from('profiles').select('id, name, phone').eq('role', 'worker').ilike('name', `%${query}%`)
  ]);

  let html = '<ul style="list-style:none;">';
  (cRes.data || []).forEach(c => html += `<li style="padding:8px 0; border-bottom:1px solid #eee;"><b>[User - ${c.role}]</b> ${safeStr(c.name)} (${safeStr(c.phone || c.email)})</li>`);
  (pRes.data || []).forEach(p => html += `<li style="padding:8px 0; border-bottom:1px solid #eee;"><b>[Project]</b> ${safeStr(p.name)} - ${safeStr(p.address)} (${safeStr(p.status)})</li>`);
  html += '</ul>';

  resList.innerHTML = html === '<ul style="list-style:none;"></ul>' ? 'No matching records found.' : html;
}

function switchEnquirySubTab(tab) {
  activeEnqTab = tab;
  document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));

    $('tabContentCustomerEnq').classList.remove('hidden');
    $('tabContentWorkerAtt').classList.add('hidden');
  } else {
    $('tabContentCustomerEnq').classList.add('hidden');

}

async function approveEnquiry(enqId, customerId, work, address, budget) {
  if (!confirm('इस इन्क्वायरी को अप्रूव करके नया प्रोजेक्ट और कॉन्ट्रैक्ट बनाएँ?')) return;
  const client = getDB();
  const { data: proj } = await client.from('projects').insert({
    customer_id: customerId,
    name: (work || 'Project').substring(0, 40),
    address: address || '',
    total_amount: budget || 0,
    status: 'planning',
    progress: 0
  }).select().single();

  await client.from('contracts').insert({
    project_id: proj.id,
    version: 1,
    status: 'amount_discussion',
    final_amount: budget || 0,
    scope: work || '',
    proposed_by: currentUser ? currentUser.id : null
  });

  await client.from('enquiries').update({ status: 'approved' }).eq('id', enqId);
  alert('इन्क्वायरी स्वीकृत! प्रोजेक्ट और कॉन्ट्रैक्ट तैयार हो गया है।');
  openView('projects');
}

async function deleteEnquiry(id) {
  if (!confirm('क्या आप इस इन्क्वायरी को हटाना चाहते हैं?')) return;
  await getDB().from('enquiries').delete().eq('id', id);
  openView('enquiries');

async function openFullAgreementModal(contractId) {
  const { data: c } = await getDB().from('contracts')
    .select('*, project:project_id(name, address, customer:customer_id(name, phone, address))')
    .eq('id', contractId)
    .single();

  if (!c) return;
  const isLocked = c.status === 'locked' || (c.admin_approved_at && c.customer_approved_at);

  const modal = $('modalContainer');
  modal.classList.remove('hidden');
  modal.innerHTML = `
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--border); padding-bottom:10px;">
        <h3>करारनामा / अनुबंध विवरण (Full Agreement Document v${c.version || 1})</h3>
        <button onclick="$('modalContainer').classList.add('hidden')" style="border:0; background:transparent; font-size:22px; cursor:pointer;">&times;</button>
      </div>

      <div style="margin-bottom:14px;">
        ${generateLegalAgreementHtml(c, isLocked)}
      </div>

      ${!isLocked ? `
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
          <button class="btn-secondary" onclick="proposeContractAmountPrompt('${c.id}', ${c.final_amount})"><i class="fa-solid fa-pen"></i> Edit Amount</button>
          ${!c.admin_approved_at && currentRole === 'admin' ? `<button class="btn-primary" style="width:auto; background:var(--success);" onclick="adminApproveContract('${c.id}')"><i class="fa-solid fa-check"></i> Approve Contract as Admin</button>` : ''}
          ${!c.customer_approved_at && currentRole === 'customer' ? `<button class="btn-primary" style="width:auto; background:var(--success);" onclick="approveCustomerContract('${c.id}')"><i class="fa-solid fa-file-signature"></i> Approve Contract Digitally</button>` : ''}
        </div>
      ` : ''}
    </div>
  `;
}

async function proposeContractAmountPrompt(contractId, currentAmount) {
  const newAmt = prompt('नया Contract Amount (₹) दर्ज करें:', currentAmount);
  if (newAmt === null) return;
  const num = Number(newAmt);
  if (isNaN(num) || num <= 0) return alert('कृपया सही अमाउंट दर्ज करें।');

  await getDB().from('contracts').update({
    final_amount: num,
    proposed_by: currentUser ? currentUser.id : null,
    admin_approved_at: null,
    customer_approved_at: null,
    status: 'amount_discussion'
  }).eq('id', contractId);

  alert(`नया अमाउंट ₹${num.toLocaleString('en-IN')} प्रपोज़ हो गया है। दोनों पक्षों को इसे री-अप्रूव करना होगा।`);
  $('modalContainer').classList.add('hidden');
  openView(currentRole === 'admin' ? 'projects' : 'my_projects');
}

async function adminApproveContract(contractId) {
  if (!confirm('क्या आप इस अनुबंध को अपनी स्वीकृति (Admin Approval) देना चाहते हैं?')) return;
  const now = new Date().toISOString();
  const { data: c } = await getDB().from('contracts').select('*, project:project_id(*)').eq('id', contractId).single();
  const isFullyApproved = Boolean(c.customer_approved_at);

  await getDB().from('contracts').update({
    admin_approved_at: now,
    admin_approved_by: currentUser ? currentUser.id : null,
    status: isFullyApproved ? 'locked' : 'amount_discussion',
    locked_at: isFullyApproved ? now : null
  }).eq('id', contractId);

  if (isFullyApproved && c.project_id) {
    await getDB().from('projects').update({ status: 'active', total_amount: c.final_amount }).eq('id', c.project_id);
    alert('अनुबंध पूरी तरह लॉक हो गया है और प्रोजेक्ट शुरू हो चुका है! 🔒');
  } else {
    alert('एडमिन स्वीकृति दर्ज हो गई!');
  }

  $('modalContainer').classList.add('hidden');
  openView('projects');
}

async function approveCustomerContract(contractId) {

  await getDB().from('contracts').update({

    status: isFullyApproved ? 'locked' : 'amount_discussion',

  }).eq('id', contractId);

  if (isFullyApproved && c.project_id) {

async function renderAdminCustomers(container) {
  const client = getDB();
  const [custRes, projRes, payRes] = await Promise.all([
    client.from('profiles').select('*').eq('role', 'customer').order('created_at', { ascending: false }),
    client.from('projects').select('customer_id, total_amount'),
    client.from('payments').select('customer_id, amount').eq('direction', 'customer_to_business')
  ]);

  const customers = custRes.data || [];

  container.innerHTML = `
    <div class="page-head">
      <h1>Customers Management</h1>
      <button class="btn-primary" style="width:auto;" onclick="openAddCustomerModal()"><i class="fa-solid fa-user-plus"></i> Add New Customer</button>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Photo</th>
            <th>Customer Name</th>
            <th>Mobile</th>
            <th>Email</th>
            <th>Address</th>
            <th>Payment</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${customers.length === 0 ? '<tr><td colspan="8" style="text-align:center; padding:20px;">कोई कस्टमर नहीं मिला।</td></tr>' : ''}
          ${customers.map(c => {
            const custDisplayName = safeStr(c.name, 'Customer');
            const custDisplayPhone = safeStr(c.phone, '');

            return `
              <tr>
                <td>
                  ${c.image_url ? `<img src="${c.image_url}" class="avatar-thumb" onclick="showFullImage('${c.image_url}', '${escapeAttr(custDisplayName)}')">` : '<i class="fa-solid fa-user-circle fa-2x" style="color:var(--muted);"></i>'}
                </td>
                <td><b>${custDisplayName}</b></td>
                <td>${custDisplayPhone || '-'}</td>
                <td>${safeStr(c.email, '-')}</td>
                <td>${safeStr(c.address, '-')}</td>
                <td>
                  <button class="btn-sm btn-check" onclick="openCustomerPaymentModal('${c.id}', '${escapeAttr(custDisplayName)}', '${escapeAttr(custDisplayPhone)}')">
                    <i class="fa-solid fa-receipt"></i> Check
                  </button>
                </td>
                <td><span class="btn-sm ${c.is_active ? 'btn-success' : 'btn-danger'}">${c.is_active ? 'Active' : 'Inactive'}</span></td>
                <td>
                  <div class="btn-action-group">
                    <button class="btn-sm btn-edit" onclick="openEditCustomerModal('${c.id}')"><i class="fa-solid fa-pen"></i> Edit</button>
                    <button class="btn-sm btn-danger" onclick="deleteCustomer('${c.id}')"><i class="fa-solid fa-trash"></i></button>
                  </div>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function openAddCustomerModal() {
  const modal = $('modalContainer');
  modal.classList.remove('hidden');
  modal.innerHTML = `
    <div class="modal-card">
      <h3>नया कस्टमर जोड़ें</h3>
      <form onsubmit="saveCustomerByAdmin(event)">
        <div class="form-group"><label>Customer Name</label><input id="acName" required placeholder="ग्राहक का नाम"></div>
        <div class="form-group"><label>Mobile Number</label><input id="acPhone" type="tel" required placeholder="9876543210"></div>
        <div class="form-group"><label>Email (Optional)</label><input id="acEmail" type="email" placeholder="customer@gmail.com"></div>
        <div class="form-group"><label>Address</label><input id="acAddress" placeholder="साइट का पता"></div>
        <button type="submit" class="btn-primary">Save Customer</button>
      </form>
    </div>
  `;
}

async function saveCustomerByAdmin(e) {
  e.preventDefault();
  await getDB().from('profiles').insert({
    name: $('acName').value.trim(),
    phone: $('acPhone').value.trim(),
    email: $('acEmail').value.trim() || `${$('acPhone').value.trim()}@customer.local`,
    address: $('acAddress').value.trim(),
    role: 'customer',
    is_active: true
  });

  $('modalContainer').classList.add('hidden');
  openView('customers');
}

async function openEditCustomerModal(id) {
  const { data: c } = await getDB().from('profiles').select('*').eq('id', id).single();
  if (!c) return;

  const modal = $('modalContainer');
  modal.classList.remove('hidden');
  modal.innerHTML = `
    <div class="modal-card">
      <h3>कस्टमर एडिट करें</h3>
      <form onsubmit="updateCustomerRecord(event, '${id}')">
        <div class="form-group"><label>Customer Name</label><input id="ecName" value="${escapeAttr(c.name)}" required></div>
        <div class="form-group"><label>Mobile</label><input id="ecPhone" value="${escapeAttr(c.phone)}" required></div>
        <div class="form-group"><label>Address</label><input id="ecAddress" value="${escapeAttr(c.address)}"></div>
        <button type="submit" class="btn-primary">Update Customer</button>
      </form>
    </div>
  `;
}

async function updateCustomerRecord(e, id) {
  e.preventDefault();
  await getDB().from('profiles').update({
    name: $('ecName').value,
    phone: $('ecPhone').value,
    address: $('ecAddress').value
  }).eq('id', id);

  $('modalContainer').classList.add('hidden');
  openView('customers');
}

async function deleteCustomer(id) {
  if (!confirm('क्या आप इस कस्टमर को हटाना चाहते हैं?')) return;
  await getDB().from('profiles').delete().eq('id', id);
  openView('customers');
}

async function openCustomerPaymentModal(customerId, customerName, customerPhone) {
  const client = getDB();
  const [projRes, payRes] = await Promise.all([
    client.from('projects').select('*').eq('customer_id', customerId),
    client.from('payments').select('*').eq('customer_id', customerId).eq('direction', 'customer_to_business').order('paid_at', { ascending: false })
  ]);

  const projects = projRes.data || [];
  const totalProjectValue = projects.reduce((sum, p) => sum + Number(p.total_amount || 0), 0);
  const payments = payRes.data || [];
  const totalPaid = payments.reduce((sum, p) => sum + Number(p.amount || 0), 0);
  const remainingDue = totalProjectValue - totalPaid;

  const modal = $('modalContainer');
  modal.classList.remove('hidden');
  modal.innerHTML = `
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--border); padding-bottom:10px;">
        <div>
          <h3>${safeStr(customerName)} — ग्राहक भुगतान खाता (Financial Ledger)</h3>
          <p style="color:var(--muted); font-size:13px;">Mobile: ${safeStr(customerPhone)}</p>
        </div>
        <button onclick="$('modalContainer').classList.add('hidden')" style="border:0; background:transparent; font-size:22px; cursor:pointer;">&times;</button>
      </div>

      <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom:16px;">
        <div class="stat-card" style="padding:14px;"><div><h4>कुल प्रोजेक्ट लागत</h4><div class="val" style="font-size:20px;">₹${totalProjectValue.toLocaleString('en-IN')}</div></div></div>
        <div class="stat-card" style="padding:14px;"><div><h4>प्राप्त राशि</h4><div class="val" style="font-size:20px; color:var(--success);">₹${totalPaid.toLocaleString('en-IN')}</div></div></div>
        <div class="stat-card" style="padding:14px; background:#fff1f2; border-color:#fecdd3;"><div><h4>बकाया राशि</h4><div class="val" style="font-size:20px; color:var(--danger);">₹${remainingDue.toLocaleString('en-IN')}</div></div></div>
      </div>

      <div class="card" style="padding:16px; margin-bottom:16px;">
        <h4 style="margin-bottom:10px;">नया पेमेंट दर्ज करें</h4>
        <form onsubmit="recordCustomerPaymentSubmit(event, '${customerId}', '${escapeAttr(customerName)}', '${escapeAttr(customerPhone)}')">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="form-group"><label>Amount ₹</label><input id="cpAmount" type="number" required placeholder="50000"></div>
            <div class="form-group"><label>Method</label><select id="cpMethod"><option value="UPI">UPI</option><option value="Bank">Bank Transfer</option><option value="Cash">Cash</option></select></div>
          </div>
          <div class="form-group"><label>UTR / Ref</label><input id="cpRef" placeholder="12 अंकों का UTR"></div>
          <button type="submit" class="btn-primary" style="background:var(--success);">Save Payment</button>
        </form>
      </div>

      <h4>भुगतान इतिहास</h4>
      <div class="table-container" style="max-height:200px; overflow-y:auto; margin-top:8px;">
        <table>
          <thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Reference</th><th>Action</th></tr></thead>
          <tbody>
            ${payments.length === 0 ? '<tr><td colspan="5" style="text-align:center; padding:10px;">कोई पेमेंट रिकॉर्ड नहीं है।</td></tr>' : ''}
            ${payments.map(p => `
              <tr>
                <td>${new Date(p.paid_at).toLocaleDateString()}</td>
                <td><b>₹${Number(p.amount || 0).toLocaleString('en-IN')}</b></td>
                <td>${safeStr(p.method)}</td>
                <td>${safeStr(p.reference || p.note, '-')}</td>
                <td><button class="btn-sm btn-danger" onclick="deleteCustomerPaymentRecord('${p.id}', '${customerId}', '${escapeAttr(customerName)}', '${escapeAttr(customerPhone)}')"><i class="fa-solid fa-trash"></i></button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

async function recordCustomerPaymentSubmit(e, customerId, customerName, customerPhone) {
  e.preventDefault();
  await getDB().from('payments').insert({
    customer_id: customerId,
    direction: 'customer_to_business',
    amount: Number($('cpAmount').value),
    method: $('cpMethod').value,
    reference: $('cpRef').value,
    created_by: currentUser ? currentUser.id : null
  });

  alert('पेमेंट रिकॉर्ड दर्ज हो गया!');
  openCustomerPaymentModal(customerId, customerName, customerPhone);
}

async function deleteCustomerPaymentRecord(payId, customerId, customerName, customerPhone) {
  if (!confirm('क्या आप इस पेमेंट रिकॉर्ड को हटाना चाहते हैं?')) return;
  await getDB().from('payments').delete().eq('id', payId);
  openCustomerPaymentModal(customerId, customerName, customerPhone);
}

async function renderAdminWorkers(container) {
  const currentMonthPrefix = new Date().toISOString().substring(0, 7);
  const client = getDB();

  const [workRes, attRes, payRes] = await Promise.all([
    client.from('profiles').select('*').eq('role', 'worker').order('created_at', { ascending: false }),
    client.from('attendance').select('worker_id, work_date, status').eq('status', 'approved').gte('work_date', `${currentMonthPrefix}-01`),
    client.from('payments').select('worker_id, amount').eq('direction', 'business_to_worker')
  ]);

  const workers = workRes.data || [];
  const attendances = attRes.data || [];

  container.innerHTML = `
    <div class="page-head">
      <h1>Workers Management</h1>
      <button class="btn-primary" style="width:auto;" onclick="openAddWorkerModal()"><i class="fa-solid fa-plus"></i> Add New Worker</button>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Registered Face</th>
            <th>Worker Name</th>
            <th>Mobile (Login ID)</th>
            <th>Address</th>
            <th>Daily Wage</th>
            <th>Attendance (इस माह)</th>
            <th>Payment</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${workers.length === 0 ? '<tr><td colspan="9" style="text-align:center; padding:20px;">कोई वर्कर नहीं मिला। नया वर्कर जोड़ें।</td></tr>' : ''}
          ${workers.map(w => {
            const monthlyPresentCount = attendances.filter(a => a.worker_id === w.id).length;
            const workerDisplayName = safeStr(w.name, 'Worker');
            const workerDisplayPhone = safeStr(w.phone, '');

            return `
              <tr>
                <td>
                  ${w.image_url ? `<img src="${w.image_url}" class="avatar-thumb" onclick="showFullImage('${w.image_url}', '${escapeAttr(workerDisplayName)}')">` : '<i class="fa-solid fa-user-circle fa-2x" style="color:var(--muted);"></i>'}
                </td>
                <td><b>${workerDisplayName}</b></td>
                <td>${workerDisplayPhone}</td>
                <td>${safeStr(w.address, '-')}</td>
                <td><b>₹${w.daily_wage || 0} / दिन</b></td>
                <td>
                  <button class="btn-sm btn-edit" onclick="openWorkerAttendanceModal('${w.id}', '${escapeAttr(workerDisplayName)}', ${w.daily_wage || 0})">
                    <i class="fa-solid fa-calendar-check"></i> Present: ${monthlyPresentCount} / 30
                  </button>
                </td>
                <td>
                  <button class="btn-sm btn-check" onclick="openWorkerPaymentModal('${w.id}', '${escapeAttr(workerDisplayName)}', '${escapeAttr(workerDisplayPhone)}', ${w.daily_wage || 0})">
                    <i class="fa-solid fa-wallet"></i> Check
                  </button>
                </td>
                <td><span class="btn-sm ${w.is_active ? 'btn-success' : 'btn-danger'}">${w.is_active ? 'Active' : 'Inactive'}</span></td>
                <td>
                  <div class="btn-action-group">
                    <button class="btn-sm btn-edit" onclick="openEditWorkerModal('${w.id}')"><i class="fa-solid fa-pen"></i> Edit</button>
                    <button class="btn-sm btn-danger" onclick="deleteWorker('${w.id}')"><i class="fa-solid fa-trash"></i></button>
                  </div>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

async function openWorkerAttendanceModal(workerId, workerName, dailyWage) {
  const { data: records } = await getDB().from('attendance')
    .select('*')
    .eq('worker_id', workerId)
    .order('scanned_at', { ascending: false });

  const totalPresent = (records || []).filter(r => r.status === 'approved').length;
  const modal = $('modalContainer');
  modal.classList.remove('hidden');

  modal.innerHTML = `
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--border); padding-bottom:10px;">
        <div>
          <h3>${safeStr(workerName)} — हाजिरी रिकॉर्ड (Attendance Log)</h3>
          <p style="color:var(--muted); font-size:13px; margin-top:2px;">कुल उपस्थिति: <b>${totalPresent} दिन</b> | दर: ₹${dailyWage}/दिन</p>
        </div>
        <button onclick="$('modalContainer').classList.add('hidden')" style="border:0; background:transparent; font-size:22px; cursor:pointer;">&times;</button>
      </div>

      <div class="table-container" style="max-height:60vh; overflow-y:auto;">
        <table>
          <thead><tr><th>Date</th><th>Scan Time</th><th>Photo</th><th>Status</th></tr></thead>
          <tbody>
            ${(records || []).length === 0 ? '<tr><td colspan="4" style="text-align:center; padding:20px;">कोई हाजिरी रिकॉर्ड नहीं मिला।</td></tr>' : ''}
            ${(records || []).map(r => `
              <tr>
                <td><b>${safeStr(r.work_date)}</b></td>
                <td>${new Date(r.scanned_at).toLocaleTimeString()}</td>
                <td>
                  ${r.face_image_url ? `<img src="${r.face_image_url}" class="avatar-thumb" onclick="showFullImage('${r.face_image_url}', 'Scanned Attendance')">` : '-'}
                </td>
                <td><span class="btn-sm ${r.status === 'approved' ? 'btn-success' : 'btn-warning'}">${r.status === 'approved' ? 'Present' : safeStr(r.status)}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

async function openWorkerPaymentModal(workerId, workerName, workerPhone, dailyWage) {
  const client = getDB();
  const [attRes, payRes] = await Promise.all([
    client.from('attendance').select('*').eq('worker_id', workerId).eq('status', 'approved'),
    client.from('payments').select('*').eq('worker_id', workerId).eq('direction', 'business_to_worker').order('paid_at', { ascending: false })
  ]);

  const daysWorked = (attRes.data || []).length;
  const totalEarned = daysWorked * dailyWage;
  const payments = payRes.data || [];
  const totalPaid = payments.reduce((sum, p) => sum + Number(p.amount || 0), 0);
  const remainingDue = totalEarned - totalPaid;
  const upiPayUrl = `upi://pay?pa=${workerPhone}@upi&pn=${encodeURIComponent(safeStr(workerName))}&am=${remainingDue > 0 ? remainingDue : 0}&cu=INR`;

  const modal = $('modalContainer');
  modal.classList.remove('hidden');

  modal.innerHTML = `
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--border); padding-bottom:10px;">
        <div>
          <h3>${safeStr(workerName)} — वेतन व भुगतान खाता</h3>
          <p style="color:var(--muted); font-size:13px;">Phone: ${safeStr(workerPhone)} | दर: ₹${dailyWage}/दिन</p>
        </div>
        <button onclick="$('modalContainer').classList.add('hidden')" style="border:0; background:transparent; font-size:22px; cursor:pointer;">&times;</button>
      </div>

      <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom:16px;">
        <div class="stat-card" style="padding:14px;"><div><h4>कुल कमाई</h4><div class="val" style="font-size:20px;">₹${totalEarned}</div><small>${daysWorked} दिन हाजिरी</small></div></div>
        <div class="stat-card" style="padding:14px;"><div><h4>दिया गया</h4><div class="val" style="font-size:20px; color:var(--success);">₹${totalPaid}</div></div></div>
        <div class="stat-card" style="padding:14px; background:#fff1f2; border-color:#fecdd3;"><div><h4>बकाया</h4><div class="val" style="font-size:20px; color:var(--danger);">₹${remainingDue}</div></div></div>
      </div>

      <div style="background:#f8fafc; border:1px solid var(--border); padding:16px; border-radius:12px; margin-bottom:18px; text-align:center;">
        <p style="font-size:13px; font-weight:700; margin-bottom:8px;">Direct UPI Payment (PhonePe / GPay / Paytm):</p>
        <a href="${upiPayUrl}" target="_blank" class="btn-primary" style="display:inline-flex; width:auto; padding:11px 24px; background:#4f46e5; text-decoration:none;">
          <i class="fa-solid fa-bolt"></i> Pay ₹${remainingDue > 0 ? remainingDue : 0} via UPI
        </a>
      </div>

      <div class="card" style="padding:16px; margin-bottom:16px;">
        <h4 style="margin-bottom:10px;">नया भुगतान दर्ज करें</h4>
        <form onsubmit="recordWorkerPaymentSubmit(event, '${workerId}', '${escapeAttr(workerName)}')">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="form-group"><label>राशि (Amount ₹)</label><input id="wpAmount" type="number" required value="${remainingDue > 0 ? remainingDue : ''}"></div>
            <div class="form-group"><label>Method</label><select id="wpMethod"><option value="UPI">UPI</option><option value="Cash">Cash</option><option value="Bank">Bank Transfer</option></select></div>
          </div>
          <div class="form-group"><label>Note / Ref</label><input id="wpNote"></div>
          <button type="submit" class="btn-primary" style="background:var(--success);"><i class="fa-solid fa-check"></i> Save Payment Record</button>
        </form>
      </div>

      <h4>भुगतान इतिहास</h4>
      <div class="table-container" style="max-height:200px; overflow-y:auto; margin-top:8px;">
        <table>
          <thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Note</th><th>Action</th></tr></thead>
          <tbody>
            ${payments.length === 0 ? '<tr><td colspan="5" style="text-align:center; padding:10px;">कोई भुगतान इतिहास नहीं है।</td></tr>' : ''}
            ${payments.map(p => `
              <tr>
                <td>${new Date(p.paid_at).toLocaleDateString()}</td>
                <td><b>₹${Number(p.amount || 0).toLocaleString('en-IN')}</b></td>
                <td>${safeStr(p.method)}</td>
                <td>${safeStr(p.note, '-')}</td>
                <td><button class="btn-sm btn-danger" onclick="deleteWorkerPayment('${p.id}', '${workerId}', '${escapeAttr(workerName)}', '${escapeAttr(workerPhone)}', ${dailyWage})"><i class="fa-solid fa-trash"></i></button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function closeWorkerModal() {
  if (workerCameraStream) workerCameraStream.getTracks().forEach(t => t.stop());
  $('modalContainer').classList.add('hidden');
}

async function startWorkerFaceCamera() {
  try {
    $('cameraPreviewBox').style.display = 'block';
    $('capturedFaceBox').style.display = 'none';
    workerCameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    $('wVideo').srcObject = workerCameraStream;
  } catch (err) {
    alert('कैमरा एक्सेस नहीं मिला: ' + err.message);
  }
}

function snapWorkerFace() {
  const vid = $('wVideo');
  const canvas = document.createElement('canvas');
  canvas.width = vid.videoWidth || 300;
  canvas.height = vid.videoHeight || 300;
  canvas.getContext('2d').drawImage(vid, 0, 0, canvas.width, canvas.height);
  capturedWorkerFaceData = canvas.toDataURL('image/jpeg', 0.6);

  if (workerCameraStream) workerCameraStream.getTracks().forEach(t => t.stop());
  $('cameraPreviewBox').style.display = 'none';
  $('capturedFaceBox').style.display = 'block';
  $('wFaceImg').src = capturedWorkerFaceData;
}

async function handleWorkerFaceFile(input) {
  if (input.files && input.files[0]) {
    capturedWorkerFaceData = await readFileAsBase64(input.files[0]);
    $('capturedFaceBox').style.display = 'block';
    $('wFaceImg').src = capturedWorkerFaceData;
  }
}

        <div class="form-group"><label>Phone</label><input id="mpPhone" value="${escapeAttr(currentUser?.phone)}" required></div>
        <div class="form-group"><label>Address</label><input id="mpAddress" value="${escapeAttr(currentUser?.address)}"></div>
        <button type="submit" class="btn-primary">Update Profile</button>
      </form>
    </div>
  `;
}

async function updateMyProfile(e) {
  e.preventDefault();
  const updated = {
    name: $('mpName').value,
    phone: $('mpPhone').value,
    address: $('mpAddress').value
  };

  if (currentUser) {
    await getDB().from('profiles').update(updated).eq('id', currentUser.id);
    currentUser = { ...currentUser, ...updated };
  }
  alert('प्रोफ़ाइल अपडेट हो गई!');
  openView('my_profile');
}

function openCustomerSignupModal() {
  const modal = $('modalContainer');
  modal.classList.remove('hidden');
  modal.innerHTML = `
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3>नया कस्टमर अकाउंट बनाएं (Sign Up)</h3>
        <button onclick="$('modalContainer').classList.add('hidden')" style="border:0; background:transparent; font-size:20px; cursor:pointer;">&times;</button>
      </div>
      <form onsubmit="handleCustomerSignup(event)">
        <div class="form-group"><label>पूरा नाम (Full Name)</label><input id="suName" required placeholder="जैसे: विकास शर्मा"></div>
        <div class="form-group"><label>Mobile Number</label><input id="suPhone" type="tel" required placeholder="9876543210"></div>
        <div class="form-group"><label>Email Address</label><input id="suEmail" type="email" required placeholder="name@example.com"></div>
        <div class="form-group"><label>Password (कम से कम 6 अक्षर)</label><input id="suPass" type="password" required placeholder="••••••••"></div>
        <div class="form-group"><label>पता (Site / Home Address)</label><input id="suAddress" placeholder="गाँव/शहर"></div>
        <button type="submit" id="suBtn" class="btn-primary" style="margin-top:10px;"><i class="fa-solid fa-user-plus"></i> Create Customer Account</button>
      </form>
    </div>
  `;
}

async function handleCustomerSignup(e) {
  e.preventDefault();
  const name = $('suName').value.trim();
  const phone = $('suPhone').value.trim();
  const email = $('suEmail').value.trim();
  const pass = $('suPass').value;
  const address = $('suAddress').value.trim();

  const btn = $('suBtn');
  btn.disabled = true;
  btn.textContent = 'Account बन रहा है...';

  try {
    const client = getDB();
    const { data, error } = await client.auth.signUp({
      email,
      password: pass,
      options: { data: { name, phone, address, role: 'customer' } }
    });

    if (error) throw error;

    const userId = data.user?.id || (await client.from('profiles').select('id').eq('email', email).maybeSingle())?.data?.id;
    if (userId) {
      await client.from('profiles').upsert({
        id: userId,
        email,
        name,
        phone,
        address,
        role: 'customer',
        is_active: true
      });
    }

    alert('अकाउंट सफलतापूर्वक बन गया! अब आप लॉगिन कर सकते हैं।');
    $('modalContainer').classList.add('hidden');
    selectRole('customer');
    $('loginId').value = email;
    $('loginPassword').value = pass;
  } catch (err) {
    alert('Sign Up Error: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create Customer Account';
  }
}

let videoStream = null;

async function renderWorkerAttendance(container) {
  const today = new Date().toISOString().split('T')[0];
  const client = getDB();
  const workerId = currentUser ? currentUser.id : '';

  const [todayAttRes, allAttRes] = await Promise.all([
    client.from('attendance').select('*').eq('worker_id', workerId).eq('work_date', today).maybeSingle(),
    client.from('attendance').select('*').eq('worker_id', workerId).order('scanned_at', { ascending: false })
  ]);

  const todayAtt = todayAttRes.data;
  const allAtt = allAttRes.data || [];
  const presentCount = allAtt.filter(a => a.status === 'approved').length;

  container.innerHTML = `
    <div class="page-head"><h1>Worker Face Scan Attendance</h1></div>
    
    <div class="card" style="max-width:440px; margin:0 auto 24px; text-align:center;">
      ${todayAtt ? `
        <div class="alert-box ${todayAtt.status === 'approved' ? 'alert-info' : 'alert-error'}">
          <i class="fa-solid fa-circle-check"></i>
          आज की हाजिरी दर्ज है — <b>स्थिति: ${safeStr(todayAtt.status).toUpperCase()}</b>
        </div>
      ` : `
        <div id="attStatusMsg" class="hidden"></div>
        <p style="color:var(--muted); font-size:13px; margin-bottom:12px;">कैमरे के सामने सीधा चेहरा रखें और हाजिरी लगाएं:</p>
        <div style="position:relative; width:100%; height:250px; background:#000; border-radius:14px; overflow:hidden; margin-bottom:14px;">
          <video id="webcam" style="width:100%; height:100%; object-fit:cover;" autoplay playsinline></video>
          <div style="position:absolute; inset:25px 40px; border:2px dashed rgba(255,255,255,0.7); border-radius:50%; pointer-events:none;"></div>
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
        <button id="snapBtn" class="btn-primary" onclick="captureAndVerifyFaceAttendance()"><i class="fa-solid fa-camera"></i> Face Scan & Submit</button>
      `}
    </div>

    <!-- Date-Wise Attendance Log Table -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3>हाजिरी इतिहास (Attendance Record)</h3>
        <span class="btn-sm btn-edit"><i class="fa-solid fa-check"></i> कुल उपस्थिति: ${presentCount} दिन</span>
      </div>
      <div class="table-container">
        <table>
          <thead><tr><th>Date</th><th>Scan Time</th><th>Photo</th><th>Status</th></tr></thead>
          <tbody>
            ${allAtt.length === 0 ? '<tr><td colspan="4" style="text-align:center; padding:14px;">कोई हाजिरी रिकॉर्ड नहीं मिला।</td></tr>' : ''}
            ${allAtt.map(r => `
              <tr>
                <td><b>${safeStr(r.work_date)}</b></td>
                <td>${new Date(r.scanned_at).toLocaleTimeString()}</td>
                <td>${r.face_image_url ? `<img src="${r.face_image_url}" class="avatar-thumb" onclick="showFullImage('${r.face_image_url}', 'Attendance Photo')">` : '-'}</td>
                <td><span class="btn-sm ${r.status === 'approved' ? 'btn-success' : 'btn-warning'}">${r.status === 'approved' ? 'Present ✅' : safeStr(r.status)}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  if (!todayAtt) startAttendanceCamera();
}

async function startAttendanceCamera() {
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 480, height: 480 } });
    const vid = $('webcam');
    if (vid) vid.srcObject = videoStream;
  } catch (err) {
    alert('कैमरा शुरू करने में समस्या: ' + err.message);
  }
}

async function captureAndVerifyFaceAttendance() {
  const vid = $('webcam');
  const canvas = $('canvas');
  const btn = $('snapBtn');
  const statusMsg = $('attStatusMsg');

  if (!vid) return;
  if (!currentUser || !currentUser.image_url) return alert('आपका फ़ेस अभी रजिस्टर नहीं है। एडमिन से फ़ोटो रजिस्टर करवाएं।');

  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Analyzing Face...';

  canvas.width = vid.videoWidth || 320;
  canvas.height = vid.videoHeight || 240;
  canvas.getContext('2d').drawImage(vid, 0, 0, canvas.width, canvas.height);
  const scannedFaceData = canvas.toDataURL('image/jpeg', 0.6);

  const matchScore = await compareFaceFeatures(currentUser.image_url, scannedFaceData);

  if (matchScore < 55) {
    statusMsg.className = 'alert-box alert-error';
    statusMsg.innerHTML = '<b>❌ Face Match Failed!</b> चेहरा रजिस्टर्ड फ़ोटो से मैच नहीं हुआ। कृपया सही रोशनी में सीधा चेहरा रखकर दोबारा स्कैन करें।';
    statusMsg.classList.remove('hidden');

    btn.disabled = false;
    btn.className = 'btn-primary btn-warning';
    btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Retry Face Scan (दोबारा प्रयास करें)';
    btn.onclick = () => {
      statusMsg.classList.add('hidden');
      btn.className = 'btn-primary';
      btn.innerHTML = '<i class="fa-solid fa-camera"></i> Face Scan & Submit';
      btn.onclick = captureAndVerifyFaceAttendance;
    };
    return;
  }

  if (videoStream) videoStream.getTracks().forEach(t => t.stop());

  await getDB().from('attendance').insert({
    worker_id: currentUser ? currentUser.id : null,
    face_image_url: scannedFaceData,
    status: 'pending',
    work_date: new Date().toISOString().split('T')[0]
  });

  alert('Face Matched ✅ हाजिरी सबमिट हो गई!');
  openView('worker_attendance');
}

async function compareFaceFeatures(img1Url, img2Url) {
  return new Promise(async (resolve) => {
    try {
      const [img1, img2] = await Promise.all([loadImageElement(img1Url), loadImageElement(img2Url)]);
      const size = 64;
      const data1 = extractGrayscalePixels(img1, size, size);
      const data2 = extractGrayscalePixels(img2, size, size);

      let mean1 = 0, mean2 = 0;
      const len = data1.length;
      for (let i = 0; i < len; i++) { mean1 += data1[i]; mean2 += data2[i]; }
      mean1 /= len; mean2 /= len;

      let num = 0, den1 = 0, den2 = 0;
      for (let i = 0; i < len; i++) {
        const d1 = data1[i] - mean1, d2 = data2[i] - mean2;
        num += d1 * d2;
        den1 += d1 * d1;
        den2 += d2 * d2;
      }

      const correlation = (den1 > 0 && den2 > 0) ? (num / Math.sqrt(den1 * den2)) : 0;
      resolve(Math.max(0, Math.min(100, Math.round(((correlation + 1) / 2) * 100))));
    } catch (e) { resolve(75); }
  });
}

function loadImageElement(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}

function extractGrayscalePixels(img, w, h) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  const imgData = ctx.getImageData(0, 0, w, h).data;
  const gray = new Float32Array(w * h);
  for (let i = 0, j = 0; i < imgData.length; i += 4, j++) {
    gray[j] = 0.299 * imgData[i] + 0.587 * imgData[i + 1] + 0.114 * imgData[i + 2];
  }
  return gray;
}

async function renderWorkerEarnings(container) {
  const client = getDB();
  const workerId = currentUser ? currentUser.id : '';

  const [attRes, payRes] = await Promise.all([
    client.from('attendance').select('*').eq('worker_id', workerId).eq('status', 'approved'),
    client.from('payments').select('*').eq('worker_id', workerId).eq('direction', 'business_to_worker').order('paid_at', { ascending: false })
  ]);

  const daysWorked = (attRes.data || []).length;
  const wage = currentUser?.daily_wage || 0;
  const totalEarned = daysWorked * wage;
  const payments = payRes.data || [];
  const totalReceived = payments.reduce((sum, p) => sum + Number(p.amount || 0), 0);
  const remaining = totalEarned - totalReceived;

  container.innerHTML = `
    <div class="page-head"><h1>मेरी कमाई (My Earnings)</h1></div>
    <div class="stats-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom:24px;">
      <div class="stat-card"><div><h4>कुल हाजिरी</h4><div class="val">${daysWorked} दिन</div></div></div>
      <div class="stat-card"><div><h4>कुल कमाई</h4><div class="val">₹${totalEarned}</div></div></div>
      <div class="stat-card"><div><h4>प्राप्त राशि</h4><div class="val" style="color:var(--success);">₹${totalReceived}</div></div></div>
      <div class="stat-card" style="background:#fff1f2; border-color:#fecdd3;"><div><h4>बकाया राशि</h4><div class="val" style="color:var(--danger);">₹${remaining}</div></div></div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:12px;">वेतन भुगतान इतिहास (Payout History)</h3>
      <div class="table-container">
        <table>
          <thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Note</th></tr></thead>
          <tbody>
            ${payments.length === 0 ? '<tr><td colspan="4" style="text-align:center; padding:14px;">कोई भुगतान इतिहास नहीं है।</td></tr>' : ''}
            ${payments.map(p => `
              <tr>
                <td>${new Date(p.paid_at).toLocaleDateString()}</td>
                <td><b>₹${Number(p.amount || 0).toLocaleString('en-IN')}</b></td>
                <td>${safeStr(p.method)}</td>
                <td>${safeStr(p.note, '-')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

async function renderWorkerUpdates(container) {
  const { data: projects } = await getDB().from('projects').select('id, name');

  container.innerHTML = `
    <div class="page-head"><h1>दैनिक कार्य रिपोर्ट (Daily Work Update)</h1></div>
    <div class="card" style="max-width:600px;">
      <form onsubmit="submitWorkerDailyUpdate(event)">
        <div class="form-group"><label>प्रोजेक्ट</label><select id="wuProj">${(projects || []).map(p => `<option value="${p.id}">${safeStr(p.name)}</option>`).join('')}</select></div>
        <div class="form-group"><label>आज क्या काम किया</label><textarea id="wuWork" rows="3" required placeholder="कार्य का विवरण"></textarea></div>
        <div class="form-group"><label>साइट फ़ोटो</label><input type="file" id="wuPhoto" accept="image/*"></div>
        <button type="submit" class="btn-primary">Post Update</button>
      </form>
    </div>
  `;
}

async function submitWorkerDailyUpdate(e) {
  e.preventDefault();
  const fileInput = $('wuPhoto');
  let imgUrl = '';
  if (fileInput.files && fileInput.files[0]) {
    imgUrl = await readFileAsBase64(fileInput.files[0]);
  }

  await getDB().from('daily_updates').insert({
    project_id: $('wuProj').value,
    author_id: currentUser ? currentUser.id : null,
    work_done: $('wuWork').value,
    image_url: imgUrl
  });

  alert('कार्य रिपोर्ट सबमिट हो गई है!');
  openView('worker_attendance');
}

// Helpers
function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleLogout() {
  const client = getDB();
  if (client) await client.auth.signOut();
  sessionStorage.clear();
  location.reload();
}
