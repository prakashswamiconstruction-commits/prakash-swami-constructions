<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Dashboard | Prakash Swami Constructions</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#667085;--line:#e7eaf0;--dark:#101827;--gold:#d7a43b;--green:#16a34a;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,"Noto Sans Devanagari",sans-serif;color:var(--ink)}button,input,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#101827,#24344d)}.login-card{width:min(440px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 30px 80px #0004}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brandmark{width:46px;height:46px;display:grid;place-items:center;background:var(--gold);border-radius:12px;font-weight:900}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.5px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#f1f3f7;padding:5px;border-radius:12px;margin:18px 0}.tabs button{border:0;background:transparent;padding:10px;border-radius:9px;cursor:pointer;font-weight:800}.tabs button.active{background:#fff;box-shadow:0 3px 12px #00000010}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;outline:0}.field input:focus,.field textarea:focus{border-color:var(--gold)}.primary{width:100%;border:0;border-radius:11px;background:var(--dark);color:#fff;padding:13px;font-weight:900;cursor:pointer}.hint{font-size:12px;color:var(--muted);margin-top:12px}.error{background:#fff0f0;color:#b42318;border:1px solid #ffd1d1;padding:10px;border-radius:10px;font-size:12px;margin:10px 0}.app{min-height:100vh}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.topbar-left{display:flex;align-items:center;gap:12px}.hamb{display:none;border:0;background:#f1f3f7;border-radius:9px;padding:9px;cursor:pointer}.bell{position:relative;border:0;background:#f1f3f7;width:42px;height:42px;border-radius:12px;cursor:pointer}.badge{position:absolute;right:-3px;top:-4px;background:#ef4444;color:#fff;border-radius:99px;min-width:18px;height:18px;font-size:10px;display:grid;place-items:center}.layout{display:grid;grid-template-columns:245px 1fr}.side{min-height:calc(100vh - 70px);background:var(--dark);color:#cbd5e1;padding:18px;position:sticky;top:70px;height:calc(100vh - 70px)}.side button{width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:12px;border-radius:10px;margin:3px 0;cursor:pointer;font-weight:700}.side button.active,.side button:hover{background:#ffffff12;color:#fff}.main{padding:28px;max-width:1450px;width:100%}.hero-title{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.hero-title h1{margin:0;font-size:30px}.hero-title p{margin:5px 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 8px 25px #00000006}.stat small{color:var(--muted);font-weight:700}.stat strong{font-size:28px;display:block;margin-top:7px}.content-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;margin-top:18px;box-shadow:0 8px 25px #00000006}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;background:#eef2ff;font-size:11px;font-weight:800}.btn{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}.btn.edit{background:#fff7df;color:#8a6100}.btn.danger{background:#fff0f0;color:#b42318}.btn.ok{background:#ecfdf3;color:#087443}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.profile{display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:center}.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#eef2f6}.notice{padding:14px;border-radius:12px;background:#f8fafc;color:var(--muted);font-size:13px}.logout{color:#fca5a5!important}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:13px 16px;border-radius:11px;display:none;z-index:99}@media(max-width:950px){.grid{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.side{position:fixed;left:-270px;top:70px;width:245px;z-index:30;transition:.25s}.side.open{left:0}.hamb{display:block}.main{padding:20px}}@media(max-width:600px){.topbar{padding:0 14px}.grid,.form-grid{grid-template-columns:1fr}.main{padding:14px}.hero-title h1{font-size:24px}.content-card{padding:15px}.profile{grid-template-columns:1fr;text-align:center}.avatar{margin:auto}}
</style></head><body><section id="login" class="login"><div class="login-card"><div class="brand"><div class="brandmark">PS</div><div><b>Prakash Swami Constructions</b><small>SECURE DASHBOARD</small></div></div><h2 id="loginTitle">Admin Login</h2><div class="tabs"><button class="active" data-role="admin">Admin</button><button data-role="customer">Customer</button><button data-role="worker">Worker</button></div><div id="err" class="error hidden"></div><form id="loginForm"><div class="field"><label id="idLabel">मोबाइल नंबर</label><input id="loginId" required placeholder="97854 38345"></div><div class="field" id="passwordField"><label>Password</label><input id="password" type="password" required placeholder="••••••••"></div><button class="primary" type="submit">Login</button></form><div class="hint" id="loginHint">Admin: registered phone + password. Customer: email + password. Worker: registered phone + OTP verification.</div></div></section><section id="app" class="app hidden"><header class="topbar"><div class="topbar-left"><button class="hamb" id="hamb">☰</button><div><b id="roleName">Dashboard</b><div style="font-size:11px;color:#98a2b3">Prakash Swami Constructions</div></div></div><div style="display:flex;gap:10px;align-items:center"><button class="bell" id="bell">🔔<span class="badge hidden" id="badge">0</span></button><button class="btn" id="langBtn">EN</button></div></header><div class="layout"><aside class="side" id="side"></aside><main class="main"><div class="hero-title"><div><h1 id="pageTitle">Overview</h1><p id="pageSub">आपके dashboard की जानकारी</p></div></div><div id="page"></div></main></div></section><div id="toast" class="toast"></div><script>
const SUPABASE_URL='https://aamstyeeewncmgqdxpoh.supabase.co';const SUPABASE_KEY='sb_publishable_fOzZvfiio6HSaEgplYUgOA_lWy1tbVe';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let role='admin',lang='hi',profile=null,active='overview';
const labels={hi:{admin:'Admin',customer:'Customer',worker:'Worker',overview:'Overview',profile:'Profile',enquiries:'Enquiries',customers:'Customers',projects:'Projects',workers:'Workers',payments:'Payments',attendance:'Attendance',updates:'Daily Updates',contract:'Contracts',notifications:'Notifications',logout:'Logout'},en:{admin:'Admin',customer:'Customer',worker:'Worker',overview:'Overview',profile:'Profile',enquiries:'Enquiries',customers:'Customers',projects:'Projects',workers:'Workers',payments:'Payments',attendance:'Attendance',updates:'Daily Updates',contract:'Contracts',notifications:'Notifications',logout:'Logout'}};
function t(k){return labels[lang][k]||k}function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');role=b.dataset.role;document.getElementById('loginTitle').textContent=t(role)+' Login';document.getElementById('idLabel').textContent=role==='customer'?'Email': 'मोबाइल नंबर';document.getElementById('loginId').placeholder=role==='customer'?'customer@email.com':'9785438345';document.getElementById('passwordField').style.display=role==='worker'?'none':'block';document.getElementById('password').required=role!=='worker';document.getElementById('loginHint').textContent=role==='worker'?'Worker login में registered mobile number से OTP verification होगा.':'Admin: phone + password. Customer: email + password.'});
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();let id=document.getElementById('loginId').value.trim(),pass=document.getElementById('password').value;let r;if(role==='worker'){r=await sb.auth.signInWithOtp({phone:id});if(!r.error)toast('OTP भेजा गया है');else showErr(r.error.message);return}r=role==='customer'?await sb.auth.signInWithPassword({email:id,password:pass}):await sb.auth.signInWithPassword({phone:id,password:pass});if(r.error){showErr(r.error.message);return}await enter(r.data.user)};
function showErr(x){let e=document.getElementById('err');e.textContent=x;e.classList.remove('hidden')}
async function enter(user){let r=await sb.from('profiles').select('*').eq('id',user.id).single();if(r.error){showErr('Profile record नहीं मिला. पहले Supabase में user profile बनाएं.');return}profile=r.data;if(profile.role!==role){await sb.auth.signOut();showErr('इस login के लिए सही role चुनें.');return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');renderSide();go('overview');await notifications()}
function renderSide(){let items=role==='admin'?['overview','profile','enquiries','customers','projects','workers','payments','attendance','updates','contract','notifications']:role==='customer'?['overview','profile','enquiries','projects','payments','contract','notifications']:['overview','profile','projects','attendance','payments','updates','notifications'];document.getElementById('side').innerHTML=items.map(x=>`<button data-page="${x}">${t(x)}</button>`).join('')+`<button class="logout" id="logout">↪ ${t('logout')}</button>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()}}
async function go(p){active=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('pageTitle').textContent=t(p);document.getElementById('pageSub').textContent=lang==='hi'?'Prakash Swami Constructions':'Prakash Swami Constructions';if(role==='admin')return adminPage(p);if(role==='customer')return customerPage(p);return workerPage(p)}
async function adminPage(p){if(p==='overview')return page(`<div class="grid"><div class="stat"><small>Customers</small><strong id="c1">—</strong></div><div class="stat"><small>Projects</small><strong id="c2">—</strong></div><div class="stat"><small>Workers</small><strong id="c3">—</strong></div><div class="stat"><small>Pending Enquiries</small><strong id="c4">—</strong></div></div><div class="content-card"><h3>Modern Search</h3><input id="search" placeholder="Customer / Project / Worker / Payment search..."><div class="notice">Dashboard foundation तैयार है। Enquiry, Customer, Project, Worker, Payment, Attendance, Daily Update और Contract modules इसी secure Supabase backend से जुड़ेंगे.</div></div>`);if(p==='profile')return profilePage();if(['customers','workers','projects','enquiries','payments','attendance','updates','contract','notifications'].includes(p))return tablePage(p)}
async function tablePage(p){let map={customers:['profiles','role'],workers:['profiles','role'],projects:['projects',null],enquiries:['enquiries',null],payments:['payments',null],attendance:['attendance',null],updates:['daily_updates',null],contract:['contracts',null],notifications:['notifications',null]};let [table,filter]=map[p];let q=sb.from(table).select('*').order('created_at',{ascending:false}).limit(50);if(filter)q=q.eq(filter,p==='customers'?'customer':'worker');let r=await q;if(r.error)return page(`<div class="content-card"><div class="error">${r.error.message}</div></div>`);let rows=r.data||[];let keys=rows.length?Object.keys(rows[0]).slice(0,7):[];return page(`<div class="content-card"><div class="table-wrap"><table class="table"><thead><tr>${keys.map(k=>`<th>${k}</th>`).join('')}<th>Action</th></tr></thead><tbody>${rows.map(row=>`<tr>${keys.map(k=>`<td>${String(row[k]??'').slice(0,80)}</td>`).join('')}<td><button class="btn edit" onclick="editRecord('${table}','${row.id||''}')">✏️ Edit</button> <button class="btn danger" onclick="deleteRecord('${table}','${row.id||''}')">🗑️ Delete</button></td></tr>`).join('')}</tbody></table></div></div>`)}
async function editRecord(table,id){toast('Edit form अगला चरण में खुलेगा — record सुरक्षित है.')}async function deleteRecord(table,id){if(!confirm('क्या आप यह record delete करना चाहते हैं?'))return;let r=await sb.from(table).delete().eq('id',id);if(r.error)toast(r.error.message);else{toast('Record deleted');go(active)}}
function profilePage(){return page(`<div class="content-card"><div class="profile"><img class="avatar" src="${profile.image_url||''}" onerror="this.style.display='none'"><div><h2>${profile.name||'Admin'}</h2><p>${profile.phone||''} • ${profile.email||''}</p><p>${profile.address||''}</p><div class="notice">Password change Supabase Auth के secure flow से होगा.</div></div></div></div>`)}
async function customerPage(p){if(p==='overview')return page(`<div class="grid"><div class="stat"><small>My Projects</small><strong>—</strong></div><div class="stat"><small>Progress</small><strong>—</strong></div><div class="stat"><small>Paid</small><strong>₹—</strong></div><div class="stat"><small>Notifications</small><strong id="cn">—</strong></div></div><div class="content-card"><div class="notice">आपका enquiry → contract → amount approval → digital approval → project → payment flow इसी dashboard में रहेगा.</div></div>`);if(p==='profile')return profilePage();return tablePage(p==='projects'?'projects':p)}
async function workerPage(p){if(p==='overview')return page(`<div class="grid"><div class="stat"><small>Assigned Projects</small><strong>—</strong></div><div class="stat"><small>Attendance</small><strong>—</strong></div><div class="stat"><small>Paid</small><strong>₹—</strong></div><div class="stat"><small>Balance</small><strong>₹—</strong></div></div><div class="content-card"><div class="notice">Worker attendance में mobile/face verification request Admin approval के बाद Present होगी.</div></div>`);if(p==='profile')return profilePage();return tablePage(p==='projects'?'projects':p)}
function page(html){document.getElementById('page').innerHTML=html;document.getElementById('side').classList.remove('open')}
async function notifications(){let r=await sb.from('notifications').select('id').is('read_at',null).eq('user_id',profile.id);let b=document.getElementById('badge');if((r.data||[]).length){b.textContent=r.data.length;b.classList.remove('hidden')}else b.classList.add('hidden')}
document.getElementById('bell').onclick=async()=>{if(!profile)return;await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',profile.id).is('read_at',null);await notifications();go('notifications')};document.getElementById('hamb').onclick=()=>document.getElementById('side').classList.toggle('open');document.getElementById('langBtn').onclick=()=>{lang=lang==='hi'?'en':'hi';document.getElementById('langBtn').textContent=lang==='hi'?'EN':'हिंदी';if(profile){renderSide();go(active)}};
(async()=>{let s=await sb.auth.getSession();if(s.data.session)enter(s.data.session.user)})();
</script></body></html>
