<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prakash Swami Constructions — Dashboard</title>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0b1220;
      --accent: #e65100;
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    
    /* Login Page */
    .login-wrapper { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #0b1220 0%, #1e293b 100%); padding: 16px; }
    .login-card { width: min(450px, 100%); background: var(--card); border-radius: 20px; padding: 32px 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    .brand-header { text-align: center; margin-bottom: 20px; }
    .brand-header h2 { color: var(--primary); font-size: 22px; font-weight: 800; }
    .brand-header p { color: var(--muted); font-size: 13px; margin-top: 4px; }
    
    .role-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #e2e8f0; padding: 4px; border-radius: 12px; margin-bottom: 20px; }
    .role-tabs button { padding: 10px 4px; border: 0; background: transparent; font-weight: 700; font-size: 13px; border-radius: 8px; cursor: pointer; color: var(--muted); transition: 0.2s; }
    .role-tabs button.active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--primary); }
    
    .btn-primary { width: 100%; padding: 13px; background: var(--primary); color: #fff; border: 0; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    .btn-primary:hover { opacity: 0.95; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { padding: 8px 14px; background: var(--border); color: var(--text); border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
    
    /* Action Buttons */
    .btn-action-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 6px; border: 0; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .btn-success { background: #dcfce7; color: #15803d; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .btn-warning { background: #fef3c7; color: #b45309; }
    .btn-edit { background: #e0e7ff; color: #4338ca; }
    .btn-gold { background: #fef08a; color: #854d0e; font-weight: 700; }
    .btn-check { background: #0b1220; color: #fff; font-weight: 700; }
    
    .alert-box { padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; line-height: 1.5; }
    .alert-error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .alert-info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .hidden { display: none !important; }

    /* Dashboard Layout */
    .app-container { display: flex; flex-direction: column; min-height: 100vh; }
    .app-header { height: 64px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; z-index: 40; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-title { font-size: 16px; font-weight: 800; color: var(--primary); }
    .role-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .role-badge.admin { background: #fee2e2; color: var(--danger); }
    .role-badge.customer { background: #e0e7ff; color: #4338ca; }
    .role-badge.worker { background: #fef3c7; color: var(--warning); }
    
    .header-right { display: flex; align-items: center; gap: 12px; }

    .app-body { display: grid; grid-template-columns: 240px 1fr; flex: 1; }
    .app-sidebar { background: var(--primary); color: #fff; padding: 16px 10px; display: flex; flex-direction: column; gap: 4px; min-height: calc(100vh - 64px); }
    .sidebar-btn { width: 100%; padding: 11px 14px; border: 0; background: transparent; color: #94a3b8; border-radius: 10px; text-align: left; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
    .sidebar-btn:hover, .sidebar-btn.active { background: rgba(255,255,255,0.1); color: #fff; }
    .sidebar-btn i { width: 18px; font-size: 15px; }

    .app-main { padding: 24px; max-width: 1300px; width: 100%; margin: 0 auto; }
    .page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .page-head h1 { font-size: 22px; font-weight: 800; color: var(--primary); }

    /* Universal Search Bar */
    .search-box { width: 100%; max-width: 400px; position: relative; }
    .search-box input { width: 100%; padding: 10px 14px 10px 36px; border: 1px solid var(--border); border-radius: 10px; background: #fff; font-size: 13px; outline: none; }
    .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card { background: #fff; padding: 18px; border-radius: 14px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .stat-card h4 { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .stat-card .val { font-size: 24px; font-weight: 800; color: var(--primary); margin-top: 4px; }
    .stat-card .icon-box { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; }

    /* Cards & Tables */
    .card { background: #fff; border-radius: 16px; border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; }
    .table-container { width: 100%; overflow-x: auto; background: #fff; border-radius: 14px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background: #f8fafc; padding: 12px 16px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--border); }
    td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    
    /* Progress Bar */
    .progress-bar-bg { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .progress-bar-fill { height: 100%; background: var(--success); border-radius: 4px; }

    /* Legal Contract Agreement Document Box (Matching PDF) */
    .contract-doc { background: #fff; border: 2px solid #334155; border-radius: 16px; padding: 28px; margin-top: 14px; position: relative; box-shadow: 0 6px 18px rgba(0,0,0,0.06); font-size: 13px; line-height: 1.6; color: #1e293b; }
    .contract-header { border-bottom: 2px double #0b1220; padding-bottom: 14px; margin-bottom: 16px; text-align: center; }
    .contract-header h2 { font-size: 20px; font-weight: 800; color: var(--primary); text-transform: uppercase; }
    .contract-header h3 { font-size: 15px; font-weight: 700; color: #b45309; margin-top: 4px; }
    .contract-header p { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .contract-section { margin-bottom: 18px; }
    .contract-section h4 { color: var(--primary); border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; margin-bottom: 8px; font-size: 14px; font-weight: 800; }
    .milestone-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    .milestone-table th { background: #f1f5f9; padding: 8px 10px; border: 1px solid #cbd5e1; }
    .milestone-table td { padding: 8px 10px; border: 1px solid #cbd5e1; }
    .amount-badge-box { background: #f0fdf4; border: 2px dashed var(--success); padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
    .sign-box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; border-top: 2px solid #cbd5e1; padding-top: 16px; }
    .sign-card { background: #f8fafc; padding: 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 12px; }

    /* Sub-Tabs */
    .sub-tabs { display: flex; gap: 8px; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .sub-tab-btn { padding: 8px 16px; border-radius: 8px; border: 0; background: #e2e8f0; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--muted); }
    .sub-tab-btn.active { background: var(--primary); color: #fff; }

    /* Thumbnails */
    .avatar-thumb { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #e2e8f0; cursor: pointer; transition: 0.2s; }
    .avatar-thumb:hover { transform: scale(1.1); border-color: var(--accent); }
    .face-compare-container { display: flex; align-items: center; gap: 12px; }
    .face-compare-box { text-align: center; font-size: 11px; color: var(--muted); }
    .face-compare-box img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; display: block; margin-bottom: 4px; border: 1px solid #ccc; cursor: pointer; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: grid; place-items: center; z-index: 100; padding: 16px; }
    .modal-card { width: min(750px, 100%); background: #fff; border-radius: 18px; padding: 24px; max-height: 90vh; overflow-y: auto; }

    @media(max-width: 840px) {
      .app-body { grid-template-columns: 1fr; }
      .app-sidebar { display: flex; flex-direction: row; overflow-x: auto; min-height: auto; padding: 10px; position: sticky; bottom: 0; z-index: 30; }
      .sidebar-btn { flex-direction: column; align-items: center; text-align: center; font-size: 11px; padding: 8px 12px; gap: 4px; }
      .sidebar-btn i { font-size: 16px; }
      .sign-box-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- 1. LOGIN SCREEN -->
<div id="loginSection" class="login-wrapper">
  <div class="login-card">
    <div class="brand-header">
      <i class="fa-solid fa-helmet-safety" style="font-size:32px; color:var(--accent); margin-bottom:8px;"></i>
      <h2>Prakash Swami Constructions</h2>
      <p>Construction Management Portal</p>
    </div>

    <div class="role-tabs">
      <button type="button" id="tabAdmin" class="active" onclick="selectRole('admin')"><i class="fa-solid fa-crown"></i> Admin</button>
      <button type="button" id="tabCustomer" onclick="selectRole('customer')"><i class="fa-solid fa-user"></i> Customer</button>
      <button type="button" id="tabWorker" onclick="selectRole('worker')"><i class="fa-solid fa-hammer"></i> Worker</button>
    </div>

    <div id="loginAlert" class="alert-box alert-error hidden"></div>

    <form id="authForm" onsubmit="handleAuthSubmit(event)">
      <div class="form-group">
        <label id="inputLabel">Admin Email</label>
        <input id="loginId" type="text" required value="satpalswami22742@gmail.com" placeholder="satpalswami22742@gmail.com">
      </div>

      <div class="form-group" id="pwGroup">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••">
      </div>

      <button id="loginSubmitBtn" type="submit" class="btn-primary">
        <i class="fa-solid fa-right-to-bracket"></i> Login
      </button>
    </form>

    <div id="signupGroup" class="hidden" style="margin-top: 14px; text-align: center;">
      <p style="font-size: 13px; color: var(--muted);">नया खाता बनाना चाहते हैं? 
        <a href="javascript:void(0)" onclick="openCustomerSignupModal()" style="color:var(--accent); font-weight:700; text-decoration:underline;">Customer Sign Up</a>
      </p>
    </div>

    <div style="margin-top: 20px; font-size: 12px; color: var(--muted); line-height: 1.6; border-top: 1px solid var(--border); padding-top: 14px;">
      <p><b>Worker Login:</b> सिर्फ अपना रजिस्टर्ड मोबाइल नंबर डालें (No Password/OTP)।</p>
    </div>
  </div>
</div>

<!-- 2. MAIN DASHBOARD APP -->
<div id="appSection" class="app-container hidden">
  <header class="app-header">
    <div class="header-left">
      <i class="fa-solid fa-building" style="color:var(--accent); font-size:20px;"></i>
      <span class="header-title">Prakash Swami Constructions</span>
      <span id="roleBadge" class="role-badge admin">Admin</span>
    </div>
    <div class="header-right">
      <button class="btn-secondary" onclick="handleLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
    </div>
  </header>

  <div class="app-body">
    <aside class="app-sidebar" id="sidebarNav"></aside>
    <main class="app-main" id="mainContent"></main>
  </div>
</div>

<!-- Reusable Modal Container -->
<div id="modalContainer" class="modal-overlay hidden"></div>

<script>
// --- SUPABASE CONFIGURATION ---
const SUPABASE_URL = 'https://aamstyeeewncmgqdxpoh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fOzZvfiio6HSaEgplYUgOA_lWy1tbVe';
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const ADMIN_EMAIL = 'satpalswami22742@gmail.com';
let currentRole = 'admin';
let currentUser = null;

const $ = id => document.getElementById(id);

// --- INITIALIZATION ---
window.addEventListener('DOMContentLoaded', async () => {
  const hash = window.location.hash.replace('#', '');
  if (['admin', 'customer', 'worker'].includes(hash)) {
    selectRole(hash);
  }

  const savedWorker = sessionStorage.getItem('ps_worker_session');
  if (savedWorker) {
    currentUser = JSON.parse(savedWorker);
    currentRole = 'worker';
    launchDashboard();
    return;
  }

  if (db) {
    try {
      const { data: { session } } = await db.auth.getSession();
      if (session?.user) {
        await loadUserProfile(session.user);
      }
    } catch (e) {
      console.log('Session fetch error:', e);
    }
  }
});

function selectRole(role) {
  currentRole = role;
  $('loginAlert').classList.add('hidden');
  
  document.querySelectorAll('.role-tabs button').forEach(b => b.classList.remove('active'));
  if (role === 'admin') $('tabAdmin').classList.add('active');
  if (role === 'customer') $('tabCustomer').classList.add('active');
  if (role === 'worker') $('tabWorker').classList.add('active');

  const isWorker = (role === 'worker');
  const isAdmin = (role === 'admin');

  $('inputLabel').textContent = isWorker ? 'Registered Mobile Number' : (isAdmin ? 'Admin Email' : 'Customer Email');
  $('loginId').type = isWorker ? 'tel' : 'email';
  $('loginId').value = isAdmin ? ADMIN_EMAIL : '';
  $('loginId').placeholder = isWorker ? '9876543210' : (isAdmin ? ADMIN_EMAIL : 'customer@example.com');

  $('pwGroup').classList.toggle('hidden', isWorker);
  $('signupGroup').classList.toggle('hidden', role !== 'customer');
}

async function handleAuthSubmit(e) {
  e.preventDefault();
  $('loginAlert').classList.add('hidden');
  const idVal = $('loginId').value.trim();
  const passVal = $('loginPassword').value;

  if (!db) return showLoginError('Supabase Database से कनेक्शन नहीं बन सका।');
  if (!idVal) return showLoginError('कृपया आवश्यक जानकारी दर्ज करें।');

  const btn = $('loginSubmitBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';

  try {
    if (currentRole === 'worker') {
      const { data: worker, error } = await db.from('profiles')
        .select('*')
        .eq('phone', idVal)
        .eq('role', 'worker')
        .eq('is_active', true)
        .maybeSingle();

      if (error) throw error;
      if (!worker) return showLoginError('यह मोबाइल नंबर किसी सक्रिय वर्कर के रूप में रजिस्टर्ड नहीं है।');

      currentUser = worker;
      sessionStorage.setItem('ps_worker_session', JSON.stringify(worker));
      launchDashboard();
      return;
    }

    if (!passVal) return showLoginError('कृपया पासवर्ड दर्ज करें।');

    const { data, error } = await db.auth.signInWithPassword({
      email: idVal,
      password: passVal
    });

    if (error) {
      if (error.message.includes('Invalid login credentials')) {
        return showLoginError('गलत Email या Password दर्ज किया गया है।');
      }
      throw error;
    }

    await loadUserProfile(data.user);
  } catch (err) {
    showLoginError(err.message || 'Login में समस्या हुई।');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
  }
}

function showLoginError(msg) {
  const el = $('loginAlert');
  el.textContent = msg;
  el.classList.remove('hidden');
}

async function loadUserProfile(authUser) {
  let { data: profile } = await db.from('profiles').select('*').eq('id', authUser.id).maybeSingle();
  
  if (!profile) {
    const roleToSet = authUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() ? 'admin' : 'customer';
    const newProfile = {
      id: authUser.id,
      email: authUser.email,
      name: authUser.user_metadata?.name || (roleToSet === 'admin' ? 'Prakash Swami' : 'Customer'),
      role: roleToSet,
      phone: authUser.user_metadata?.phone || '',
      is_active: true
    };
    await db.from('profiles').insert(newProfile);
    profile = newProfile;
  }

  currentUser = profile;
  currentRole = profile.role;
  launchDashboard();
}

function launchDashboard() {
  $('loginSection').classList.add('hidden');
  $('appSection').classList.remove('hidden');
  
  const badge = $('roleBadge');
  badge.textContent = currentRole.toUpperCase();
  badge.className = `role-badge ${currentRole}`;

  renderSidebar();
}

function renderSidebar() {
  const nav = $('sidebarNav');
  let menus = [];

  if (currentRole === 'admin') {
    menus = [
      { id: 'overview', icon: 'fa-chart-pie', label: 'Overview' },
      { id: 'enquiries', icon: 'fa-inbox', label: 'Enquiries & Approvals' },
      { id: 'contracts', icon: 'fa-file-signature', label: 'Contracts' },
      { id: 'projects', icon: 'fa-trowel-bricks', label: 'Projects' },
      { id: 'daily_updates', icon: 'fa-pen-ruler', label: 'Daily Updates' },
      { id: 'customers', icon: 'fa-users', label: 'Customers' },
      { id: 'workers', icon: 'fa-helmet-safety', label: 'Workers' },
      { id: 'payments', icon: 'fa-money-bill-wave', label: 'Payments' },
      { id: 'expenses', icon: 'fa-receipt', label: 'Expenses' },
      { id: 'settings', icon: 'fa-gear', label: 'Settings' }
    ];
  } else if (currentRole === 'customer') {
    menus = [
      { id: 'my_projects', icon: 'fa-house-chimney', label: 'My Projects' },
      { id: 'my_contracts', icon: 'fa-file-contract', label: 'My Contracts' },
      { id: 'my_enquiries', icon: 'fa-paper-plane', label: 'New Enquiry' },
      { id: 'my_payments', icon: 'fa-wallet', label: 'Payments & UPI' },
      { id: 'my_profile', icon: 'fa-user', label: 'My Profile' }
    ];
  } else {
    menus = [
      { id: 'worker_attendance', icon: 'fa-camera', label: 'Face Attendance' },
      { id: 'worker_earnings', icon: 'fa-hand-holding-dollar', label: 'My Earnings' },
      { id: 'worker_updates', icon: 'fa-pen-to-square', label: 'Daily Work Update' }
    ];
  }

  nav.innerHTML = menus.map((m, idx) => `
    <button class="sidebar-btn ${idx === 0 ? 'active' : ''}" onclick="openView('${m.id}', this)">
      <i class="fa-solid ${m.icon}"></i> <span>${m.label}</span>
    </button>
  `).join('');

  openView(menus[0].id);
}

// --- VIEW ROUTER ---
async function openView(viewId, btnElement) {
  if (btnElement) {
    document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');
  }

  const main = $('mainContent');
  main.innerHTML = '<div style="text-align:center; padding:40px;"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></div>';

  try {
    if (currentRole === 'admin') {
      if (viewId === 'overview') await renderAdminOverview(main);
      else if (viewId === 'enquiries') await renderAdminEnquiriesAndAttendance(main);
      else if (viewId === 'contracts') await renderAdminContracts(main);
      else if (viewId === 'projects') await renderAdminProjects(main);
      else if (viewId === 'daily_updates') await renderAdminDailyUpdates(main);
      else if (viewId === 'customers') await renderAdminCustomers(main);
      else if (viewId === 'workers') await renderAdminWorkers(main);
      else if (viewId === 'payments') await renderAdminPayments(main);
      else if (viewId === 'expenses') await renderAdminExpenses(main);
      else if (viewId === 'settings') await renderAdminSettings(main);
    } else if (currentRole === 'customer') {
      if (viewId === 'my_projects') await renderCustomerProjects(main);
      else if (viewId === 'my_contracts') await renderCustomerContracts(main);
      else if (viewId === 'my_enquiries') await renderCustomerEnquiryForm(main);
      else if (viewId === 'my_payments') await renderCustomerPayments(main);
      else if (viewId === 'my_profile') await renderCustomerProfile(main);
    } else {
      if (viewId === 'worker_attendance') await renderWorkerAttendance(main);
      else if (viewId === 'worker_earnings') await renderWorkerEarnings(main);
      else if (viewId === 'worker_updates') await renderWorkerUpdates(main);
    }
  } catch (err) {
    main.innerHTML = `<div class="card alert-box alert-error">Error loading section: ${err.message}</div>`;
  }
}

function showFullImage(url, title = 'Photo Preview') {
  if (!url) return;

}

async function openFullAgreementModal(contractId) {

    .select('*, project:project_id(name, address, customer:customer_id(name, phone, address))')
    .eq('id', contractId)
    .single();

  if (!c) return;
  const isLocked = c.status === 'locked' || (c.admin_approved_at && c.customer_approved_at);

  const modal = $('modalContainer');
  modal.classList.remove('hidden');
  modal.innerHTML = `
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--border); padding-bottom:10px;">
        <h3>करारनामा / अनुबंध विवरण (Full Agreement Document v${c.version})</h3>
        <button onclick="$('modalContainer').classList.add('hidden')" style="border:0; background:transparent; font-size:22px; cursor:pointer;">&times;</button>
      </div>

      <div style="margin-bottom:14px;">
        ${generateLegalAgreementHtml(c, isLocked)}
      </div>

      ${!isLocked ? `
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
          <button class="btn-secondary" onclick="proposeContractAmountPrompt('${c.id}', ${c.final_amount})"><i class="fa-solid fa-pen"></i> Edit Amount</button>
          ${!c.admin_approved_at ? `<button class="btn-primary" style="width:auto; background:var(--success);" onclick="adminApproveContract('${c.id}')"><i class="fa-solid fa-check"></i> Approve Contract as Admin</button>` : ''}
        </div>
      ` : ''}
    </div>
  `;
}

async function proposeContractAmountPrompt(contractId, currentAmount) {
  const newAmt = prompt('नया Contract Amount (₹) दर्ज करें:', currentAmount);
  if (newAmt === null) return;
  const num = Number(newAmt);
  if (isNaN(num) || num <= 0) return alert('कृपया सही अमाउंट दर्ज करें।');

  await db.from('contracts').update({
    final_amount: num,
    proposed_by: currentUser.id,
    admin_approved_at: null,
    customer_approved_at: null,
    status: 'amount_discussion'
  }).eq('id', contractId);

  alert(`नया अमाउंट ₹${num.toLocaleString('en-IN')} प्रपोज़ हो गया है। दोनों पक्षों को इसे री-अप्रूव करना होगा।`);
  $('modalContainer').classList.add('hidden');
  openView(currentRole === 'admin' ? 'contracts' : 'my_contracts');
}

async function adminApproveContract(contractId) {
  if (!confirm('क्या आप इस अनुबंध को अपनी स्वीकृति (Admin Approval) देना चाहते हैं?')) return;
  const now = new Date().toISOString();
  const { data: c } = await db.from('contracts').select('*, project:project_id(*)').eq('id', contractId).single();
  const isFullyApproved = Boolean(c.customer_approved_at);

  await db.from('contracts').update({
    admin_approved_at: now,
    admin_approved_by: currentUser.id,
    status: isFullyApproved ? 'locked' : 'amount_discussion',
    locked_at: isFullyApproved ? now : null
  }).eq('id', contractId);

  if (isFullyApproved && c.project_id) {
    await db.from('projects').update({ status: 'active', total_amount: c.final_amount }).eq('id', c.project_id);
    alert('अनुबंध पूरी तरह लॉक हो गया है और प्रोजेक्ट शुरू हो चुका है! 🔒');
  } else {
    alert('एडमिन स्वीकृति दर्ज हो गई!');
  }

  $('modalContainer').classList.add('hidden');
  openView('contracts');
}

async function approveCustomerContract(contractId) {
  if (!confirm('क्या आप इस अनुबंध को अपनी डिजिटल स्वीकृति देना चाहते हैं?')) return;
  const now = new Date().toISOString();
  const { data: c } = await db.from('contracts').select('*, project:project_id(*)').eq('id', contractId).single();
  const isFullyApproved = Boolean(c.admin_approved_at);

  await db.from('contracts').update({
    customer_approved_at: now,
    customer_approved_by: currentUser.id,
    status: isFullyApproved ? 'locked' : 'amount_discussion',
    locked_at: isFullyApproved ? now : null
  }).eq('id', contractId);

  if (isFullyApproved && c.project_id) {
    await db.from('projects').update({ status: 'active', total_amount: c.final_amount }).eq('id', c.project_id);
    alert('अनुबंध पूरी तरह लॉक हो गया है और प्रोजेक्ट शुरू हो चुका है! 🔒');
  } else {
    alert('आपकी डिजिटल स्वीकृति दर्ज हो गई है!');
  }

  openView('my_contracts');
}

async function deleteContract(id) {
  if (!confirm('क्या आप इस कॉन्ट्रैक्ट को हटाना चाहते हैं?')) return;
  await db.from('contracts').delete().eq('id', id);
  openView('contracts');
}

async function startAttendanceCamera() {
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 480, height: 480 } });
    const vid = $('webcam');
    if (vid) vid.srcObject = videoStream;
  } catch (err) {
    alert('कैमरा शुरू करने में समस्या: ' + err.message);
  }
}

async function captureAndVerifyFaceAttendance() {
  const vid = $('webcam');
  const canvas = $('canvas');
  const btn = $('snapBtn');
  const statusMsg = $('attStatusMsg');

  if (!vid) return;
  if (!currentUser.image_url) return alert('आपका फ़ेस अभी रजिस्टर नहीं है। एडमिन से फ़ोटो रजिस्टर करवाएं।');

  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Analyzing Face...';

  canvas.width = vid.videoWidth || 320;
  canvas.height = vid.videoHeight || 240;
  canvas.getContext('2d').drawImage(vid, 0, 0, canvas.width, canvas.height);
  const scannedFaceData = canvas.toDataURL('image/jpeg', 0.6);

  const matchScore = await compareFaceFeatures(currentUser.image_url, scannedFaceData);

  if (matchScore < 55) {
    statusMsg.className = 'alert-box alert-error';
    statusMsg.innerHTML = '<b>❌ Face Match Failed!</b> चेहरा रजिस्टर्ड फ़ोटो से मैच नहीं हुआ। कृपया सही रोशनी में सीधा चेहरा रखकर दोबारा स्कैन करें।';
    statusMsg.classList.remove('hidden');

    btn.disabled = false;
    btn.className = 'btn-primary btn-warning';
    btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Retry Face Scan (दोबारा प्रयास करें)';
    btn.onclick = () => {
      statusMsg.classList.add('hidden');
      btn.className = 'btn-primary';
      btn.innerHTML = '<i class="fa-solid fa-camera"></i> Face Scan & Submit';
      btn.onclick = captureAndVerifyFaceAttendance;
    };
    return;
  }

  if (videoStream) videoStream.getTracks().forEach(t => t.stop());

  await db.from('attendance').insert({
    worker_id: currentUser.id,
    face_image_url: scannedFaceData,
    status: 'pending',
    work_date: new Date().toISOString().split('T')[0]
  });

  alert('Face Matched ✅ हाजिरी सबमिट हो गई!');
  openView('worker_attendance');
}

async function compareFaceFeatures(img1Url, img2Url) {
  return new Promise(async (resolve) => {
    try {
      const [img1, img2] = await Promise.all([loadImageElement(img1Url), loadImageElement(img2Url)]);
      const size = 64;
      const data1 = extractGrayscalePixels(img1, size, size);
      const data2 = extractGrayscalePixels(img2, size, size);

      let mean1 = 0, mean2 = 0;
      const len = data1.length;
      for (let i = 0; i < len; i++) { mean1 += data1[i]; mean2 += data2[i]; }
      mean1 /= len; mean2 /= len;

      let num = 0, den1 = 0, den2 = 0;
      for (let i = 0; i < len; i++) {
        const d1 = data1[i] - mean1, d2 = data2[i] - mean2;
        num += d1 * d2;
        den1 += d1 * d1;
        den2 += d2 * d2;
      }

      const correlation = (den1 > 0 && den2 > 0) ? (num / Math.sqrt(den1 * den2)) : 0;
      resolve(Math.max(0, Math.min(100, Math.round(((correlation + 1) / 2) * 100))));
    } catch (e) { resolve(75); }
  });
}

function loadImageElement(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}

function extractGrayscalePixels(img, w, h) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  const imgData = ctx.getImageData(0, 0, w, h).data;
  const gray = new Float32Array(w * h);
  for (let i = 0, j = 0; i < imgData.length; i += 4, j++) {
    gray[j] = 0.299 * imgData[i] + 0.587 * imgData[i + 1] + 0.114 * imgData[i + 2];
  }
  return gray;
}

function readFileAsBase64(file) {

    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);

    reader.readAsDataURL(file);
  });
