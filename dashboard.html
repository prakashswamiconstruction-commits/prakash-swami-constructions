<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prakash Swami Constructions — Dashboard</title>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0b1220;
      --accent: #e65100;
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    
    /* Login Page with Prakash Swami Background */
    .login-wrapper {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(rgba(11, 18, 32, 0.82), rgba(11, 18, 32, 0.94)), url('prakash-chand-swami-construction-site.jpg') center/cover no-repeat;
      padding: 16px;
      position: relative;
    }
    .login-card { width: min(450px, 100%); background: var(--card); border-radius: 20px; padding: 32px 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    .brand-header { text-align: center; margin-bottom: 20px; }
    .brand-header h2 { color: var(--primary); font-size: 22px; font-weight: 800; }
    .brand-header p { color: var(--muted); font-size: 13px; margin-top: 2px; }
    
    .role-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #e2e8f0; padding: 4px; border-radius: 12px; margin-bottom: 20px; }
    .role-tabs button { padding: 10px 4px; border: 0; background: transparent; font-weight: 700; font-size: 13px; border-radius: 8px; cursor: pointer; color: var(--muted); transition: 0.2s; }
    .role-tabs button.active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--primary); }
    
    .btn-primary { width: 100%; padding: 13px; background: var(--primary); color: #fff; border: 0; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    .btn-primary:hover { opacity: 0.95; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { padding: 8px 14px; background: var(--border); color: var(--text); border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
    
    /* Action Buttons */
    .btn-action-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 6px; border: 0; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
    .btn-success { background: #dcfce7; color: #15803d; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .btn-warning { background: #fef3c7; color: #b45309; }
    .btn-edit { background: #e0e7ff; color: #4338ca; }
    .btn-gold { background: #fef08a; color: #854d0e; font-weight: 700; border: 1px solid #fde047; }
    .btn-check { background: #0b1220; color: #fff; font-weight: 700; }
    
    .alert-box { padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; line-height: 1.5; }
    .alert-error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .alert-info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .hidden { display: none !important; }

    /* Dashboard Layout */
    .app-container { display: flex; flex-direction: column; min-height: 100vh; }
    .app-header { height: 64px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; z-index: 40; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-title { font-size: 16px; font-weight: 800; color: var(--primary); }
    .role-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .role-badge.admin { background: #fee2e2; color: var(--danger); }
    .role-badge.customer { background: #e0e7ff; color: #4338ca; }
    .role-badge.worker { background: #fef3c7; color: var(--warning); }
    
    .header-right { display: flex; align-items: center; gap: 12px; }
    .notif-btn { position: relative; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: #fff; display: grid; place-items: center; cursor: pointer; color: var(--text); }
    .notif-badge { position: absolute; top: -4px; right: -4px; background: var(--danger); color: #fff; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; }

    .app-body { display: grid; grid-template-columns: 240px 1fr; flex: 1; }
    .app-sidebar { background: var(--primary); color: #fff; padding: 16px 10px; display: flex; flex-direction: column; gap: 4px; min-height: calc(100vh - 64px); }
    .sidebar-btn { width: 100%; padding: 11px 14px; border: 0; background: transparent; color: #94a3b8; border-radius: 10px; text-align: left; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
    .sidebar-btn:hover, .sidebar-btn.active { background: rgba(255,255,255,0.1); color: #fff; }
    .sidebar-btn i { width: 18px; font-size: 15px; }

    .app-main { padding: 24px; max-width: 1300px; width: 100%; margin: 0 auto; }
    .page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .page-head h1 { font-size: 22px; font-weight: 800; color: var(--primary); }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card { background: #fff; padding: 18px; border-radius: 14px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .stat-card h4 { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .stat-card .val { font-size: 24px; font-weight: 800; color: var(--primary); margin-top: 4px; }
    .stat-card .icon-box { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; }

    /* Cards & Tables */
    .card { background: #fff; border-radius: 16px; border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; }
    .table-container { width: 100%; overflow-x: auto; background: #fff; border-radius: 14px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background: #f8fafc; padding: 12px 16px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--border); }
    td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    
    /* Progress Bar */
    .progress-bar-bg { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .progress-bar-fill { height: 100%; background: var(--success); border-radius: 4px; }

    /* Note display box */
    .note-box { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: #f8fafc; padding: 6px 10px; border-radius: 8px; border: 1px dashed #cbd5e1; max-width: 220px; font-size: 12px; line-height: 1.4; }
    .note-text { flex: 1; overflow: hidden; text-overflow: ellipsis; }

    /* Legal Contract Agreement Document Box */
    .contract-doc { background: #fff; border: 2px solid #334155; border-radius: 16px; padding: 28px; margin-top: 14px; position: relative; box-shadow: 0 6px 18px rgba(0,0,0,0.06); font-size: 13px; line-height: 1.6; color: #1e293b; }
    .contract-header { border-bottom: 2px double #0b1220; padding-bottom: 14px; margin-bottom: 16px; text-align: center; }
    .contract-header h2 { font-size: 20px; font-weight: 800; color: var(--primary); text-transform: uppercase; }
    .contract-header h3 { font-size: 15px; font-weight: 700; color: #b45309; margin-top: 4px; }
    .contract-header p { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .contract-section { margin-bottom: 18px; }
    .contract-section h4 { color: var(--primary); border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; margin-bottom: 8px; font-size: 14px; font-weight: 800; }
    .milestone-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    .milestone-table th { background: #f1f5f9; padding: 8px 10px; border: 1px solid #cbd5e1; }
    .milestone-table td { padding: 8px 10px; border: 1px solid #cbd5e1; }
    .sign-box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; border-top: 2px solid #cbd5e1; padding-top: 16px; }
    .sign-card { background: #f8fafc; padding: 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 12px; }

    /* Sub-Tabs */
    .sub-tabs { display: flex; gap: 8px; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .sub-tab-btn { padding: 8px 16px; border-radius: 8px; border: 0; background: #e2e8f0; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--muted); }
    .sub-tab-btn.active { background: var(--primary); color: #fff; }

    /* Thumbnails */
    .avatar-thumb { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #e2e8f0; cursor: pointer; transition: 0.2s; }
    .avatar-thumb:hover { transform: scale(1.1); border-color: var(--accent); }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: grid; place-items: center; z-index: 100; padding: 16px; }
    .modal-card { width: min(750px, 100%); background: #fff; border-radius: 18px; padding: 24px; max-height: 90vh; overflow-y: auto; }

    /* Mobile Slide-in Drawer Sidebar */
    .mobile-menu-toggle {
      display: none;
      background: transparent;
      border: 0;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      margin-right: 6px;
    }
    .mobile-menu-toggle:hover { background: #f1f5f9; }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(11, 18, 32, 0.65);
      backdrop-filter: blur(3px);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    .sidebar-mobile-header {
      display: none;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 12px;
    }

    @media(max-width: 840px) {
      .mobile-menu-toggle { display: inline-flex; align-items: center; justify-content: center; }
      .sidebar-mobile-header { display: flex; }
      
      .app-body { display: block; }
      
      .app-sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 280px;
        height: 100vh;
        z-index: 1000;
        transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 6px 0 25px rgba(0,0,0,0.4);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        padding: 16px 12px;
      }
      .app-sidebar.open {
        transform: translateX(0);
      }
      .sidebar-btn {
        flex-direction: row;
        align-items: center;
        text-align: left;
        font-size: 14px;
        padding: 12px 16px;
        gap: 12px;
        white-space: normal;
      }
      .sidebar-btn i { width: 20px; font-size: 16px; }
      .sign-box-grid { grid-template-columns: 1fr; }
      .app-main { padding: 16px; }
      .app-header { padding: 0 14px; }
    }
  </style>
</head>
<body>

<!-- 1. LOGIN SCREEN -->
<div id="loginSection" class="login-wrapper">
  <div class="login-card">
    <div class="brand-header">
      <div style="text-align:center; margin-bottom:12px;">
        <img src="prakash-chand-swami-construction-site.jpg" alt="Prakash Chand Swami" onerror="this.onerror=null; this.src='prakash-chand-swami-project-planning.jpg';" style="width:84px; height:84px; border-radius:50%; object-fit:cover; border:3px solid var(--accent); box-shadow:0 6px 18px rgba(0,0,0,0.25); display:inline-block;">
      </div>
      <h2 style="color:var(--primary); font-size:22px; font-weight:800;">Prakash Swami Constructions</h2>
      <p style="color:var(--muted); font-size:13px; margin-top:2px;">Construction Management Portal</p>
    </div>

    <div class="role-tabs">
      <button type="button" id="tabAdmin" class="active" onclick="selectRole('admin')"><i class="fa-solid fa-crown"></i> Admin</button>
      <button type="button" id="tabCustomer" onclick="selectRole('customer')"><i class="fa-solid fa-user"></i> Customer</button>
      <button type="button" id="tabWorker" onclick="selectRole('worker')"><i class="fa-solid fa-hammer"></i> Worker</button>
    </div>

    <div id="loginAlert" class="alert-box alert-error hidden"></div>

    <form id="authForm" onsubmit="handleAuthSubmit(event)">
      <div class="form-group">
        <label id="inputLabel">Admin Email</label>
        <input id="loginId" type="text" required value="satpalswami22742@gmail.com" placeholder="satpalswami22742@gmail.com">
      </div>

      <div class="form-group" id="pwGroup">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••">
      </div>

      <button id="loginSubmitBtn" type="submit" class="btn-primary">
        <i class="fa-solid fa-right-to-bracket"></i> Login
      </button>
    </form>

    <div id="signupGroup" class="hidden" style="margin-top: 14px; text-align: center;">
      <p style="font-size: 13px; color: var(--muted);">नया खाता बनाना चाहते हैं? 
        <a href="javascript:void(0)" onclick="openCustomerSignupModal()" style="color:var(--accent); font-weight:700; text-decoration:underline;">Customer Sign Up</a>
      </p>
    </div>

    <div style="margin-top: 20px; font-size: 12px; color: var(--muted); line-height: 1.6; border-top: 1px solid var(--border); padding-top: 14px;">
      <p><b>Worker Login:</b> सिर्फ अपना रजिस्टर्ड मोबाइल नंबर डालें (No Password/OTP)।</p>
    </div>
  </div>
</div>

<!-- 2. MAIN DASHBOARD APP -->
<div id="appSection" class="app-container hidden">
  <header class="app-header">
    <div class="header-left">
      <button class="mobile-menu-toggle" onclick="toggleMobileSidebar()" title="Menu">
        <i class="fa-solid fa-bars"></i>
      </button>
      <i class="fa-solid fa-building" style="color:var(--accent); font-size:20px;"></i>
      <span class="header-title">Prakash Swami</span>
      <span id="roleBadge" class="role-badge admin">Admin</span>
    </div>
    <div class="header-right">
      <!-- Notification Bell with Red Badge -->
      <button class="notif-btn" onclick="openNotificationsModal()" title="Notifications">
        <i class="fa-regular fa-bell"></i>
        <span id="notifBadge" class="notif-badge hidden">0</span>
      </button>
      <button class="btn-secondary" onclick="handleLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
    </div>
  </header>

  <!-- Sidebar Overlay for Phone -->
  <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleMobileSidebar(false)"></div>

  <div class="app-body">
    <aside class="app-sidebar" id="sidebarNav"></aside>
    <main class="app-main" id="mainContent"></main>
  </div>
</div>

<!-- Reusable Modal Container -->
<div id="modalContainer" class="modal-overlay hidden"></div>

<script>
// --- SUPABASE CONFIGURATION ---
const SUPABASE_URL = 'https://aamstyeeewncmgqdxpoh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fOzZvfiio6HSaEgplYUgOA_lWy1tbVe';
function getDB() { return db; }
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const ADMIN_EMAIL = 'satpalswami22742@gmail.com';

let currentRole = 'admin';
let currentUser = null;
let activeEnqTab = 'customer_enq';

const $ = id => document.getElementById(id);

// Safe String Utilities to Prevent Any Null / Undefined Crashes
function safeStr(val, fallback = '') {
  if (val === null || val === undefined) return fallback;
  return String(val);
}

function escapeAttr(val) {
  if (val === null || val === undefined) return '';
  return String(val)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\"/g, '&quot;')
    .replace(/\n/g, ' ');
}

// UPI ID Generator Helper (@axl format)
function getUpiIdFromPhone(phone) {
  if (!phone) return '9785438345@axl';
  const clean = String(phone).replace(/[^0-9]/g, '');
  if (clean.length >= 10) return `${clean.slice(-10)}@axl`;
  return `${phone}@axl`;
}

// Global modal background click to close
window.addEventListener('DOMContentLoaded', () => {
  const mc = document.getElementById('modalContainer');
  if (mc) {
    mc.addEventListener('click', (e) => {
      if (e.target === mc) mc.classList.add('hidden');
    });
  }
});

// --- INITIALIZATION ---
window.addEventListener('DOMContentLoaded', async () => {
  const hash = window.location.hash.replace('#', '');
  if (['admin', 'customer', 'worker'].includes(hash)) {
    selectRole(hash);
  }
  
  if (db) {
    const { data: { session } } = await db.auth.getSession();
    if (session?.user) {
      await bootstrapUser(session.user);
    }
  }
});

function selectRole(role) {
  currentRole = role;
  ['tabAdmin', 'tabCustomer', 'tabWorker'].forEach(t => $(t).classList.remove('active'));
  
  const inputLabel = $('inputLabel');
  const loginId = $('loginId');
  const pwGroup = $('pwGroup');
  const signupGroup = $('signupGroup');
  const alertBox = $('loginAlert');
  alertBox.classList.add('hidden');

  if (role === 'admin') {
    $('tabAdmin').classList.add('active');
    inputLabel.innerText = 'Admin Email';
    loginId.value = ADMIN_EMAIL;
    loginId.type = 'email';
    pwGroup.classList.remove('hidden');
    signupGroup.classList.add('hidden');
  } else if (role === 'customer') {
    $('tabCustomer').classList.add('active');
    inputLabel.innerText = 'Mobile Number / Email';
    loginId.value = '';
    loginId.type = 'text';
    loginId.placeholder = 'मोबाइल नंबर दर्ज करें';
    pwGroup.classList.remove('hidden');
    signupGroup.classList.remove('hidden');
  } else if (role === 'worker') {
    $('tabWorker').classList.add('active');
    inputLabel.innerText = 'Worker Phone Number';
    loginId.value = '';
    loginId.type = 'tel';
    loginId.placeholder = 'अपना 10-अंकों का मोबाइल नंबर डालें';
    pwGroup.classList.add('hidden');
    signupGroup.classList.add('hidden');
  }
}

async function handleAuthSubmit(e) {
  e.preventDefault();
  const alertBox = $('loginAlert');
  alertBox.classList.add('hidden');
  
  const idVal = $('loginId').value.trim();
  const pwVal = $('loginPassword').value.trim();

  if (!idVal) {
    alertBox.innerText = 'कृपया Email या मोबाइल नंबर दर्ज करें।';
    alertBox.classList.remove('hidden');
    return;
  }

  if (currentRole === 'worker') {
    const { data: worker, error } = await db.from('profiles').select('*').eq('phone', idVal).eq('role', 'worker').single();
    if (error || !worker) {
      alertBox.innerText = 'यह मोबाइल नंबर कारीगर के रूप में पंजीकृत नहीं है। कृपया एडमिन से संपर्क करें।';
      alertBox.classList.remove('hidden');
      return;
    }
    currentUser = worker;
    showDashboard('worker');
    return;
  }

  let loginEmail = idVal;
  if (currentRole === 'customer' && !idVal.includes('@')) {
    loginEmail = `${idVal}@psconstructions.in`;
  }

  if (!pwVal) {
    alertBox.innerText = 'कृपया पासवर्ड दर्ज करें।';
    alertBox.classList.remove('hidden');
    return;
  }

  const { data, error } = await db.auth.signInWithPassword({
    email: loginEmail,
    password: pwVal
  });

  if (error) {
    alertBox.innerText = 'लॉगिन असफल: ' + error.message;
    alertBox.classList.remove('hidden');
    return;
  }

  await bootstrapUser(data.user);
}

async function bootstrapUser(authUser) {
  const { data: profile } = await db.from('profiles').select('*').eq('id', authUser.id).single();
  if (profile) {
    currentUser = profile;
    currentRole = profile.role;
  } else {
    currentUser = { id: authUser.id, email: authUser.email, role: currentRole, name: 'User' };
  }
  showDashboard(currentRole);
}

function showDashboard(role) {
  $('loginSection').classList.add('hidden');
  $('appSection').classList.remove('hidden');
  
  const badge = $('roleBadge');
  badge.className = `role-badge ${role}`;
  badge.innerText = role.toUpperCase();

  renderSidebar();
  updateNotificationBadge();
  openView(role === 'admin' ? 'overview' : (role === 'customer' ? 'my_profile' : 'worker_attendance'));
}

function renderSidebar() {
  const nav = $('sidebarNav');
  let menus = [];

  if (currentRole === 'admin') {
    menus = [
      { id: 'overview', icon: 'fa-chart-pie', label: 'Overview' },
      { id: 'enquiries', icon: 'fa-inbox', label: 'Enquiries & Approvals' },

function toggleMobileSidebar(forceState) {
  const sidebar = document.getElementById('sidebarNav');
  const overlay = document.getElementById('sidebarOverlay');
  if (!sidebar || !overlay) return;

  const isOpen = forceState !== undefined ? forceState : !sidebar.classList.contains('open');
  if (isOpen) {
    sidebar.classList.add('open');
    overlay.classList.add('active');
  } else {
    sidebar.classList.remove('open');
    overlay.classList.remove('active');
  }
}

async function openView(viewId) {
  toggleMobileSidebar(false);
  document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
  const btn = $(`btn-${viewId}`);
  if (btn) btn.classList.add('active');

  const main = $('mainContent');
  main.innerHTML = '<div style="text-align:center; padding:40px; color:var(--muted);"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><br>लोड हो रहा है...</div>';

  try {
    if (currentRole === 'admin') {
      if (viewId === 'overview') await renderAdminOverview(main);
      else if (viewId === 'enquiries') await renderAdminEnquiriesAndAttendance(main);
      else if (viewId === 'contracts' || viewId === 'projects') await renderAdminProjects(main);
      else if (viewId === 'daily_updates') await renderAdminDailyUpdates(main);
      else if (viewId === 'customers') await renderAdminCustomers(main);
      else if (viewId === 'workers') await renderAdminWorkers(main);
      else if (viewId === 'payments') await renderAdminPayments(main);
      else if (viewId === 'expenses') await renderAdminExpenses(main);
      else if (viewId === 'settings') await renderAdminSettings(main);
    } else if (currentRole === 'customer') {
      if (viewId === 'my_profile') await renderCustomerProfile(main);
      else if (viewId === 'my_projects' || viewId === 'my_contracts') await renderCustomerProjects(main);
      else if (viewId === 'my_enquiries') await renderCustomerEnquiryForm(main);
      else if (viewId === 'my_payments') await renderCustomerPayments(main);
    } else {
      if (viewId === 'worker_attendance') await renderWorkerAttendance(main);
      else if (viewId === 'worker_earnings') await renderWorkerEarnings(main);
      else if (viewId === 'worker_updates') await renderWorkerUpdates(main);
    }
  } catch (err) {
    main.innerHTML = `<div class="card" style="color:var(--danger);"><i class="fa-solid fa-circle-exclamation"></i> Error loading section: ${err.message}</div>`;
  }
}

function handleLogout() {

function parseContractDetails(c) {
  let rateType = 'lumpsum';
  let rateDetail = '';
  let scopeText = c?.scope || 'नींव खुदाई, दीवार चिनाई, RCC छत ढलाई एवं प्लास्टर कार्य';
  let notes = '';

  if (c?.scope && typeof c.scope === 'string') {
    const trimmed = c.scope.trim();
    if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
      try {
        const obj = JSON.parse(trimmed);
        rateType = obj.rate_type || 'lumpsum';
        rateDetail = obj.rate_detail || '';
        scopeText = obj.scope || scopeText;
        notes = obj.notes || '';
      } catch(e) {}
    }
  }

  const rateLabels = {
    'lumpsum': 'लम्प-सम तय राशि (Lump-Sum Amount)',
    'sqft': 'स्क्वेयर फीट दर अनुसार (Per Sq.Ft Rate)',
    'wage': 'दैनिक मजदूरी दर अनुसार (Daily Wage Basis)',
    'running_ft': 'रनिंग फीट दर अनुसार (Running Feet Rate)',
    'other': 'अन्य दर अनुसार (Custom Rate)'
  };

  return {
    rateType,
    rateTypeLabel: rateLabels[rateType] || rateLabels['lumpsum'],
    rateDetail,
    scopeText,
    notes
  };
}

                  <td><b>${safeStr(e.work_details)}</b><br><small style="color:var(--muted);">${safeStr(e.address)}</small></td>
                  <td>₹${Number(e.estimated_budget || 0).toLocaleString('en-IN')}</td>
                  <td><span class="btn-sm ${e.status === 'approved' ? 'btn-success' : 'btn-gold'}">${e.status}</span></td>

                        <button class="btn-sm btn-gold" onclick="approveEnquiry('${e.id}', '${e.customer_id}', '${escapeAttr(e.work_details)}', '${escapeAttr(e.address)}', ${e.estimated_budget || 0})"><i class="fa-solid fa-check"></i> Approve & Contract</button>

      </div>
    ` : `
      <div class="card">
        <div style="font-weight:700; margin-bottom:12px;">दैनिक कारीगर / लेबर हाजिरी अप्रूवल</div>

            </thead>

              ${attendances.length === 0 ? '<tr><td colspan="6" style="text-align:center;">कोई हाजिरी रिकॉर्ड नहीं है।</td></tr>' : ''}
              ${attendances.map(a => `
                <tr>
                  <td><b>${a.work_date}</b></td>
                  <td><b>${safeStr(a.worker?.name, 'Worker')}</b><br><small>${safeStr(a.worker?.phone, '-')}</small></td>
                  <td>₹${a.worker?.daily_wage || 0}/दिन</td>
                  <td>
                    ${a.face_image_url ? `<img src="${a.face_image_url}" style="width:40px; height:40px; border-radius:6px; object-fit:cover;">` : '<span style="color:var(--muted); font-size:11px;">No Photo</span>'}
                  </td>
                  <td><span class="btn-sm ${a.status === 'approved' ? 'btn-success' : (a.status === 'rejected' ? 'btn-danger' : 'btn-gold')}">${a.status}</span></td>
                  <td>
                    ${a.status === 'pending' ? `
                      <div class="btn-action-group">
                        <button class="btn-sm btn-success" onclick="approveAttendance('${a.id}')"><i class="fa-solid fa-check"></i> Approve</button>
                        <button class="btn-sm btn-danger" onclick="rejectAttendance('${a.id}')"><i class="fa-solid fa-xmark"></i> Reject</button>
                      </div>
                    ` : `<span>${a.status}</span>`}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `}
  `;
}

async function approveEnquiry(enqId, customerId, work, address, budget) {
  if (!confirm('क्या आप इस इन्क्वायरी को स्वीकृत करके नया प्रोजेक्ट और अनुबंध बनाना चाहते हैं?')) return;

  const { data: proj } = await getDB().from('projects').insert({
    customer_id: customerId,
    name: work.substring(0, 40),
    address: address,
    total_amount: budget || 0,
    status: 'planning',
    progress: 0
  }).select().single();

  await getDB().from('contracts').insert({
    project_id: proj.id,
    version: 1,
    status: 'amount_discussion',
    final_amount: budget || 0,
    scope: work,
    proposed_by: currentUser.id
  });

  await getDB().from('enquiries').update({ status: 'approved' }).eq('id', enqId);
  alert('इन्क्वायरी स्वीकृत! प्रोजेक्ट और कॉन्ट्रैक्ट तैयार हो गया है।');
  openView('projects');
}

async function deleteEnquiry(id) {
  if (!confirm('क्या आप इस इन्क्वायरी को हटाना चाहते हैं?')) return;
  await getDB().from('enquiries').delete().eq('id', id);
  openView('enquiries');
}

async function approveAttendance(attId) {
  await getDB().from('attendance').update({ status: 'approved', approved_by: currentUser.id, approved_at: new Date().toISOString() }).eq('id', attId);
  openView('enquiries');
}

async function rejectAttendance(attId) {
  await getDB().from('attendance').update({ status: 'rejected', approved_by: currentUser.id, approved_at: new Date().toISOString() }).eq('id', attId);
  openView('enquiries');
}

                  <td><span style="color:var(--danger); font-weight:700;">₹${remainAmt.toLocaleString('en-IN')}</span></td>

  if (!c) return;

  const modal = $('modalContainer');
  modal.classList.remove('hidden');
  modal.innerHTML = `
    <div class="modal-card" style="max-width:550px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid var(--border); padding-bottom:8px;">

        <button onclick="openFullAgreementModal('${contractId}')" style="border:0; background:transparent; font-size:26px; cursor:pointer; color:var(--muted); padding:2px 6px;">&times;</button>

      <form onsubmit="saveContractTerms(event, '${contractId}')">
        <div class="form-group">

          <select id="ectRateType" onchange="handleRateTypeChange(this.value)">
            <option value="lumpsum" ${parsed.rateType === 'lumpsum' ? 'selected' : ''}>लम्प-सम तय कुल राशि (Lump-Sum)</option>
            <option value="sqft" ${parsed.rateType === 'sqft' ? 'selected' : ''}>स्क्वेयर फीट दर (Per Sq.Ft Rate)</option>
            <option value="wage" ${parsed.rateType === 'wage' ? 'selected' : ''}>दैनिक मजदूरी दर (Daily Wage Basis)</option>
            <option value="running_ft" ${parsed.rateType === 'running_ft' ? 'selected' : ''}>रनिंग फीट दर (Running Feet Rate)</option>
            <option value="other" ${parsed.rateType === 'other' ? 'selected' : ''}>अन्य दर (Custom Rate)</option>
          </select>
        </div>

        <div class="form-group">
          <label>२. तय दर / मजदूरी का विवरण (Rate / Wage Details)</label>
          <input id="ectRateDetail" value="${escapeAttr(parsed.rateDetail)}" placeholder="उदा. ₹180 प्रति वर्ग फीट (छत नाप) या ₹750 मिस्त्री / ₹450 मजदूर">
        </div>

        <div class="form-group">
          <label>३. कुल तय अनुबंध राशि (Final Agreed Amount ₹)</label>
          <input id="ectAmount" type="number" value="${c.final_amount || 0}" required placeholder="उदा. 280000">
        </div>

        <div class="form-group">
          <label>४. कार्य का स्कोप / विवरण (Scope of Work)</label>
          <input id="ectScope" value="${escapeAttr(parsed.scopeText)}" placeholder="उदा. RCC ढलाई 3 कमरों की, चिनाई व प्लास्टर...">
        </div>

        <div class="form-group">
          <label>५. विशेष शर्तें एवं नोट्स (Contract Notes & Terms)</label>
          <textarea id="ectNotes" rows="3" placeholder="यहाँ कस्टमर या एडमिन कोई भी विशेष शर्त, मटेरियल की क्वालिटी (सीमेंट, सरिया), पानी-बिजली या भुगतान से जुड़ी बात लिख सकते हैं...">${escapeAttr(parsed.notes)}</textarea>
        </div>

        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
          <button type="button" class="btn-secondary" onclick="openFullAgreementModal('${contractId}')">रद्द करें</button>
          <button type="submit" class="btn-primary" style="width:auto;"><i class="fa-solid fa-check"></i> अनुबंध में सेव करें</button>
        </div>
      </form>
    </div>

function handleRateTypeChange(val) {
  const input = $('ectRateDetail');
  if (!input) return;
  if (val === 'sqft' && !input.value) input.value = '₹180 प्रति वर्ग फीट (छत नाप अनुसार)';
  else if (val === 'wage' && !input.value) input.value = '₹750 मिस्त्री / ₹450 मजदूर प्रतिदिन';
  else if (val === 'lumpsum' && !input.value) input.value = 'कुल लम्प-सम कार्य';
}

async function saveContractTerms(e, contractId) {
  e.preventDefault();
  const rateType = $('ectRateType').value;
  const rateDetail = $('ectRateDetail').value.trim();
  const finalAmount = Number($('ectAmount').value) || 0;
  const scopeText = $('ectScope').value.trim() || 'नींव खुदाई, दीवार चिनाई, RCC छत ढलाई एवं प्लास्टर कार्य';
  const notes = $('ectNotes').value.trim();

  const packedScope = JSON.stringify({
    rate_type: rateType,
    rate_detail: rateDetail,
    scope: scopeText,
    notes: notes
  });

  await getDB().from('contracts').update({
    final_amount: finalAmount,
    scope: packedScope,
    proposed_by: currentUser ? currentUser.id : null,
    admin_approved_at: null,
    customer_approved_at: null,
    status: 'amount_discussion'
  }).eq('id', contractId);

  const { data: c } = await getDB().from('contracts').select('project_id').eq('id', contractId).single();
  if (c?.project_id) {
    await getDB().from('projects').update({ total_amount: finalAmount }).eq('id', c.project_id);
  }

  alert('अनुबंध की दर, राशि और नोट्स अपडेट हो गए हैं! दोनों पक्षों को री-अप्रूव करना होगा।');
  openFullAgreementModal(contractId);
}

async function adminApproveContract(contractId) {
  if (!confirm('क्या आप इस अनुबंध को अपनी स्वीकृति (Admin Approval) देना चाहते हैं?')) return;
  const now = new Date().toISOString();
  const { data: c } = await getDB().from('contracts').select('*, project:project_id(*)').eq('id', contractId).single();
  const isFullyApproved = Boolean(c.customer_approved_at);

  await getDB().from('contracts').update({
    admin_approved_at: now,
    admin_approved_by: currentUser.id,
    status: isFullyApproved ? 'locked' : 'amount_discussion',
    locked_at: isFullyApproved ? now : null
  }).eq('id', contractId);

  if (isFullyApproved && c.project_id) {
    await getDB().from('projects').update({ status: 'active', total_amount: c.final_amount }).eq('id', c.project_id);
    alert('अनुबंध पूरी तरह लॉक हो गया है और प्रोजेक्ट शुरू हो चुका है! 🔒');
  } else {
    alert('एडमिन स्वीकृति दर्ज हो गई!');
  }

  $('modalContainer').classList.add('hidden');
  openView('projects');
}

async function approveCustomerContract(contractId) {
  if (!confirm('क्या आप इस अनुबंध को अपनी डिजिटल स्वीकृति देना चाहते हैं?')) return;
  const now = new Date().toISOString();
  const { data: c } = await getDB().from('contracts').select('*, project:project_id(*)').eq('id', contractId).single();
  const isFullyApproved = Boolean(c.admin_approved_at);

  await getDB().from('contracts').update({
    customer_approved_at: now,
    customer_approved_by: currentUser.id,
    status: isFullyApproved ? 'locked' : 'amount_discussion',
    locked_at: isFullyApproved ? now : null
  }).eq('id', contractId);

  if (isFullyApproved && c.project_id) {
    await getDB().from('projects').update({ status: 'active', total_amount: c.final_amount }).eq('id', c.project_id);
    alert('अनुबंध पूरी तरह स्वीकृत व लॉक हो गया है और प्रोजेक्ट शुरू हो चुका है! 🔒');
  } else {
    alert('आपकी डिजिटल स्वीकृति दर्ज हो गई है!');
  }

  $('modalContainer').classList.add('hidden');
  openView('my_projects');
}

function previewNewCustomerPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;

    $('acPhotoBase64').value = evt.target.result;
    $('acPhotoPreview').innerHTML = `<img src="${evt.target.result}" style="width:48px; height:48px; border-radius:50%; object-fit:cover; border:2px solid var(--accent);">`;

async function saveCustomerRecord(e) {
  e.preventDefault();
  const phone = $('acPhone').value.trim();
  const email = $('acEmail').value.trim() || `${phone}@psconstructions.in`;
  const name = $('acName').value.trim();
  const address = $('acAddress').value.trim();
  const pass = $('acPass').value.trim();
  const photoBase64 = $('acPhotoBase64')?.value || null;

  const { data: auth, error } = await getDB().auth.signUp({
    email: email,
    password: pass
  });

  if (error) return alert('त्रुटि: ' + error.message);

  await getDB().from('profiles').insert({
    id: auth.user.id,
    name: name,
    phone: phone,
    email: email,
    address: address,
    image_url: photoBase64,
    role: 'customer'
  });

  alert('ग्राहक सफलतापूर्वक पंजीकृत हुआ!');
  $('modalContainer').classList.add('hidden');
  openView('customers');
}

let workerRegStream = null;

async function startWorkerFaceCamera() {
  const video = $('awVideo');
  try {
    workerRegStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = workerRegStream;
    video.style.display = 'block';
    $('btnSnapWorkerFace').style.display = 'inline-flex';
  } catch(e) {
    alert('कैमरा शुरू करने में समस्या: ' + e.message);
  }
}

function snapWorkerFace() {
  const video = $('awVideo');
  const canvas = $('awCanvas');
  canvas.width = video.videoWidth || 320;
  canvas.height = video.videoHeight || 240;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const base64 = canvas.toDataURL('image/jpeg', 0.85);
  $('awFaceBase64').value = base64;
  $('awFacePreview').innerHTML = `<img src="${base64}" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid var(--accent);">`;

  if (workerRegStream) workerRegStream.getTracks().forEach(t => t.stop());
  video.style.display = 'none';
  $('btnSnapWorkerFace').style.display = 'none';
}

function handleWorkerFaceFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    $('awFaceBase64').value = evt.target.result;
    $('awFacePreview').innerHTML = `<img src="${evt.target.result}" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid var(--accent);">`;
  };
  reader.readAsDataURL(file);
}

async function recordWorkerPaymentSubmit(e, workerId, workerName, workerPhone, dailyWage) {
  e.preventDefault();
  await getDB().from('payments').insert({
    worker_id: workerId,
    direction: 'business_to_worker',
    amount: Number($('wpAmount').value),
    method: $('wpMethod').value,
    note: $('wpNote').value,
    created_by: currentUser.id,
    paid_at: new Date().toISOString()
  });

  alert('भुगतान रिकॉर्ड दर्ज हो गया!');
  openWorkerPaymentModal(workerId, workerName, workerPhone, dailyWage);
}

async function deleteWorkerPayment(paymentId, workerId, workerName, workerPhone, dailyWage) {
  if (!confirm('क्या आप इस भुगतान रिकॉर्ड को हटाना चाहते हैं?')) return;
  await getDB().from('payments').delete().eq('id', paymentId);
  openWorkerPaymentModal(workerId, workerName, workerPhone, dailyWage);
}

async function renderAdminPayments(container) {

  let totalPaidOut = 0;
  (payments || []).forEach(p => {

    else totalPaidOut += Number(p.amount || 0);
  });

  container.innerHTML = `
    <div class="page-head">
      <h1>पेमेंट एवं लेनदेन रिकॉर्ड (Payments & Ledger)</h1>
      <button class="btn-primary" style="width:auto;" onclick="openRecordDirectPaymentModal()"><i class="fa-solid fa-plus-circle"></i> नया लेनदेन दर्ज करें</button>
    </div>

    <!-- Quick Ledger Stats -->
    <div class="stats-grid" style="grid-template-columns: repeat(2, 1fr); margin-bottom:20px;">
      <div class="stat-card" style="padding:16px;">
        <div>
          <h4>कुल प्राप्त राशि (Inflow - Customers)</h4>
          <div class="val" style="color:var(--success); font-size:22px;">₹${totalReceived.toLocaleString('en-IN')}</div>
        </div>
        <div class="icon-box" style="background:#dcfce7; color:#16a34a;"><i class="fa-solid fa-arrow-down"></i></div>
      </div>
      <div class="stat-card" style="padding:16px;">
        <div>
          <h4>कुल दिया गया भुगतान (Outflow - Workers/Expenses)</h4>
          <div class="val" style="color:var(--danger); font-size:22px;">₹${totalPaidOut.toLocaleString('en-IN')}</div>
        </div>
        <div class="icon-box" style="background:#fee2e2; color:#dc2626;"><i class="fa-solid fa-arrow-up"></i></div>
      </div>
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>दिनांक</th>
              <th>पार्टी / नाम</th>
              <th>प्रोजेक्ट</th>
              <th>प्रकार</th>
              <th>माध्यम</th>
              <th>राशि (₹)</th>
              <th>Ref / UTR</th>
              <th>Note / विवरण</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${(payments || []).length === 0 ? '<tr><td colspan="9" style="text-align:center; padding:24px;">कोई पेमेंट रिकॉर्ड नहीं है।</td></tr>' : ''}
            ${(payments || []).map(p => {
              const partyName = safeStr(p.customer?.name || p.worker?.name, 'Direct Party');
              const partyPhone = p.customer?.phone || p.worker?.phone || '';
              const isInflow = p.direction === 'customer_to_business';

              return `
                <tr>
                  <td>${new Date(p.paid_at || p.created_at).toLocaleDateString('en-IN')}</td>
                  <td>
                    <b>${partyName}</b>
                    ${partyPhone ? `<br><small style="color:var(--muted);">${partyPhone}</small>` : ''}
                  </td>
                  <td>${safeStr(p.project?.name, '-')}</td>
                  <td>
                    <span class="btn-sm ${isInflow ? 'btn-success' : 'btn-danger'}">
                      ${isInflow ? 'प्राप्त (In)' : 'भुगतान (Out)'}
                    </span>
                  </td>
                  <td><span class="btn-sm btn-edit">${safeStr(p.method, 'UPI')}</span></td>
                  <td>
                    <b style="font-size:15px; color:${isInflow ? 'var(--success)' : 'var(--danger)'};">

                  <td>${safeStr(p.reference, '-')}</td>

                      </button>
                    </div>

                </tr>
              `;

        </table>
      </div>
    </div>
  `;
}

  const modal = $('modalContainer');
  modal.classList.remove('hidden');
  modal.innerHTML = `
    <div class="modal-card" style="max-width:520px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--border); padding-bottom:8px;">
        <h3 style="font-size:18px; color:var(--primary);"><i class="fa-solid fa-pen-to-square" style="color:var(--accent);"></i> पेमेंट रिकॉर्ड एडिट करें</h3>
        <button onclick="$('modalContainer').classList.add('hidden')" style="border:0; background:transparent; font-size:26px; cursor:pointer; color:var(--muted); padding:2px 6px;">&times;</button>

        <div style="font-size:15px; font-weight:800; color:var(--primary);">${partyName}</div>
      </div>

      <form onsubmit="updatePaymentRecordSubmit(event, '${paymentId}')">
        <div class="form-group">
          <label>राशि (Amount ₹)</label>
          <input id="epayAmount" type="number" value="${p.amount || 0}" required placeholder="50000">
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div class="form-group">
            <label>माध्यम (Payment Method)</label>
            <select id="epayMethod">
              <option value="UPI" ${p.method === 'UPI' ? 'selected' : ''}>UPI (GPay / PhonePe)</option>
              <option value="Bank" ${p.method === 'Bank' ? 'selected' : ''}>Bank Transfer (NEFT/IMPS)</option>
              <option value="Cash" ${p.method === 'Cash' ? 'selected' : ''}>Cash (नकद)</option>
              <option value="Cheque" ${p.method === 'Cheque' ? 'selected' : ''}>Cheque</option>
            </select>
          </div>

          <div class="form-group">
            <label>लेनदेन प्रकार (Direction)</label>
            <select id="epayDir">
              <option value="customer_to_business" ${p.direction === 'customer_to_business' ? 'selected' : ''}>प्राप्त राशि (Inflow - Customer)</option>
              <option value="business_to_worker" ${p.direction === 'business_to_worker' ? 'selected' : ''}>भुगतान (Outflow - Worker)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>UTR / Transaction Reference</label>
          <input id="epayRef" value="${escapeAttr(p.reference || '')}" placeholder="12 अंकों का UTR या रसीद नंबर">
        </div>

        <div class="form-group">
          <label>Note / विवरण</label>
          <input id="epayNote" value="${escapeAttr(p.note || '')}" placeholder="उदा. दूसरी किश्त / लेंटेल स्तर का भुगतान">
        </div>

        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:16px; border-top:1px solid var(--border); padding-top:12px;">
          <button type="button" class="btn-secondary" onclick="$('modalContainer').classList.add('hidden')">रद्द करें</button>
          <button type="submit" class="btn-primary" style="width:auto;"><i class="fa-solid fa-check"></i> अपडेट सेव करें</button>
        </div>
      </form>
    </div>
  `;
}

async function updatePaymentRecordSubmit(e, paymentId) {
  e.preventDefault();
  await getDB().from('payments').update({
    amount: Number($('epayAmount').value),
    method: $('epayMethod').value,
    direction: $('epayDir').value,
    reference: $('epayRef').value.trim() || null,
    note: $('epayNote').value.trim() || null
  }).eq('id', paymentId);

  alert('पेमेंट रिकॉर्ड सफलतापूर्वक अपडेट हो गया!');
  $('modalContainer').classList.add('hidden');
  openView('payments');
}

async function deletePayment(id) {
  if (!confirm('क्या आप इस पेमेंट रिकॉर्ड को हटाना चाहते हैं?')) return;
  await getDB().from('payments').delete().eq('id', id);
  alert('पेमेंट रिकॉर्ड हटा दिया गया!');
  openView('payments');
}

    const modal = $('modalContainer');
    modal.classList.remove('hidden');
    modal.innerHTML = `
      <div class="modal-card" style="max-width:520px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--border); padding-bottom:8px;">
          <h3 style="font-size:18px; color:var(--primary);"><i class="fa-solid fa-plus-circle" style="color:var(--accent);"></i> नया लेनदेन रिकॉर्ड दर्ज करें</h3>
          <button onclick="$('modalContainer').classList.add('hidden')" style="border:0; background:transparent; font-size:26px; cursor:pointer; color:var(--muted); padding:2px 6px;">&times;</button>

              <option value="business_to_worker">कारीगर/लेबर को भुगतान (Outflow to Worker)</option>
            </select>
          </div>

          <div class="form-group" id="custSelectGroup">
            <label>ग्राहक चुनें</label>
            <select id="rdpCustId">
              <option value="">-- ग्राहक चुनें --</option>
              ${customers.map(c => `<option value="${c.id}">${c.name} (${c.phone || '-'})</option>`).join('')}
            </select>
          </div>

          <div class="form-group hidden" id="workerSelectGroup">
            <label>कारीगर/लेबर चुनें</label>
            <select id="rdpWorkerId">
              <option value="">-- कारीगर चुनें --</option>
              ${workers.map(w => `<option value="${w.id}">${w.name} (${w.phone || '-'})</option>`).join('')}
            </select>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="form-group">
              <label>राशि (Amount ₹)</label>
              <input id="rdpAmount" type="number" required placeholder="50000">
            </div>
            <div class="form-group">
              <label>माध्यम (Method)</label>
              <select id="rdpMethod">
                <option value="UPI">UPI (GPay / PhonePe)</option>
                <option value="Bank">Bank Transfer</option>
                <option value="Cash">Cash (नकद)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>UTR / Transaction Ref</label>
            <input id="rdpRef" placeholder="12 अंकों का UTR या रसीद नंबर">
          </div>

          <div class="form-group">
            <label>Note / विवरण</label>
            <input id="rdpNote" placeholder="उदा. छत ढलाई किश्त">
          </div>

          <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:16px; border-top:1px solid var(--border); padding-top:12px;">
            <button type="button" class="btn-secondary" onclick="$('modalContainer').classList.add('hidden')">रद्द करें</button>
            <button type="submit" class="btn-primary" style="width:auto;"><i class="fa-solid fa-check"></i> रिकॉर्ड सेव करें</button>
          </div>
        </form>
      </div>
    `;
  });
}

function togglePartySelect(dir) {
  if (dir === 'customer_to_business') {
    $('custSelectGroup')?.classList.remove('hidden');
    $('workerSelectGroup')?.classList.add('hidden');
  } else {
    $('custSelectGroup')?.classList.add('hidden');
    $('workerSelectGroup')?.classList.remove('hidden');
  }
}

async function saveDirectPaymentRecordSubmit(e) {
  e.preventDefault();
  const dir = $('rdpDir').value;
  const custId = dir === 'customer_to_business' ? $('rdpCustId').value : null;
  const workerId = dir === 'business_to_worker' ? $('rdpWorkerId').value : null;

  await getDB().from('payments').insert({
    customer_id: custId || null,
    worker_id: workerId || null,
    direction: dir,
    amount: Number($('rdpAmount').value),
    method: $('rdpMethod').value,
    reference: $('rdpRef').value.trim() || null,
    note: $('rdpNote').value.trim() || null,
    created_by: currentUser.id,
    paid_at: new Date().toISOString()
  });

  alert('नया लेनदेन रिकॉर्ड दर्ज हो गया!');
  $('modalContainer').classList.add('hidden');
  openView('payments');
}

function previewCustomerProfilePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    $('mpPhotoBase64').value = evt.target.result;
    const img = $('mpAvatarImg');
    if (img) {
      img.src = evt.target.result;
    } else {
      const ph = $('mpAvatarPlaceholder');
      if (ph) ph.outerHTML = `<img src="${evt.target.result}" id="mpAvatarImg" style="width:100px; height:100px; border-radius:50%; object-fit:cover; border:3px solid var(--accent);">`;
    }
  };
  reader.readAsDataURL(file);
}

async function updateMyProfile(e) {
  e.preventDefault();
  const name = $('mpName').value.trim();
  const phone = $('mpPhone').value.trim();
  const email = $('mpEmail').value.trim();
  const address = $('mpAddress').value.trim();
  const photoBase64 = $('mpPhotoBase64').value;
  const newPass = $('mpNewPass').value.trim();

  const updatePayload = {
    name: name,
    phone: phone,
    email: email,
    address: address
  };
  if (photoBase64) {
    updatePayload.image_url = photoBase64;
  }

  await getDB().from('profiles').update(updatePayload).eq('id', currentUser.id);

  if (newPass) {
    if (newPass.length < 6) {
      alert('पासवर्ड कम से कम 6 अक्षरों का होना चाहिए।');
      return;
    }
    const { error: passErr } = await getDB().auth.updateUser({ password: newPass });
    if (passErr) {
      alert('पासवर्ड अपडेट में समस्या: ' + passErr.message);
    } else {
      alert('पासवर्ड भी सफलतापूर्वक बदल गया!');
    }
  }

  currentUser.name = name;
  currentUser.phone = phone;
  currentUser.email = email;
  currentUser.address = address;
  if (photoBase64) currentUser.image_url = photoBase64;

  alert('आपकी प्रोफ़ाइल सफलतापूर्वक अपडेट हो गई है! ✅');
  openView('my_profile');
}

function setPresetPayAmount(amt, upiId) {
  const input = $('custCustomPayAmt');
  if (input) {
    input.value = amt;
    updateCustomUpiPayLinks(upiId);
  }
}

function updateCustomUpiPayLinks(upiId) {
  const input = $('custCustomPayAmt');
  const btn = $('btnCustUpiPay');
  if (!btn) return;
  const val = input ? input.value.trim() : '';

  if (val && Number(val) > 0) {
    btn.href = `upi://pay?pa=${upiId}&pn=Prakash%20Swami%20Constructions&am=${val}&cu=INR`;
    btn.innerHTML = `<i class="fa-solid fa-bolt"></i> ⚡ Pay ₹${Number(val).toLocaleString('en-IN')} via UPI`;
  } else {
    // Open amount link so user can enter any amount inside their UPI app
    btn.href = `upi://pay?pa=${upiId}&pn=Prakash%20Swami%20Constructions&cu=INR`;
    btn.innerHTML = `<i class="fa-solid fa-bolt"></i> ⚡ PhonePe / GPay / Paytm से Pay करें (मनचाही राशि)`;
  }
}

async function handleCustomerSignup(e) {
  e.preventDefault();

  const email = `${phone}@psconstructions.in`;
  const name = $('suName').value.trim();
  const address = $('suAddress').value.trim();

  });

let attStream = null;
let capturedFaceBase64 = null;

async function startAttendanceCamera() {
  const video = $('attVideo');
  try {
    attStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = attStream;
    video.style.display = 'block';
    $('btnStartCam').style.display = 'none';
    $('btnCapture').style.display = 'inline-flex';
  } catch (err) {
    alert('कैमरा शुरू करने में समस्या: ' + err.message);
  }
}

async function captureAndVerifyFaceAttendance() {
  const video = $('attVideo');
  const canvas = $('attCanvas');
  canvas.width = video.videoWidth || 320;
  canvas.height = video.videoHeight || 240;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  capturedFaceBase64 = canvas.toDataURL('image/jpeg', 0.8);
  $('attImgPreview').innerHTML = `<img src="${capturedFaceBase64}" style="width:100%; border-radius:8px;">`;
  
  if (attStream) {
    attStream.getTracks().forEach(t => t.stop());
  }
  video.style.display = 'none';
  $('btnCapture').style.display = 'none';

  const registeredFace = currentUser?.image_url;
  if (registeredFace) {
    const isMatch = await compareFaceFeatures(registeredFace, capturedFaceBase64);
    if (!isMatch) {
      if (!confirm('चेतावनी: स्कैन किया गया चेहरा रजिस्टर्ड फोटो से मेल नहीं खा रहा है। क्या आप फिर भी हाजिरी अप्रूवल के लिए भेजना चाहते हैं?')) {
        $('attImgPreview').innerHTML = '';
        $('btnStartCam').style.display = 'inline-flex';
        return;
      }
    }
  }

  const today = new Date().toISOString().split('T')[0];
  await getDB().from('attendance').insert({
    worker_id: currentUser?.id,
    work_date: today,
    face_image_url: capturedFaceBase64,
    scanned_at: new Date().toISOString(),
    status: 'pending'
  });

  alert('फेस स्कैन पूरा हुआ! आपकी हाजिरी एडमिन अप्रूवल के लिए भेज दी गई है।');
  openView('worker_attendance');
}

async function compareFaceFeatures(img1Base64, img2Base64) {
  try {
    const img1 = await loadImageElement(img1Base64);
    const img2 = await loadImageElement(img2Base64);
    const pixels1 = extractGrayscalePixels(img1);
    const pixels2 = extractGrayscalePixels(img2);
    
    let diff = 0;
    for (let i = 0; i < pixels1.length; i++) {
      diff += Math.abs(pixels1[i] - pixels2[i]);
    }
    const avgDiff = diff / pixels1.length;
    return avgDiff < 95;
  } catch(e) {
    return true;
  }
}

function loadImageElement(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'Anonymous';
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function extractGrayscalePixels(img) {
  const c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, 32, 32);
  const data = ctx.getImageData(0, 0, 32, 32).data;
  const gray = new Uint8Array(32 * 32);
  for (let i = 0; i < 32 * 32; i++) {
    gray[i] = (data[i * 4] + data[i * 4 + 1] + data[i * 4 + 2]) / 3;
  }
  return gray;
}

async function renderWorkerEarnings(container) {
  const [attRes, payRes] = await Promise.all([
    getDB().from('attendance').select('*').eq('worker_id', currentUser ? currentUser.id : '').eq('status', 'approved'),
    getDB().from('payments').select('*').eq('worker_id', currentUser ? currentUser.id : '').eq('direction', 'business_to_worker')
  ]);

  const dailyWage = Number(currentUser?.daily_wage || 0);
  const totalDays = (attRes.data || []).length;
  const totalEarned = totalDays * dailyWage;

  const pendingPay = totalEarned - totalReceived;

  container.innerHTML = `
    <div class="page-head">
      <h1>मेरी कमाई व मजदूरी हिसाब</h1>
    </div>
    <div class="stats-grid">

          <div class="val">${totalDays} दिन <small style="font-size:12px; color:var(--muted);">(₹${dailyWage}/दिन)</small></div>
        </div>
        <div class="icon-box" style="background:#e0f2fe; color:#0284c7;"><i class="fa-solid fa-calendar-check"></i></div>
      </div>
      <div class="stat-card">
        <div>
          <h4>प्राप्त मजदूरी</h4>
          <div class="val" style="color:var(--success);">₹${totalReceived.toLocaleString('en-IN')}</div>
        </div>
        <div class="icon-box" style="background:#dcfce7; color:#16a34a;"><i class="fa-solid fa-wallet"></i></div>
      </div>
      <div class="stat-card">
        <div>
          <h4>बकाया मजदूरी</h4>
          <div class="val" style="color:var(--danger);">₹${pendingPay.toLocaleString('en-IN')}</div>

  container.innerHTML = `

    </div>

          <div id="wuPhotoPreview" style="margin-top:10px;"></div>
        </div>
        <button type="submit" class="btn-primary" style="width:auto;"><i class="fa-solid fa-upload"></i> फोटो अपलोड करें</button>
      </form>

function previewWorkerUpdateImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    $('wuPhotoBase64').value = evt.target.result;
    $('wuPhotoPreview').innerHTML = `<img src="${evt.target.result}" style="width:100%; max-height:200px; object-fit:cover; border-radius:8px;">`;
  };
  reader.readAsDataURL(file);
}

async function saveWorkerSiteUpdate(e) {
  e.preventDefault();
  await getDB().from('daily_updates').insert({
    description: $('wuDesc').value,
    image_url: $('wuPhotoBase64').value,
    created_by: currentUser?.id
  });
  alert('कार्य फोटो सफलतापूर्वक अपलोड हो गई!');
  $('wuDesc').value = '';
  $('wuPhotoPreview').innerHTML = '';
}
