<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prakash Swami Constructions — Dashboard</title>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0b1220;
      --accent: #e65100;
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --gold: #d7a43b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    
    /* Login Page with 3 Prakash Swami Photos */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #070d18 100%);
      padding: 24px 16px;
      position: relative;
    }
    .login-side-banner {
      width: 270px;
      height: 530px;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(215, 164, 59, 0.35);
      box-shadow: 0 20px 45px rgba(0,0,0,0.5);
      position: relative;
      background: #081325;
      flex-shrink: 0;
      transition: transform 0.3s, border-color 0.3s;
    }
    .login-side-banner:hover {
      transform: translateY(-4px);
      border-color: #d7a43b;
    }
    .login-side-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .login-side-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(11,18,32,0.96) 0%, rgba(11,18,32,0.7) 70%, transparent 100%);
      padding: 20px 14px 14px;
      color: #fff;
      text-align: center;
    }
    .login-side-caption h4 {
      font-size: 14.5px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 2px;
    }
    .login-side-caption p {
      font-size: 12px;
      color: #d7a43b;
      font-weight: 700;
    }
    @media(max-width: 960px) {
      .login-side-banner { display: none; }
    }
    .login-card { width: min(450px, 100%); background: var(--card); border-radius: 20px; padding: 32px 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    .brand-header { text-align: center; margin-bottom: 20px; }
    .brand-header h2 { color: var(--primary); font-size: 22px; font-weight: 800; }
    .brand-header p { color: var(--muted); font-size: 13px; margin-top: 2px; }
    
    .role-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #e2e8f0; padding: 4px; border-radius: 12px; margin-bottom: 20px; }
    .role-tabs button { padding: 10px 4px; border: 0; background: transparent; font-weight: 700; font-size: 13px; border-radius: 8px; cursor: pointer; color: var(--muted); transition: 0.2s; }
    .role-tabs button.active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--primary); }
    
    .btn-primary { width: 100%; padding: 13px; background: var(--primary); color: #fff; border: 0; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    .btn-primary:hover { opacity: 0.95; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { padding: 8px 14px; background: var(--border); color: var(--text); border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
    
    /* Action Buttons */
    .btn-action-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 6px; border: 0; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
    .btn-success { background: #dcfce7; color: #15803d; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .btn-warning { background: #fef3c7; color: #b45309; }
    .btn-edit { background: #e0e7ff; color: #4338ca; }
    .btn-gold { background: #fef08a; color: #854d0e; font-weight: 700; border: 1px solid #fde047; }
    .btn-check { background: #0b1220; color: #fff; font-weight: 700; }
    
    .alert-box { padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; line-height: 1.5; }
    .alert-error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .alert-info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .hidden { display: none !important; }

    /* Dashboard Layout */
    .app-container { display: flex; flex-direction: column; min-height: 100vh; }
    .app-header { height: 64px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; z-index: 40; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-title { font-size: 16px; font-weight: 800; color: var(--primary); }
    .role-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .role-badge.admin { background: #fee2e2; color: var(--danger); }
    .role-badge.customer { background: #e0e7ff; color: #4338ca; }
    .role-badge.worker { background: #fef3c7; color: var(--warning); }
    
    .header-right { display: flex; align-items: center; gap: 12px; }
    .notif-btn { position: relative; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: #fff; display: grid; place-items: center; cursor: pointer; color: var(--text); }
    .notif-badge { position: absolute; top: -4px; right: -4px; background: var(--danger); color: #fff; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; }

    .app-body { display: grid; grid-template-columns: 240px 1fr; flex: 1; }
    .app-sidebar { background: var(--primary); color: #fff; padding: 16px 10px; display: flex; flex-direction: column; gap: 4px; min-height: calc(100vh - 64px); }
    .sidebar-btn { width: 100%; padding: 11px 14px; border: 0; background: transparent; color: #94a3b8; border-radius: 10px; text-align: left; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
    .sidebar-btn:hover, .sidebar-btn.active { background: rgba(255,255,255,0.1); color: #fff; }
    .sidebar-btn i { width: 18px; font-size: 15px; }

    .app-main { padding: 24px; max-width: 1300px; width: 100%; margin: 0 auto; }
    .page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .page-head h1 { font-size: 22px; font-weight: 800; color: var(--primary); }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card { background: #fff; padding: 18px; border-radius: 14px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .stat-card h4 { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .stat-card .val { font-size: 24px; font-weight: 800; color: var(--primary); margin-top: 4px; }
    .stat-card .icon-box { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; }

    /* Cards & Tables */
    .card { background: #fff; border-radius: 16px; border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; }
    .table-container { width: 100%; overflow-x: auto; background: #fff; border-radius: 14px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background: #f8fafc; padding: 12px 16px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--border); }
    td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    
    /* Progress Bar */
    .progress-bar-bg { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .progress-bar-fill { height: 100%; background: var(--success); border-radius: 4px; }

    /* Note display box */
    .note-box { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: #f8fafc; padding: 6px 10px; border-radius: 8px; border: 1px dashed #cbd5e1; max-width: 220px; font-size: 12px; line-height: 1.4; }
    .note-text { flex: 1; overflow: hidden; text-overflow: ellipsis; }

    /* Legal Contract Agreement Document Box */
    .contract-doc { background: #fff; border: 2px solid #334155; border-radius: 16px; padding: 28px; margin-top: 14px; position: relative; box-shadow: 0 6px 18px rgba(0,0,0,0.06); font-size: 13px; line-height: 1.6; color: #1e293b; }
    .contract-header { border-bottom: 2px double #0b1220; padding-bottom: 14px; margin-bottom: 16px; text-align: center; }
    .contract-header h2 { font-size: 20px; font-weight: 800; color: var(--primary); text-transform: uppercase; }
    .contract-header h3 { font-size: 15px; font-weight: 700; color: #b45309; margin-top: 4px; }
    .contract-header p { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .contract-section { margin-bottom: 18px; }
    .contract-section h4 { color: var(--primary); border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; margin-bottom: 8px; font-size: 14px; font-weight: 800; }
    .milestone-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    .milestone-table th { background: #f1f5f9; padding: 8px 10px; border: 1px solid #cbd5e1; }
    .milestone-table td { padding: 8px 10px; border: 1px solid #cbd5e1; }
    .sign-box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; border-top: 2px solid #cbd5e1; padding-top: 16px; }
    .sign-card { background: #f8fafc; padding: 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 12px; }

    /* Sub-Tabs */
    .sub-tabs { display: flex; gap: 8px; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .sub-tab-btn { padding: 8px 16px; border-radius: 8px; border: 0; background: #e2e8f0; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--muted); }
    .sub-tab-btn.active { background: var(--primary); color: #fff; }

    /* Thumbnails & Face Comparison */
    .avatar-thumb { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #e2e8f0; cursor: pointer; transition: 0.2s; }
    .avatar-thumb:hover { transform: scale(1.1); border-color: var(--accent); }

    .face-compare-container { display: inline-flex; align-items: center; gap: 8px; }
    .face-compare-box { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
    .face-compare-box img, .table-container td img.avatar-thumb { max-width: 44px !important; max-height: 44px !important; width: 44px !important; height: 44px !important; border-radius: 8px !important; object-fit: cover !important; border: 1.5px solid #cbd5e1 !important; cursor: pointer; display: block; }
    .face-compare-box span { font-size: 10px; color: var(--muted); font-weight: 600; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: grid; place-items: center; z-index: 1000; padding: 16px; }
    .modal-card { width: min(750px, 100%); background: #fff; border-radius: 18px; padding: 24px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }

    /* Rate Options Selection Cards in Modal */
    .rate-option-card {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #f8fafc;
      margin-bottom: 10px;
    }
    .rate-option-card:hover {
      border-color: var(--gold);
      background: #fff;
    }
    .rate-option-card.selected {
      border-color: #0284c7;
      background: #eff6ff;
      box-shadow: 0 4px 12px rgba(2,132,199,0.15);
    }
    .rate-option-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    /* Mobile Slide-in Drawer Sidebar */
    .mobile-menu-toggle {
      display: none;
      background: transparent;
      border: 0;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      margin-right: 6px;
    }
    .mobile-menu-toggle:hover { background: #f1f5f9; }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(11, 18, 32, 0.65);
      backdrop-filter: blur(3px);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    .sidebar-mobile-header {
      display: none;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 12px;
    }

    @media(max-width: 840px) {
      .mobile-menu-toggle { display: inline-flex; align-items: center; justify-content: center; }
      .sidebar-mobile-header { display: flex; }
      .app-body { display: block; }
      .app-sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 280px;
        height: 100vh;
        z-index: 1000;
        transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 6px 0 25px rgba(0,0,0,0.4);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        padding: 16px 12px;
      }
      .app-sidebar.open {
        transform: translateX(0);
      }
      .sidebar-btn {
        flex-direction: row;
        align-items: center;
        text-align: left;
        font-size: 14px;
        padding: 12px 16px;
        gap: 12px;
        white-space: normal;
      }
      .sidebar-btn i { width: 20px; font-size: 16px; }
      .sign-box-grid { grid-template-columns: 1fr; }
      .app-main { padding: 16px; }
      .app-header { padding: 0 14px; }
    }
  </style>
</head>
<body>

<!-- 1. LOGIN SCREEN WITH 3 PRAKASH SWAMI PHOTOS -->
<div id="loginSection" class="login-wrapper">
  
  <!-- Left Side Photo Frame: Prakash Swami Photo 1 -->
  <div class="login-side-banner">

      <h4>Prakash Swami Constructions</h4>

</div>

<!-- 2. MAIN DASHBOARD APP -->
<div id="appSection" class="app-container hidden">
  <header class="app-header">
    <div class="header-left">
      <button class="mobile-menu-toggle" onclick="toggleMobileSidebar()" title="Menu">
        <i class="fa-solid fa-bars"></i>
      </button>
      <i class="fa-solid fa-building" style="color:var(--accent); font-size:20px;"></i>
      <span class="header-title">Prakash Swami</span>

  <!-- Sidebar Overlay for Phone -->

<!-- Reusable Modal Container -->
<div id="modalContainer" class="modal-overlay hidden"></div>

<script>
// --- SUPABASE CONFIGURATION ---
const SUPABASE_URL = 'https://aamstyeeewncmgqdxpoh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fOzZvfiio6HSaEgplYUgOA_lWy1tbVe';
function getDB() { return db; }
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const ADMIN_EMAIL = 'satpalswami22742@gmail.com';

let currentRole = 'admin';
let currentUser = null;
let activeEnqTab = 'customer_enq';

const $ = id => document.getElementById(id);

// Safe String Utilities
function safeStr(val, fallback = '') {
  if (val === null || val === undefined) return fallback;
  return String(val);
}

function escapeAttr(val) {
  if (val === null || val === undefined) return '';
  return String(val)
    .split("'").join("&#39;")
    .split('"').join("&quot;");
}

// UPI ID Generator Helper (@axl format)
function getUpiIdFromPhone(phone) {
  if (!phone) return '9785438345@axl';
  const clean = String(phone).replace(/[^0-9]/g, '');
  if (clean.length >= 10) return `${clean.slice(-10)}@axl`;
  return `${phone}@axl`;
}

// Global modal background click to close
window.addEventListener('DOMContentLoaded', () => {
  const mc = document.getElementById('modalContainer');
  if (mc) {
    mc.addEventListener('click', (e) => {
      if (e.target === mc) mc.classList.add('hidden');
    });
  }
});

// --- GLOBAL LOGOUT FUNCTION ---
function handleLogout() {
  if (db) {
    try { db.auth.signOut(); } catch(e) {}
  }
  currentUser = null;
  sessionStorage.removeItem('ps_worker_session');
  sessionStorage.removeItem('ps_notifs_dismissed');
  
  $('appSection').classList.add('hidden');
  $('loginSection').classList.remove('hidden');
  selectRole('admin');
}

// --- INITIALIZATION ---
window.addEventListener('DOMContentLoaded', async () => {
  const hash = window.location.hash.replace('#', '');
  if (['admin', 'customer', 'worker'].includes(hash)) {
    selectRole(hash);
  } else {
    selectRole('admin');
  }

  // Restore worker session if present
  const workerSession = sessionStorage.getItem('ps_worker_session');
  if (workerSession && window.location.hash === '#worker') {
    try {
      currentUser = JSON.parse(workerSession);
      currentRole = 'worker';
      launchDashboard();
      return;
    } catch(e) {}
  }
  
  if (db) {
    try {
      const { data: { session } } = await db.auth.getSession();
      if (session?.user) {
        await loadUserProfile(session.user);
      }
    } catch(e) {}
  }
});

function selectRole(role) {
  currentRole = role;
  const alertBox = $('loginAlert');
  if (alertBox) alertBox.classList.add('hidden');
  
  document.querySelectorAll('.role-tabs button').forEach(b => b.classList.remove('active'));
  if (role === 'admin' && $('tabAdmin')) $('tabAdmin').classList.add('active');
  if (role === 'customer' && $('tabCustomer')) $('tabCustomer').classList.add('active');
  if (role === 'worker' && $('tabWorker')) $('tabWorker').classList.add('active');

  const isWorker = (role === 'worker');
  const isAdmin = (role === 'admin');

  if ($('inputLabel')) $('inputLabel').textContent = isWorker ? 'मोबाइल नंबर (Worker Phone)' : (isAdmin ? 'Admin Email' : 'मोबाइल नंबर या Email (Customer Mobile/Email)');
  if ($('loginId')) {
    $('loginId').type = 'text';
    $('loginId').value = isAdmin ? ADMIN_EMAIL : '';
    $('loginId').placeholder = isWorker ? 'अपना 10-अंकों का मोबाइल नंबर डालें' : (isAdmin ? ADMIN_EMAIL : 'मोबाइल नंबर या Email दर्ज करें');
  }

  if ($('pwGroup')) $('pwGroup').classList.toggle('hidden', isWorker);
  if ($('signupGroup')) $('signupGroup').classList.toggle('hidden', role !== 'customer');
}

async function handleAuthSubmit(e) {
  e.preventDefault();
  const alertBox = $('loginAlert');
  if (alertBox) alertBox.classList.add('hidden');
  
  const idVal = $('loginId') ? $('loginId').value.trim() : '';
  const passVal = $('loginPassword') ? $('loginPassword').value.trim() : '';

  if (!db) return showLoginError('Supabase Database से कनेक्शन नहीं बन सका। कृपया इंटरनेट जांचें।');
  if (!idVal) return showLoginError('कृपया आवश्यक जानकारी (Email या मोबाइल नंबर) दर्ज करें।');

  const btn = $('loginSubmitBtn');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';
  }

  try {
    // 1. WORKER LOGIN (By Registered Phone Number - No Password)
    if (currentRole === 'worker') {
      const cleanPhone = idVal.replace(/[^0-9]/g, '');
      const { data: worker, error } = await db.from('profiles')
        .select('*')
        .eq('role', 'worker')
        .or(`phone.eq.${idVal},phone.eq.${cleanPhone}`)
        .maybeSingle();

      if (error) throw error;
      if (!worker) return showLoginError('यह मोबाइल नंबर किसी पंजीकृत कारीगर/लेबर से मेल नहीं खाता। एडमिन से संपर्क करें।');

      currentUser = worker;
      sessionStorage.setItem('ps_worker_session', JSON.stringify(worker));
      launchDashboard();
      return;
    }

    // 2. ADMIN OR CUSTOMER LOGIN
    if (!passVal) return showLoginError('कृपया पासवर्ड दर्ज करें।');

    let loginEmail = idVal;
    if (currentRole === 'customer' && !idVal.includes('@')) {
      const cleanPhone = idVal.replace(/[^0-9]/g, '');
      loginEmail = `${cleanPhone}@psconstructions.in`;
    }

    if (currentRole === 'admin' && idVal.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
      loginEmail = ADMIN_EMAIL;
    }

    let { data, error } = await db.auth.signInWithPassword({
      email: loginEmail,
      password: passVal
    });

    if (error && currentRole === 'customer' && !idVal.includes('@')) {
      const { data: prof } = await db.from('profiles').select('email').eq('phone', idVal).eq('role', 'customer').maybeSingle();
      if (prof?.email && prof.email !== loginEmail) {
        const retry = await db.auth.signInWithPassword({ email: prof.email, password: passVal });
        if (!retry.error) {
          data = retry.data;
          error = null;
        }
      }
    }

    if (error) {
      if (error.message.includes('Invalid login credentials')) {
        return showLoginError('गलत Email/मोबाइल नंबर या पासवर्ड दर्ज किया गया है।');
      }
      throw error;
    }

    await loadUserProfile(data.user);
  } catch (err) {
    showLoginError(err.message || 'Login असफल रहा। कृपया पुनः प्रयास करें।');
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
    }
  }
}

function showLoginError(msg) {
  const el = $('loginAlert');
  if (el) {
    el.textContent = msg;
    el.classList.remove('hidden');
  }
}

async function loadUserProfile(authUser) {
  let { data: profile } = await db.from('profiles').select('*').eq('id', authUser.id).maybeSingle();
  
  if (!profile) {
    const roleToSet = authUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() ? 'admin' : 'customer';
    const newProfile = {
      id: authUser.id,
      email: authUser.email,
      name: authUser.user_metadata?.name || (roleToSet === 'admin' ? 'Prakash Swami' : 'Customer'),
      role: roleToSet,
      phone: authUser.user_metadata?.phone || '',
      is_active: true
    };
    await db.from('profiles').upsert(newProfile);
    profile = newProfile;
  }

  currentUser = profile;
  currentRole = profile.role;
  launchDashboard();
}

  }

async function loadNotificationsBadge() {
  if (!db || !currentUser) return;

      const [enqRes, attRes] = await Promise.all([
        db.from('enquiries').select('id', { count: 'exact' }).eq('status', 'pending'),
        db.from('attendance').select('id', { count: 'exact' }).eq('status', 'pending')
      ]);
      count = (enqRes.count || 0) + (attRes.count || 0);
    } catch(e) {}
  } else if (currentRole === 'customer') {
    try {
      const { count: cCount } = await db.from('daily_updates').select('id', { count: 'exact' });
      count = cCount || 0;
    } catch(e) {}
  }

  const isSeen = sessionStorage.getItem('ps_notifs_dismissed') === 'true';

      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }
}

function parseContractDetails(c) {
  let rateType = 'total'; // 'total' | 'sqft' | 'wage'
  let rateDetail = '';
  let scopeText = 'नींव खुदाई, दीवार चिनाई, RCC छत ढलाई एवं प्लास्टर कार्य';
  let notes = '';

  if (c?.scope && typeof c.scope === 'string') {
    const trimmed = c.scope.trim();
    if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
      try {
        const obj = JSON.parse(trimmed);
        rateType = obj.rate_type || (obj.rate_detail ? 'sqft' : 'total');
        rateDetail = obj.rate_detail || '';
        scopeText = obj.scope || scopeText;
        notes = obj.notes || '';
      } catch(e) {
        scopeText = c.scope;
      }
    } else {
      scopeText = c.scope;
    }
  }

  const rateLabels = {
    'total': 'लम्प-सम कुल तय राशि (Lump-Sum Total Amount)',
    'sqft': 'स्क्वेयर फीट दर अनुसार (Per Sq.Ft Rate)',
    'wage': 'दैनिक मजदूरी दर अनुसार (Daily Wage Basis)'
  };

  return {
    rateType: rateType === 'lumpsum' ? 'total' : rateType,
    rateTypeLabel: rateLabels[rateType === 'lumpsum' ? 'total' : rateType] || rateLabels['total'],
    rateDetail,
    scopeText,
    notes
  };
}

function switchContractRateOption(type) {
  selectedRateTypeInModal = type;
  
  ['total', 'sqft', 'wage'].forEach(t => {
    const card = $('cardOpt' + t.charAt(0).toUpperCase() + t.slice(1));
    const box = $('boxOpt' + t.charAt(0).toUpperCase() + t.slice(1));
    if (card) card.classList.toggle('selected', t === type);
    if (box) box.style.display = (t === type) ? 'block' : 'none';
  });

  const radio = document.querySelector(`input[name="rateOpt"][value="${type}"]`);
  if (radio) radio.checked = true;
}

async function saveContractTermsSubmit(e, contractId) {
  e.preventDefault();
  const rateType = selectedRateTypeInModal;
  let rateDetail = '';
  let finalAmount = 0;

  if (rateType === 'total') {
    finalAmount = Number($('inputTotalAmt')?.value) || 0;
    rateDetail = `₹${finalAmount.toLocaleString('en-IN')} लम्प-सम तय राशि`;
  } else if (rateType === 'sqft') {
    rateDetail = $('inputSqftDetail')?.value.trim() || '₹180 प्रति वर्ग फीट (छत नाप अनुसार)';
    finalAmount = Number($('inputSqftTotal')?.value) || 0;
  } else if (rateType === 'wage') {
    rateDetail = $('inputWageDetail')?.value.trim() || '₹750 मिस्त्री / ₹450 लेबर प्रतिदिन';
    finalAmount = Number($('inputWageTotal')?.value) || 0;
  }

  const scopeText = $('ectScope')?.value.trim() || 'नींव खुदाई, दीवार चिनाई, RCC छत ढलाई एवं प्लास्टर कार्य';
  const notes = $('ectNotes')?.value.trim() || '';

  const packedScope = JSON.stringify({
    rate_type: rateType,
    rate_detail: rateDetail,
    scope: scopeText,
    notes: notes
  });

  await db.from('contracts').update({
    final_amount: finalAmount,
    scope: packedScope,
    proposed_by: currentUser ? currentUser.id : null,
    admin_approved_at: null,
    customer_approved_at: null,
    status: 'amount_discussion'
  }).eq('id', contractId);

  const { data: c } = await db.from('contracts').select('project_id').eq('id', contractId).single();
  if (c?.project_id) {
    await db.from('projects').update({ total_amount: finalAmount }).eq('id', c.project_id);
  }

  alert('अनुबंध में आपकी चयनित दर सुरक्षित हो गई है! अब अनुबंध फाइनल लॉक हो गया है। ✅');
  openFullAgreementModal(contractId);
}

async function openFullAgreementModal(contractId) {
  const { data: c } = await db.from('contracts')
    .select('*, project:project_id(name, address, customer:customer_id(name, phone, address))')
    .eq('id', contractId)
    .single();

  if (!c) return;
  const isLocked = c.status === 'locked' || (c.admin_approved_at && c.customer_approved_at);

  const modal = $('modalContainer');
  modal.classList.remove('hidden');
  modal.innerHTML = `
    <div class="modal-card" style="max-width:850px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--border); padding-bottom:10px;">
        <h3><i class="fa-solid fa-file-contract" style="color:var(--accent);"></i> करारनामा / अनुबंध विवरण (v${c.version})</h3>
        <button onclick="$('modalContainer').classList.add('hidden')" style="border:0; background:transparent; font-size:24px; cursor:pointer; color:var(--muted);">&times;</button>
      </div>

      <div style="margin-bottom:14px; max-height: calc(82vh - 140px); overflow-y:auto; padding-right:6px;">
        ${generateLegalAgreementHtml(c, isLocked)}
      </div>

      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px; border-top:1px solid var(--border); padding-top:12px; flex-wrap:wrap;">
        ${!isLocked ? `
          <button class="btn-secondary" onclick="openEditContractTermsModal('${c.id}')"><i class="fa-solid fa-pen-to-square"></i> दर व राशि बदलें (3 विकल्प)</button>
          ${!c.admin_approved_at && currentRole === 'admin' ? `<button class="btn-primary" style="width:auto; background:var(--success);" onclick="adminApproveContract('${c.id}')"><i class="fa-solid fa-check"></i> Approve Contract as Admin</button>` : ''}
          ${!c.customer_approved_at && currentRole === 'customer' ? `<button class="btn-primary" style="width:auto; background:var(--success);" onclick="approveCustomerContract('${c.id}')"><i class="fa-solid fa-file-signature"></i> Approve Contract Digitally</button>` : ''}
        ` : `
          <span style="color:var(--success); font-weight:700; display:inline-flex; align-items:center; gap:6px;"><i class="fa-solid fa-lock"></i> अनुबंध दोनों पक्षों द्वारा स्वीकृत व लॉक है</span>
        `}
      </div>
    </div>
  `;
}

async function adminApproveContract(contractId) {
  if (!confirm('क्या आप इस अनुबंध को अपनी स्वीकृति (Admin Approval) देना चाहते हैं?')) return;
  const now = new Date().toISOString();
  const { data: c } = await db.from('contracts').select('*, project:project_id(*)').eq('id', contractId).single();
  const isFullyApproved = Boolean(c.customer_approved_at);

  await db.from('contracts').update({
    admin_approved_at: now,
    admin_approved_by: currentUser.id,
    status: isFullyApproved ? 'locked' : 'amount_discussion',
    locked_at: isFullyApproved ? now : null
  }).eq('id', contractId);

  if (isFullyApproved && c.project_id) {
    await db.from('projects').update({ status: 'active', total_amount: c.final_amount }).eq('id', c.project_id);
    alert('अनुबंध पूरी तरह लॉक हो गया है और प्रोजेक्ट शुरू हो चुका है! 🔒');
  } else {
    alert('एडमिन स्वीकृति दर्ज हो गई!');
  }

  $('modalContainer').classList.add('hidden');
  openView('projects');
}

async function approveCustomerContract(contractId) {
  if (!confirm('क्या आप इस अनुबंध को अपनी डिजिटल स्वीकृति देना चाहते हैं?')) return;
  const now = new Date().toISOString();
  const { data: c } = await db.from('contracts').select('*, project:project_id(*)').eq('id', contractId).single();
  const isFullyApproved = Boolean(c.admin_approved_at);

  await db.from('contracts').update({
    customer_approved_at: now,
    customer_approved_by: currentUser.id,
    status: isFullyApproved ? 'locked' : 'amount_discussion',
    locked_at: isFullyApproved ? now : null
  }).eq('id', contractId);

  if (isFullyApproved && c.project_id) {
    await db.from('projects').update({ status: 'active', total_amount: c.final_amount }).eq('id', c.project_id);
    alert('अनुबंध पूरी तरह स्वीकृत व लॉक हो गया है और प्रोजेक्ट शुरू हो चुका है! 🔒');
  } else {
    alert('आपकी डिजिटल स्वीकृति दर्ज हो गई है!');
  }

  $('modalContainer').classList.add('hidden');
  openView('my_projects');
}

async function getMergedGalleryProjects() {
  let dbItems = [];
  try {
    const { data, error } = await db.from('gallery_projects').select('*').order('created_at', { ascending: false });
    if (!error && data) dbItems = data;
  } catch(e) {}

  const deletedIds = JSON.parse(localStorage.getItem('ps_deleted_gallery_ids') || '[]');
  const activeDefaults = DEFAULT_GALLERY_ITEMS.filter(item => !deletedIds.includes(item.id));

  return [...dbItems, ...activeDefaults];
}

function previewGalleryProjectPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    $('gpPhotoBase64').value = evt.target.result;
    $('gpPhotoPreview').innerHTML = `<img src="${evt.target.result}" style="width:60px; height:60px; border-radius:8px; object-fit:cover; border:2px solid var(--accent);">`;
  };
  reader.readAsDataURL(file);
}

async function saveGalleryProjectSubmit(e) {
  e.preventDefault();
  const title = $('gpTitle').value.trim();
  const location = $('gpLocation').value.trim();
  const category = $('gpCategory').value;
  const description = $('gpDesc').value.trim();
  const photoBase64 = $('gpPhotoBase64').value;

  if (!photoBase64) return alert('कृपया एक फ़ोटो चुनें!');

  const newProject = {
    title: title,
    location: location,
    category: category,
    description: description,
    image_url: photoBase64,
    created_by: currentUser?.id,
    created_at: new Date().toISOString()
  };

  try {
    await db.from('gallery_projects').insert(newProject);
  } catch(err) {
    console.error('Supabase gallery insert err:', err);
  }

  alert('प्रोजेक्ट फ़ोटो सफलतापूर्वक मुख्य वेबसाइट पर जुड़ गई है! ✅');
  $('modalContainer').classList.add('hidden');
  openView('gallery_mgmt');
}

async function updateGalleryProjectSubmit(e, id) {
  e.preventDefault();
  const title = $('egpTitle').value.trim();
  const location = $('egpLocation')?.value.trim() || 'साइट';
  const category = $('egpCategory').value;
  const description = $('egpDesc').value.trim();
  const photoBase64 = $('egpPhotoBase64').value;

  if (id.startsWith('def-')) {
    await db.from('gallery_projects').upsert({
      id: id,
      title: title,
      location: location,
      category: category,
      description: description,
      image_url: photoBase64,
      created_at: new Date().toISOString()
    });
  } else {
    await db.from('gallery_projects').update({
      title: title,
      location: location,
      category: category,
      description: description,
      image_url: photoBase64
    }).eq('id', id);
  }

  alert('प्रोजेक्ट विवरण अपडेट हो गया!');
  $('modalContainer').classList.add('hidden');
  openView('gallery_mgmt');
}

async function deleteGalleryProject(id) {
  if (!confirm('क्या आप इस फ़ोटो को वेबसाइट गैलरी से हटाना चाहते हैं?')) return;
  
  if (id.startsWith('def-')) {
    const deletedIds = JSON.parse(localStorage.getItem('ps_deleted_gallery_ids') || '[]');
    if (!deletedIds.includes(id)) deletedIds.push(id);
    localStorage.setItem('ps_deleted_gallery_ids', JSON.stringify(deletedIds));
  } else {
    await db.from('gallery_projects').delete().eq('id', id);
  }

  alert('फ़ोटो हटा दी गई!');
  openView('gallery_mgmt');
}

async function handleUniversalSearch(query) {
  query = query.trim().toLowerCase();
  const resCard = $('searchResultsCard');
  const resList = $('searchResultsList');
  if (!query) { if (resCard) resCard.style.display = 'none'; return; }

  if (resCard) resCard.style.display = 'block';
  if (resList) resList.innerHTML = 'Searching...';

  const [cRes, pRes, wRes] = await Promise.all([
    db.from('profiles').select('id, name, phone, email, role').ilike('name', `%${query}%`),
    db.from('projects').select('id, name, address, status').ilike('name', `%${query}%`),
    db.from('profiles').select('id, name, phone').eq('role', 'worker').ilike('name', `%${query}%`)
  ]);

  let html = '<ul style="list-style:none;">';
  (cRes.data || []).forEach(c => html += `<li style="padding:8px 0; border-bottom:1px solid #eee;"><b>[User - ${c.role}]</b> ${c.name} (${c.phone || c.email})</li>`);
  (pRes.data || []).forEach(p => html += `<li style="padding:8px 0; border-bottom:1px solid #eee;"><b>[Project]</b> ${p.name} - ${p.address} (${p.status})</li>`);
  html += '</ul>';

  if (resList) resList.innerHTML = html === '<ul style="list-style:none;"></ul>' ? 'No matching records found.' : html;
}

function switchEnquirySubTab(tab) {
  activeEnqTab = tab;
  document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
  if (tab === 'customer_enq') {
    $('tabContentCustomerEnq').classList.remove('hidden');
    $('tabContentWorkerAtt').classList.add('hidden');
  } else {
    $('tabContentCustomerEnq').classList.add('hidden');
    $('tabContentWorkerAtt').classList.remove('hidden');
  }
}

async function approveEnquiry(enqId, customerId, work, address, budget) {
  if (!confirm('इस इन्क्वायरी को अप्रूव करके नया प्रोजेक्ट और कॉन्ट्रैक्ट बनाएँ?')) return;
  const { data: proj } = await db.from('projects').insert({
    customer_id: customerId,
    name: work.substring(0, 40),
    address: address,
    total_amount: budget || 0,
    status: 'planning',
    progress: 0
  }).select().single();

  await db.from('contracts').insert({
    project_id: proj.id,
    version: 1,
    status: 'amount_discussion',
    final_amount: budget || 0,
    scope: work,
    proposed_by: currentUser.id
  });

  await db.from('enquiries').update({ status: 'approved' }).eq('id', enqId);
  alert('इन्क्वायरी स्वीकृत! प्रोजेक्ट और कॉन्ट्रैक्ट तैयार हो गया है।');
  openView('projects');
}

async function deleteEnquiry(id) {
  if (!confirm('क्या आप इस इन्क्वायरी को हटाना चाहते हैं?')) return;
  await db.from('enquiries').delete().eq('id', id);
  openView('enquiries');
}

  await db.from('attendance').update({ status: 'approved', approved_by: currentUser.id, approved_at: new Date().toISOString() }).eq('id', attId);

  const projects = projRes.data || [];

}

function previewAdminDailyUpdatePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    $('adPhotoBase64').value = evt.target.result;
    $('adPhotoPreview').innerHTML = `<img src="${evt.target.result}" style="width:60px; height:60px; border-radius:8px; object-fit:cover; border:2px solid var(--accent);">`;
  };
  reader.readAsDataURL(file);
}

async function saveAdminDailyUpdateSubmit(e) {
  e.preventDefault();
  const projId = $('adProjectSelect').value || null;
  const desc = $('adDesc').value.trim();
  const photo = $('adPhotoBase64').value;

  if (!photo) return alert('कृपया एक कार्य फ़ोटो चुनें!');

  await db.from('daily_updates').insert({
    project_id: projId,
    description: desc,
    image_url: photo,
    created_by: currentUser ? currentUser.id : null,
    created_at: new Date().toISOString()
  });

  alert('दैनिक कार्य अपडेट सफलतापूर्वक दर्ज हो गया! ✅');
  $('modalContainer').classList.add('hidden');
  openView('daily_updates');
}

async function deleteDailyUpdate(id) {
  if (!confirm('क्या आप इस दैनिक अपडेट को हटाना चाहते हैं?')) return;
  await db.from('daily_updates').delete().eq('id', id);
  openView('daily_updates');
}

async function recordCustomerPaymentSubmit(e, customerId, customerName, customerPhone) {
  e.preventDefault();
  await db.from('payments').insert({
    customer_id: customerId,
    project_id: $('cpProjId')?.value || null,
    direction: 'customer_to_business',
    amount: Number($('cpAmount').value),
    method: $('cpMethod').value,
    reference: $('cpRef').value,
    note: $('cpNote')?.value || null,
    created_by: currentUser.id,
    paid_at: new Date().toISOString()
  });

  alert('पेमेंट रिकॉर्ड दर्ज हो गया!');
  openCustomerPaymentModal(customerId, customerName, customerPhone);
}

async function deleteCustomerPaymentRecord(payId, customerId, customerName, customerPhone) {
  if (!confirm('क्या आप इस पेमेंट रिकॉर्ड को हटाना चाहते हैं?')) return;
  await db.from('payments').delete().eq('id', payId);
  openCustomerPaymentModal(customerId, customerName, customerPhone);
}

async function saveCustomerRecord(e) {
  e.preventDefault();
  const phone = $('acPhone').value.trim();
  const email = $('acEmail').value.trim() || `${phone}@psconstructions.in`;
  const name = $('acName').value.trim();
  const address = $('acAddress').value.trim();
  const pass = $('acPass').value.trim();

  const { data: auth, error } = await db.auth.signUp({ email, password: pass });
  if (error) return alert('त्रुटि: ' + error.message);

  await db.from('profiles').insert({
    id: auth.user.id,
    name: name,
    phone: phone,
    email: email,
    address: address,
    role: 'customer'
  });

  alert('ग्राहक सफलतापूर्वक पंजीकृत हुआ!');
  $('modalContainer').classList.add('hidden');
  openView('customers');
}

async function renderAdminPayments(container) {
  const { data: payments } = await db.from('payments')
    .select('*, customer:customer_id(name, phone), worker:worker_id(name, phone), project:project_id(name)')
    .order('paid_at', { ascending: false });

  let totalReceived = 0;
  let totalPaidOut = 0;
  (payments || []).forEach(p => {
    if (p.direction === 'customer_to_business') totalReceived += Number(p.amount || 0);
    else totalPaidOut += Number(p.amount || 0);
  });

  container.innerHTML = `
    <div class="page-head">
      <h1>पेमेंट एवं लेनदेन रिकॉर्ड (Payments & Ledger)</h1>
      <button class="btn-primary" style="width:auto;" onclick="openRecordDirectPaymentModal()"><i class="fa-solid fa-plus-circle"></i> नया लेनदेन दर्ज करें</button>
    </div>

    <div class="stats-grid" style="grid-template-columns: repeat(2, 1fr); margin-bottom:20px;">
      <div class="stat-card" style="padding:16px;">
        <div><h4>कुल प्राप्त राशि (Inflow - Customers)</h4><div class="val" style="color:var(--success); font-size:22px;">₹${totalReceived.toLocaleString('en-IN')}</div></div>
        <div class="icon-box" style="background:#dcfce7; color:#16a34a;"><i class="fa-solid fa-arrow-down"></i></div>
      </div>
      <div class="stat-card" style="padding:16px;">
        <div><h4>कुल दिया गया भुगतान (Outflow - Workers/Expenses)</h4><div class="val" style="color:var(--danger); font-size:22px;">₹${totalPaidOut.toLocaleString('en-IN')}</div></div>
        <div class="icon-box" style="background:#fee2e2; color:#dc2626;"><i class="fa-solid fa-arrow-up"></i></div>
      </div>
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
      <div class="table-container">
        <table>
          <thead><tr><th>दिनांक</th><th>पार्टी / नाम</th><th>प्रोजेक्ट</th><th>प्रकार</th><th>माध्यम</th><th>राशि (₹)</th><th>Ref / UTR</th><th>Note</th><th>Action</th></tr></thead>
          <tbody>
            ${(payments || []).length === 0 ? '<tr><td colspan="9" style="text-align:center; padding:24px;">कोई पेमेंट रिकॉर्ड नहीं है।</td></tr>' : ''}
            ${(payments || []).map(p => {
              const partyName = safeStr(p.customer?.name || p.worker?.name, 'Direct Party');
              const partyPhone = p.customer?.phone || p.worker?.phone || '';
              const isInflow = p.direction === 'customer_to_business';

              return `
                <tr>
                  <td>${new Date(p.paid_at || p.created_at).toLocaleDateString('en-IN')}</td>
                  <td><b>${partyName}</b>${partyPhone ? `<br><small style="color:var(--muted);">${partyPhone}</small>` : ''}</td>
                  <td>${safeStr(p.project?.name, '-')}</td>
                  <td><span class="btn-sm ${isInflow ? 'btn-success' : 'btn-danger'}">${isInflow ? 'प्राप्त (In)' : 'भुगतान (Out)'}</span></td>
                  <td><span class="btn-sm btn-edit">${safeStr(p.method, 'UPI')}</span></td>
                  <td><b style="font-size:15px; color:${isInflow ? 'var(--success)' : 'var(--danger)'};">₹${Number(p.amount || 0).toLocaleString('en-IN')}</b></td>
                  <td>${safeStr(p.reference, '-')}</td>
                  <td>${safeStr(p.note, '-')}</td>
                  <td>
                    <div class="btn-action-group">
                      <button class="btn-sm btn-edit" onclick="openEditPaymentModal('${p.id}')"><i class="fa-solid fa-pen"></i> Edit</button>
                      <button class="btn-sm btn-danger" onclick="deletePayment('${p.id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

async function openEditPaymentModal(paymentId) {
  const { data: p } = await db.from('payments').select('*, project:project_id(name), customer:customer_id(name), worker:worker_id(name)').eq('id', paymentId).single();
  if (!p) return;

  const modal = $('modalContainer');
  modal.classList.remove('hidden');
  modal.innerHTML = `
    <div class="modal-card" style="max-width:520px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--border); padding-bottom:8px;">
        <h3>पेमेंट रिकॉर्ड एडिट करें</h3>
        <button onclick="$('modalContainer').classList.add('hidden')" style="border:0; background:transparent; font-size:24px; cursor:pointer; color:var(--muted);">&times;</button>
      </div>
      <form onsubmit="updatePaymentRecordSubmit(event, '${paymentId}')">
        <div class="form-group"><label>राशि (Amount ₹)</label><input id="epayAmount" type="number" value="${p.amount || 0}" required></div>
        <div class="form-group">
          <label>माध्यम</label>
          <select id="epayMethod">
            <option value="UPI" ${p.method === 'UPI' ? 'selected' : ''}>UPI (GPay / PhonePe)</option>
            <option value="Bank" ${p.method === 'Bank' ? 'selected' : ''}>Bank Transfer</option>
            <option value="Cash" ${p.method === 'Cash' ? 'selected' : ''}>Cash (नकद)</option>
          </select>
        </div>
        <div class="form-group"><label>UTR / Transaction Ref</label><input id="epayRef" value="${escapeAttr(p.reference || '')}"></div>
        <div class="form-group"><label>Note / विवरण</label><input id="epayNote" value="${escapeAttr(p.note || '')}"></div>
        <div style="display:flex; gap:10px; justify-content:flex-end;">
          <button type="button" class="btn-secondary" onclick="$('modalContainer').classList.add('hidden')">रद्द करें</button>
          <button type="submit" class="btn-primary" style="width:auto;">अपडेट सेव करें</button>
        </div>
      </form>
    </div>
  `;
}

async function updatePaymentRecordSubmit(e, paymentId) {
  e.preventDefault();
  await db.from('payments').update({
    amount: Number($('epayAmount').value),
    method: $('epayMethod').value,
    reference: $('epayRef').value.trim() || null,
    note: $('epayNote').value.trim() || null
  }).eq('id', paymentId);

  alert('पेमेंट रिकॉर्ड अपडेट हो गया!');
  $('modalContainer').classList.add('hidden');
  openView('payments');
}

async function deletePayment(id) {
  if (!confirm('क्या आप इस पेमेंट रिकॉर्ड को हटाना चाहते हैं?')) return;
  await db.from('payments').delete().eq('id', id);
  openView('payments');
}

function openRecordDirectPaymentModal() {
  db.from('profiles').select('id, name, phone, role').order('name').then(({ data: users }) => {
    const customers = (users || []).filter(u => u.role === 'customer');
    const workers = (users || []).filter(u => u.role === 'worker');

    const modal = $('modalContainer');
    modal.classList.remove('hidden');
    modal.innerHTML = `
      <div class="modal-card" style="max-width:520px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--border); padding-bottom:8px;">
          <h3>नया लेनदेन रिकॉर्ड दर्ज करें</h3>
          <button onclick="$('modalContainer').classList.add('hidden')" style="border:0; background:transparent; font-size:24px; cursor:pointer; color:var(--muted);">&times;</button>
        </div>

        <form onsubmit="saveDirectPaymentRecordSubmit(event)">
          <div class="form-group">
            <label>लेनदेन प्रकार</label>
            <select id="rdpDir" onchange="togglePartySelect(this.value)">
              <option value="customer_to_business">ग्राहक से प्राप्त राशि (Inflow from Customer)</option>
              <option value="business_to_worker">कारीगर/लेबर को भुगतान (Outflow to Worker)</option>
            </select>
          </div>

          <div class="form-group" id="custSelectGroup">
            <label>ग्राहक चुनें</label>
            <select id="rdpCustId">
              <option value="">-- ग्राहक चुनें --</option>
              ${customers.map(c => `<option value="${c.id}">${c.name} (${c.phone || '-'})</option>`).join('')}
            </select>
          </div>

          <div class="form-group hidden" id="workerSelectGroup">
            <label>कारीगर/लेबर चुनें</label>
            <select id="rdpWorkerId">
              <option value="">-- कारीगर चुनें --</option>
              ${workers.map(w => `<option value="${w.id}">${w.name} (${w.phone || '-'})</option>`).join('')}
            </select>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="form-group">
              <label>राशि (Amount ₹)</label>
              <input id="rdpAmount" type="number" required placeholder="50000">
            </div>
            <div class="form-group">
              <label>माध्यम (Method)</label>
              <select id="rdpMethod">
                <option value="UPI">UPI (GPay / PhonePe)</option>
                <option value="Bank">Bank Transfer</option>
                <option value="Cash">Cash (नकद)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>UTR / Transaction Ref</label>
            <input id="rdpRef" placeholder="12 अंकों का UTR या रसीद नंबर">
          </div>

          <div class="form-group">
            <label>Note / विवरण</label>
            <input id="rdpNote" placeholder="उदा. छत ढलाई किश्त">
          </div>

          <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:16px;">
            <button type="button" class="btn-secondary" onclick="$('modalContainer').classList.add('hidden')">रद्द करें</button>
            <button type="submit" class="btn-primary" style="width:auto;">रिकॉर्ड सेव करें</button>
          </div>
        </form>
      </div>
    `;
  });
}

function togglePartySelect(dir) {
  if (dir === 'customer_to_business') {
    $('custSelectGroup')?.classList.remove('hidden');
    $('workerSelectGroup')?.classList.add('hidden');
  } else {
    $('custSelectGroup')?.classList.add('hidden');
    $('workerSelectGroup')?.classList.remove('hidden');
  }
}

async function saveDirectPaymentRecordSubmit(e) {
  e.preventDefault();
  const dir = $('rdpDir').value;
  const custId = dir === 'customer_to_business' ? $('rdpCustId').value : null;
  const workerId = dir === 'business_to_worker' ? $('rdpWorkerId').value : null;

  await db.from('payments').insert({
    customer_id: custId || null,
    worker_id: workerId || null,
    direction: dir,
    amount: Number($('rdpAmount').value),
    method: $('rdpMethod').value,
    reference: $('rdpRef').value.trim() || null,
    note: $('rdpNote').value.trim() || null,
    created_by: currentUser.id,
    paid_at: new Date().toISOString()
  });

  alert('नया लेनदेन रिकॉर्ड दर्ज हो गया!');
  $('modalContainer').classList.add('hidden');
  openView('payments');
}

        <p style="font-size:13px; color:#94a3b8; margin-bottom:4px;"><i class="fa-solid fa-envelope" style="color:var(--gold);"></i> ${safeStr(u?.email, '-')}</p>
        <p style="font-size:13px; color:#cbd5e1;"><i class="fa-solid fa-location-dot" style="color:var(--accent);"></i> ${safeStr(u?.address, 'मंडावरा, राजस्थान')}</p>
      </div>
    </div>

    <!-- Edit Profile Form -->
    <div class="card" style="max-width:700px;">
      <h3 style="margin-bottom:16px; font-size:17px; color:var(--primary);"><i class="fa-solid fa-pen-to-square" style="color:var(--accent);"></i> प्रोफ़ाइल विवरण एवं फ़ोटो बदलें</h3>
      
      <form onsubmit="updateMyProfile(event)">

        <div class="form-group" style="background:#f8fafc; padding:14px; border-radius:12px; border:1.5px dashed #cbd5e1; margin-bottom:18px;">
          <label style="font-weight:700; color:#334155; display:flex; align-items:center; gap:8px;">
            <i class="fa-solid fa-camera" style="color:var(--accent);"></i> अपनी प्रोफ़ाइल फ़ोटो अपलोड करें (Profile Photo)

            <div id="mpPhotoPreview">
              ${u?.image_url ? `<img src="${u.image_url}" style="width:52px; height:52px; border-radius:50%; object-fit:cover; border:2px solid var(--gold);">` : '<span style="font-size:12px; color:var(--muted);">कोई फ़ोटो नहीं चुनी</span>'}
            </div>
          </div>
          <input type="hidden" id="mpPhotoBase64" value="${u?.image_url || ''}">

        <div class="form-group">
          <label>पूरा नाम (Full Name)</label>
          <input id="mpName" value="${escapeAttr(u?.name || '')}" required placeholder="उदा. हर्ष स्वामी">
        </div>

        <div class="form-group">
          <label>मोबाइल नंबर (Mobile Number)</label>
          <input id="mpPhone" type="tel" value="${escapeAttr(u?.phone || '')}" required placeholder="उदा. 9929718264">
        </div>

        <div class="form-group">
          <label>ईमेल (Email Address)</label>
          <input id="mpEmail" type="email" value="${escapeAttr(u?.email || '')}" placeholder="उदा. customer@gmail.com">
        </div>

        <div class="form-group">
          <label>पता / गाँव (Full Site Address / Village)</label>
          <textarea id="mpAddress" rows="2" placeholder="उदा. ग्राम व पोस्ट: मंडावरा, तहसील: उदयपुरवाटी, जिला: झुंझुनूं (राजि.)">${escapeAttr(u?.address || '')}</textarea>
        </div>

        <button type="submit" class="btn-primary" style="width:auto; margin-top:10px; padding:12px 28px;">
          <i class="fa-solid fa-floppy-disk"></i> प्रोफाइल सेव करें
        </button>
      </form>
    </div>
  `;
}

function previewCustomerProfilePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    $('mpPhotoBase64').value = evt.target.result;
    $('mpPhotoPreview').innerHTML = `<img src="${evt.target.result}" style="width:52px; height:52px; border-radius:50%; object-fit:cover; border:2.5px solid var(--accent);">`;
  };
  reader.readAsDataURL(file);
}

async function updateMyProfile(e) {
  e.preventDefault();
  const name = $('mpName').value.trim();
  const phone = $('mpPhone').value.trim();
  const email = $('mpEmail').value.trim();
  const address = $('mpAddress').value.trim();
  const photo = $('mpPhotoBase64').value;

  await db.from('profiles').update({
    name: name,
    phone: phone,
    email: email,
    address: address,
    image_url: photo || null
  }).eq('id', currentUser.id);

  if (currentUser) {
    currentUser.name = name;
    currentUser.phone = phone;
    currentUser.email = email;
    currentUser.address = address;
    currentUser.image_url = photo || null;
  }

  alert('आपकी प्रोफ़ाइल और फ़ोटो सफलतापूर्वक अपडेट हो गई है! ✅');
  openView('my_profile');
}

async function renderCustomerProjects(container) {
  const [projRes, contRes, payRes, setRes] = await Promise.all([
    db.from('projects').select('*').eq('customer_id', currentUser ? currentUser.id : '').order('created_at', { ascending: false }),
    db.from('contracts').select('*, project:project_id(name, address)'),
    db.from('payments').select('project_id, amount').eq('direction', 'customer_to_business'),
    db.from('business_settings').select('*').eq('id', true).maybeSingle()
  ]);

  const projects = projRes.data || [];
  const contracts = contRes.data || [];
  const payments = payRes.data || [];
  const adminUpi = setRes.data?.upi_id || '9785438345@axl';

  container.innerHTML = `
    <div class="page-head">
      <h1>मेरे प्रोजेक्ट्स व अनुबंध</h1>
      <button class="btn-primary" style="width:auto;" onclick="openView('my_enquiries')"><i class="fa-solid fa-plus"></i> नया काम / इन्क्वायरी भेजें</button>
    </div>
    <div class="card" style="padding:0; overflow:hidden;">
      <div class="table-container">
        <table>
          <thead><tr><th>प्रोजेक्ट नाम</th><th>अनुबंध पत्र</th><th>प्रगति</th><th>स्टेटस</th><th>कुल राशि</th><th>जमा</th><th>बकाया (Due)</th><th>Action</th></tr></thead>
          <tbody>
            ${projects.length === 0 ? '<tr><td colspan="8" style="text-align:center; padding:24px;">आपका कोई प्रोजेक्ट नहीं है।</td></tr>' : ''}
            ${projects.map(p => {
              const contract = contracts.find(c => c.project_id === p.id);
              const totalAmt = Number(p.total_amount || 0);
              const paidAmt = payments.filter(pay => pay.project_id === p.id).reduce((sum, pay) => sum + Number(pay.amount || 0), 0);
              const remainAmt = totalAmt - paidAmt;

              return `
                <tr>
                  <td><b>${p.name}</b><br><small>${p.address || ''}</small></td>
                  <td>${contract ? `<button class="btn-sm btn-gold" onclick="openFullAgreementModal('${contract.id}')"><i class="fa-solid fa-file-signature"></i> अनुबंध देखें</button>` : 'तैयार हो रहा है...'}</td>
                  <td><b>${p.progress}%</b><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${p.progress}%;"></div></div></td>
                  <td><span class="btn-sm btn-success">${p.status}</span></td>
                  <td>₹${totalAmt.toLocaleString('en-IN')}</td>
                  <td style="color:var(--success); font-weight:700;">₹${paidAmt.toLocaleString('en-IN')}</td>
                  <td style="color:var(--danger); font-weight:700;">₹${remainAmt.toLocaleString('en-IN')}</td>
                  <td>
                    ${remainAmt > 0 ? `
                      <a href="upi://pay?pa=${adminUpi}&pn=Prakash%20Swami%20Constructions&cu=INR" class="btn-sm btn-gold" style="text-decoration:none;">
                        <i class="fa-solid fa-bolt"></i> Pay (UPI)
                      </a>
                    ` : '<span class="btn-sm btn-success">Paid ✅</span>'}
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function previewCustomerSignupPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    $('suPhotoBase64').value = evt.target.result;
    $('suPhotoPreview').innerHTML = `<img src="${evt.target.result}" style="width:46px; height:46px; border-radius:50%; object-fit:cover; border:2px solid var(--accent);">`;
  };
  reader.readAsDataURL(file);
}

async function handleCustomerSignup(e) {
  e.preventDefault();
  const phone = $('suPhone').value.trim();
  const rawEmail = $('suEmail')?.value.trim();
  const email = rawEmail || `${phone}@psconstructions.in`;
  const name = $('suName').value.trim();
  const address = $('suAddress').value.trim();
  const pass = $('suPass').value.trim();
  const photo = $('suPhotoBase64')?.value || null;

  const { data: auth, error } = await db.auth.signUp({ email, password: pass });
  if (error) return alert('त्रुटि: ' + error.message);

  await db.from('profiles').insert({
    id: auth.user.id,
    name: name,
    phone: phone,
    email: email,
    address: address,
    image_url: photo,
    role: 'customer',
    is_active: true
  });

  alert('खाता और प्रोफ़ाइल फ़ोटो सफलतापूर्वक दर्ज हो गया! अब लॉगिन करें। ✅');
  $('modalContainer').classList.add('hidden');
  selectRole('customer');
  $('loginId').value = phone;
  $('loginPassword').value = pass;
}

async function renderWorkerAttendance(container) {

      ${todayAtt ? `
        <div style="background:#dcfce7; padding:16px; border-radius:10px; color:#166534; font-weight:700; display:flex; align-items:center; gap:10px;">
          <i class="fa-solid fa-circle-check fa-2x" style="color:var(--success);"></i>

        </table>
      </div>
    </div>
  `;
}

let attStream = null;
let capturedFaceBase64 = null;

async function startAttendanceCamera() {
  const video = $('attVideo');
  try {
    attStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = attStream;
    video.style.display = 'block';
    $('btnStartCam').style.display = 'none';
    $('btnCapture').style.display = 'inline-flex';
  } catch (err) {
    alert('कैमरा शुरू करने में समस्या: ' + err.message);
  }
}

async function captureAndVerifyFaceAttendance() {
  const video = $('attVideo');
  const canvas = $('attCanvas');
  canvas.width = video.videoWidth || 320;
  canvas.height = video.videoHeight || 240;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  capturedFaceBase64 = canvas.toDataURL('image/jpeg', 0.8);
  $('attImgPreview').innerHTML = `<img src="${capturedFaceBase64}" style="width:100%; border-radius:8px;">`;
  
  if (attStream) attStream.getTracks().forEach(t => t.stop());
  video.style.display = 'none';
  $('btnCapture').style.display = 'none';

  const today = new Date().toISOString().split('T')[0];
  await db.from('attendance').insert({
    worker_id: currentUser?.id,
    work_date: today,
    face_image_url: capturedFaceBase64,
    scanned_at: new Date().toISOString(),
    status: 'pending'
  });

  alert('फेस स्कैन पूरा हुआ! आपकी हाजिरी एडमिन अप्रूवल के लिए भेज दी गई है।');
  openView('worker_attendance');
}

async function renderWorkerEarnings(container) {
  const [attRes, payRes] = await Promise.all([
    db.from('attendance').select('*').eq('worker_id', currentUser?.id).eq('status', 'approved'),
    db.from('payments').select('*').eq('worker_id', currentUser?.id).eq('direction', 'business_to_worker')
  ]);

  const dailyWage = Number(currentUser?.daily_wage || 0);
  const totalDays = (attRes.data || []).length;
  const totalEarned = totalDays * dailyWage;
  let totalReceived = (payRes.data || []).reduce((sum, p) => sum + Number(p.amount || 0), 0);
  const pendingPay = totalEarned - totalReceived;

  container.innerHTML = `
    <div class="page-head"><h1>मेरी कमाई व मजदूरी हिसाब</h1></div>
    <div class="stats-grid">
      <div class="stat-card"><div><h4>स्वीकृत कार्य दिवस</h4><div class="val">${totalDays} दिन</div></div><div class="icon-box" style="background:#e0e7ff;"><i class="fa-solid fa-calendar-check"></i></div></div>
      <div class="stat-card"><div><h4>प्राप्त मजदूरी</h4><div class="val" style="color:var(--success);">₹${totalReceived.toLocaleString('en-IN')}</div></div><div class="icon-box" style="background:#dcfce7;"><i class="fa-solid fa-wallet"></i></div></div>
      <div class="stat-card"><div><h4>बकाया मजदूरी</h4><div class="val" style="color:var(--danger);">₹${pendingPay.toLocaleString('en-IN')}</div></div><div class="icon-box" style="background:#fee2e2;"><i class="fa-solid fa-clock-rotate-left"></i></div></div>
    </div>
  `;
}
