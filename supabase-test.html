<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supabase Connection Test</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f4f6fa;color:#111827;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(620px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:28px;box-shadow:0 20px 60px #0001}.brand{font-weight:900;font-size:20px}.muted{color:#667085}.field{margin:12px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;box-sizing:border-box}.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.dot{width:12px;height:12px;border-radius:50%;background:#d1d5db}.ok{background:#16a34a}.bad{background:#dc2626}.wait{background:#f59e0b}.status{font-weight:800}.note{margin-top:18px;background:#f8fafc;padding:14px;border-radius:12px;font-size:13px;color:#475467}button{margin-top:18px;border:0;border-radius:10px;background:#101827;color:#fff;padding:12px 16px;font-weight:800;cursor:pointer}</style></head><body><main class="card"><div class="brand">Prakash Swami Constructions</div><p class="muted">Supabase connection & security foundation test</p><div class="field"><label>Supabase Project URL</label><input id="url" placeholder="https://your-project.supabase.co"></div><div class="field"><label>Publishable key</label><input id="key" type="password" placeholder="sb_publishable_..."></div><div class="row"><span class="dot wait" id="d1"></span><div><div class="status">Database API</div><small class="muted" id="m1">Waiting...</small></div></div><div class="row"><span class="dot wait" id="d2"></span><div><div class="status">RLS / public access</div><small class="muted" id="m2">Waiting...</small></div></div><div class="row"><span class="dot wait" id="d3"></span><div><div class="status">Auth service</div><small class="muted" id="m3">Waiting...</small></div></div><div class="note">यह test page credentials को GitHub में save नहीं करता। Test browser में ही चलता है और production dashboard में कोई data change नहीं करता।</div><button onclick="run()">Test शुरू करें</button></main><script>function set(n,ok,msg){document.getElementById('d'+n).className='dot '+(ok?'ok':'bad');document.getElementById('m'+n).textContent=msg}async function run(){const url=document.getElementById('url').value.trim().replace(/\/$/,'');const key=document.getElementById('key').value.trim();if(!url||!key){alert('Project URL और publishable key डालें');return}const sb=supabase.createClient(url,key);try{const r=await sb.from('profiles').select('id').limit(1);if(r.error)throw r.error;set(1,true,'Database API responded successfully');set(2,true,'RLS is active; unauthenticated request returned safely')}catch(e){set(1,false,e.message||'Database request failed');set(2,false,'Database/RLS test failed')}try{const r=await sb.auth.getSession();if(r.error)throw r.error;set(3,true,'Auth service reachable; active session: '+(r.data.session?'yes':'no'))}catch(e){set(3,false,e.message||'Auth service failed')}}</script></body></html>
